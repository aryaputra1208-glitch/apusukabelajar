<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Module — Anteraja LMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./lms-design-system.css?v=20261105b">
<link rel="stylesheet" href="./lms-glass.css?v=20261111b">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  /* Cuma layout spesifik halaman ini — token & komponen dasar dari lms-design-system.css */
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .card + .card { margin-top: 18px; }
  .file-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: var(--surface-2); border-radius: var(--r-control); margin-bottom: 6px; font-size: 13px; }
  .audio-slots { border: 1px solid var(--border); border-radius: var(--r-control); padding: 10px 12px; margin-bottom: 10px; }
  .audio-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 12px; }
  .audio-row .halaman { width: 70px; color: var(--text-2); flex-shrink: 0; }
  .audio-row input[type=file] { display: none; }
  .audio-row .audio-btn { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-control); padding: 5px 10px; font-size: 11px; cursor: pointer; }
  .audio-row audio { height: 28px; max-width: 160px; }
  .q-card { border: 1px solid var(--border); border-radius: var(--r-control); padding: 14px; margin-bottom: 12px; }
  .q-head { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
  .q-head select { margin-bottom: 0; flex: 0 0 160px; }
  .q-head input { margin-bottom: 0; flex: 1; }
  .opt-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .opt-row input[type=text] { margin-bottom: 0; flex: 1; }
  .link-add { color: var(--pink); font-weight: 700; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .btn-row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; }
  .user-chip { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }
  /* Dropdown pilih banyak (Target Level & Kompetensi) */
  .ms { position: relative; }
  .ms-btn { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-control); background: var(--surface); font-size: 13px; font-family: inherit; color: var(--text); cursor: pointer; text-align: left; }
  .ms-btn .ph { color: var(--text-3); }
  .ms.open .ms-btn { border-color: var(--pink); box-shadow: 0 0 0 3px var(--pink-bg); }
  .ms-panel { display: none; position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-control); box-shadow: var(--shadow-card); max-height: 260px; overflow-y: auto; z-index: 30; padding: 6px; }
  .ms.open .ms-panel { display: block; }
  .ms-opt { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; font-size: 13px; cursor: pointer; margin: 0; font-weight: 500; color: var(--text); }
  .ms-opt:hover { background: var(--surface-2); }
  .ms-opt input { margin: 0; accent-color: var(--pink); }
  .ms-group { font-size: 11px; font-weight: 700; color: var(--text-3); letter-spacing: .03em; text-transform: uppercase; padding: 8px 8px 2px; }
</style>
</head>
<body>

<div id="gate" class="locked-state" style="display:none;">
  <p class="text-h2" id="gateTitle" style="margin-bottom:8px;">Loading...</p>
  <p class="text-sub" id="gateSub"></p>
</div>

<div id="appShell" style="display:none;">
  <div class="topbar">
    <div style="display:flex; align-items:center; gap:16px;">
      <div class="sidebar-logo" style="margin:0;">anteraja LMS</div>
      <a href="index.html" class="text-sub" style="text-decoration:none; display:flex; align-items:center; gap:4px;">← Main Menu</a>
    </div>
    <div class="user-chip">
      <img class="avatar" id="userAvatar" src="">
      <span id="userName"></span>
    </div>
  </div>

  <div class="wrap">
    <h1 class="text-h1" id="pageTitle">Create New Module</h1>

    <div class="card">
      <h2 class="text-h2" style="margin-bottom:14px;">Module Information</h2>
      <label>Training Mode</label>
      <div class="chip-group" id="chipMode" style="display:flex; gap:8px; margin-bottom:14px;">
        <span class="chip selected" data-mode="online">Online (LMS)</span>
        <span class="chip" data-mode="offline">Offline (in-person)</span>
      </div>
      <label>Module Title</label>
      <input type="text" id="mJudul" placeholder="e.g. Coaching Basics for Section Heads">

      <label>Short Description</label>
      <textarea id="mDeskripsi" rows="2" placeholder="What trainees will learn in this module"></textarea>

      <div class="row">
        <div>
          <label>Category</label>
          <select id="mKategori">
            <option value="Basic/Fundamental">Basic/Fundamental</option>
            <option value="Core/Mandatory">Core/Mandatory</option>
            <option value="General">General</option>
          </select>
        </div>
        <div>
          <label>Estimated Duration (min)</label>
          <input type="number" id="mDurasi" placeholder="e.g. 15">
        </div>
      </div>

      <label>Target Division</label>
      <input type="text" id="mDivisi" placeholder="Comma-separated, e.g. OPERATION, HUMAN CAPITAL">
      <label>Target Level</label>
      <div id="chipLevel" class="ms" style="margin-bottom:14px;"></div>
      <label>Competencies Developed</label>
      <div id="chipKompetensi" class="ms" style="margin-bottom:14px;"></div>
    </div>

    <div class="card" id="cardOffline" style="display:none;">
      <h2 class="text-h2" style="margin-bottom:14px;">Schedule & Sessions (Offline)</h2>
      <div class="row">
        <div><label>Start Date</label><input type="date" id="mTglMulai"></div>
        <div><label>End Date</label><input type="date" id="mTglSelesai"></div>
      </div>
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
        <label style="margin:0;">Sessions & Trainers</label>
        <span class="link-add" id="addSesiBtn"></span>
      </div>
      <div id="sesiList" style="display:flex; flex-direction:column; gap:8px; margin-bottom:14px;"></div>

      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
        <label style="margin:0;">Participant Roster</label>
        <span class="link-add" id="downloadTemplateBtn">Download Excel Template</span>
      </div>
      <div id="rosterList" style="display:flex; flex-direction:column; gap:6px; margin-bottom:8px;"></div>
      <div class="dropzone" id="rosterDropzone"></div>
      <input type="file" id="rosterFileInput" accept=".xlsx,.xls" style="display:none">
      <div id="rosterResult" class="text-meta" style="margin-top:6px;"></div>

      <div id="linkFormBox" style="display:none; margin-top:6px;">
        <label>Trainee Form Link</label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="linkFormOutput" readonly style="flex:1;">
          <button class="btn btn-outline btn-sm" id="copyLinkBtn">Copy</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;">
        <h2 class="text-h2" style="margin:0;">Materials</h2>
        <span class="link-add" id="openAiBtn"></span>
      </div>
      <div id="videoField">
        <label>YouTube Video Link (unlisted)</label>
        <input type="url" id="mVideo" placeholder="https://youtu.be/...">
      </div>

      <div id="aiDraftsBox" style="display:none; margin-bottom:16px;">
        <label>AI Generator Drafts (.pptx, not yet official PDF material)</label>
        <div id="aiDraftsList"></div>
      </div>

      <label>Material Files (PDF only)</label>
      <div id="materiList"></div>
      <div class="dropzone" id="materiDropzone"></div>
      <input type="file" id="materiFileInput" accept=".pdf" style="display:none">
    </div>

    <div class="card">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;">
        <h2 class="text-h2" style="margin:0;">Post-Test Questions</h2>
        <span class="link-add" id="addQuestionBtn"></span>
      </div>
      <div id="questionList"></div>
    </div>

    <div class="btn-row">
      <button class="btn btn-outline" id="saveDraftBtn">Save Draft</button>
      <button class="btn btn-primary" id="submitApprovalBtn">Submit to Admin</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { auth, db, onAuth, ensureUserProfile } from './firebase-shared.js';
  import { iconSvg } from './lms-icons.js';
  import { KATEGORI_ORDER, escapeHtml } from './competency-shared.js?v=20261111b';
  import {
    collection, addDoc, doc, getDoc, updateDoc, serverTimestamp,
    query, where, getDocs, writeBatch
  } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
  import {
    getStorage, ref, uploadBytes, getDownloadURL
  } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-storage.js";
  import { getApps } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-functions.js";

  const storage = getStorage(getApps()[0]);
  const FORMS_BASE_URL = 'https://aryaputra1208-glitch.github.io/apusukabelajar/training-forms.html';

  const LEVEL_OPTIONS = ['Admin','Leader','Coordinator','Staff','Supervisor','Section Head','Department Head','AVP','VP','SVP'];

  let currentUser = null;
  let currentProfile = null;
  let moduleId = null;
  let materiFiles = [];
  let questions = [];
  let selectedLevel = [];
  let selectedKompetensi = [];
  let competencyList = [];
  let mode = 'online';
  let sesiRows = [];
  let rosterRows = [];

  document.getElementById('addSesiBtn').innerHTML = iconSvg('plus', { size: 12 }) + ' Add session';

  /* ===== AI Generator (Fase 1: Konsultasi + Generate PPT/Audio) ===== */
  document.getElementById('openAiBtn').innerHTML = iconSvg('sparkles', { size: 14 }) + ' Create Material with AI';
  let aiMessages = [];
  let aiFunctions = null;
  let aiDrafts = [];

  document.getElementById('openAiBtn').addEventListener('click', () => {
    if(!aiFunctions) aiFunctions = getFunctions(getApps()[0]);
    document.getElementById('aiModal').style.display = 'flex';
    if(!aiMessages.length){
      renderAiChat();
      appendAiBubble('assistant', 'Hi! What training material would you like to create? Tell me the topic, the target participants, and what they should understand after the training.');
    }
  });
  document.getElementById('closeAiBtn').innerHTML = iconSvg('x', { size: 18 });
  document.getElementById('closeAiBtn').addEventListener('click', () => { document.getElementById('aiModal').style.display = 'none'; });

  function appendAiBubble(role, text){
    const box = document.getElementById('aiChatBody');
    const bubble = document.createElement('div');
    bubble.style.cssText = `max-width:85%; padding:10px 14px; border-radius:12px; font-size:13px; line-height:1.5; white-space:pre-wrap; ${role==='user' ? 'align-self:flex-end; background:var(--pink); color:#fff;' : 'align-self:flex-start; background:var(--surface-2); color:var(--text);'}`;
    bubble.textContent = text;
    box.appendChild(bubble);
    box.scrollTop = box.scrollHeight;
  }
  function renderAiChat(){ document.getElementById('aiChatBody').innerHTML = ''; }

  async function sendAiMessage(){
    const input = document.getElementById('aiInput');
    const text = input.value.trim();
    if(!text) return;
    input.value = '';
    input.style.height = 'auto';
    aiMessages.push({ role: 'user', content: text });
    appendAiBubble('user', text);
    const thinking = document.createElement('div');
    thinking.id = 'aiThinking';
    thinking.style.cssText = 'align-self:flex-start; color:var(--text-3); font-size:12px;';
    thinking.textContent = 'AI is thinking...';
    document.getElementById('aiChatBody').appendChild(thinking);

    try{
      const call = httpsCallable(aiFunctions, 'aiChatConsult', { timeout: 120000 });
      const res = await call({ messages: aiMessages });
      thinking.remove();
      aiMessages.push({ role: 'assistant', content: res.data.reply });
      appendAiBubble('assistant', res.data.reply);
      document.getElementById('aiGenerateRow').style.display = 'flex';
    } catch(err){
      thinking.remove();
      appendAiBubble('assistant', 'Sorry, an error occurred: ' + err.message);
    }
  }
  document.getElementById('aiSendBtn').addEventListener('click', sendAiMessage);
  document.getElementById('aiInput').addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendAiMessage(); }
  });
  document.getElementById('aiInput').addEventListener('input', (e) => {
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(e.target.scrollHeight, 160) + 'px';
  });

  async function generateMateriAi(withAudio){
    const btnId = withAudio ? 'aiGenPptAudioBtn' : 'aiGenPptBtn';
    const btn = document.getElementById(btnId);
    const original = btn.textContent;
    btn.disabled = true; btn.textContent = 'Building material...';
    try{
      const call = httpsCallable(aiFunctions, 'aiGenerateMateri', { timeout: 300000 });
      const res = await call({ messages: aiMessages, withAudio });
      showAiResult(res.data);
    } catch(err){
      showToast('Generation failed: ' + err.message);
    } finally {
      btn.disabled = false; btn.textContent = original;
    }
  }
  document.getElementById('aiGenPptBtn').addEventListener('click', () => generateMateriAi(false));
  document.getElementById('aiGenPptAudioBtn').addEventListener('click', () => generateMateriAi(true));

  function showAiResult(data){
    document.getElementById('aiGenerateRow').style.display = 'none';
    const box = document.getElementById('aiChatBody');
    const card = document.createElement('div');
    card.style.cssText = 'align-self:stretch; border:1px solid var(--border); border-radius:var(--r-card); padding:16px; background:var(--pink-bg);';
    card.innerHTML = `
      <div style="font-weight:700; font-size:14px; margin-bottom:6px;">${iconSvg('check',{size:15})} Draft ready: ${data.slideCount} slides</div>
      <p class="text-sub" style="margin-bottom:12px;">Open and edit the .pptx in PowerPoint. For <strong>online</strong> modules, export it to PDF and upload it under Material Files. For <strong>offline</strong> training, use the file as is. The draft is also saved under AI Drafts.</p>
      <a href="${data.pptxUrl}" target="_blank" class="btn btn-primary" style="width:100%; display:block; text-align:center; text-decoration:none; margin-bottom:${(data.audio&&data.audio.length)?'10px':'0'};">Download ${data.judul || 'Material'}.pptx</a>
      ${(data.audio && data.audio.length) ? `
        <div class="text-meta" style="margin:10px 0 6px;">Narration audio per slide (match the slide order after PDF export):</div>
        ${data.audio.map(a => `
          <div style="display:flex; align-items:center; gap:8px; padding:6px 0;">
            <span class="text-meta" style="width:60px; flex-shrink:0;">Slide ${a.slideNo}</span>
            <audio controls src="${a.url}" style="height:30px; flex:1;"></audio>
          </div>`).join('')}
      ` : ''}`;
    box.appendChild(card);
    box.scrollTop = box.scrollHeight;

    aiDrafts.push(data);
    renderAiDrafts();
  }

  function setMode(newMode, skipAutoSesi){
    mode = newMode;
    document.querySelectorAll('#chipMode .chip').forEach(c => c.classList.toggle('selected', c.dataset.mode === newMode));
    document.getElementById('cardOffline').style.display = mode === 'offline' ? 'block' : 'none';
    document.getElementById('videoField').style.display = mode === 'online' ? 'block' : 'none';
    if(mode === 'offline' && !sesiRows.length && !skipAutoSesi) addSesiRow();
  }
  document.querySelectorAll('#chipMode .chip').forEach(chip => {
    chip.addEventListener('click', () => setMode(chip.dataset.mode));
  });

  function renderSesiList(){
    const el = document.getElementById('sesiList');
    el.innerHTML = sesiRows.map((s,i) => `
      <div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px; border:1px solid var(--border); border-radius:8px;">
        <input class="q-text" style="flex:1 1 140px; margin-bottom:0;" placeholder="Session Name" data-i="${i}" data-f="namaSesi" value="${s.namaSesi||''}">
        <input class="q-text" style="flex:1 1 100px; margin-bottom:0;" placeholder="NIK Trainer" data-i="${i}" data-f="trainerNik" value="${s.trainerNik||''}">
        <input class="q-text" style="flex:1 1 120px; margin-bottom:0;" placeholder="Trainer Name" data-i="${i}" data-f="trainerNama" value="${s.trainerNama||''}">
        <input class="q-text" style="flex:1 1 120px; margin-bottom:0;" type="date" data-i="${i}" data-f="tanggal" value="${s.tanggal||''}">
        <input class="q-text" style="flex:0 1 100px; margin-bottom:0;" type="time" data-i="${i}" data-f="jamMulai" value="${s.jamMulai||''}">
        <input class="q-text" style="flex:0 1 70px; margin-bottom:0;" type="number" step="0.5" placeholder="Hours" data-i="${i}" data-f="durasiJam" value="${s.durasiJam||''}">
        <button class="icon-btn tone-red" data-i="${i}" data-action="remove-sesi">${iconSvg('trash',{size:13})}</button>
      </div>`).join('');
    el.querySelectorAll('input[data-f]').forEach(inp => inp.addEventListener('input', () => {
      sesiRows[Number(inp.dataset.i)][inp.dataset.f] = inp.value;
    }));
    el.querySelectorAll('[data-action="remove-sesi"]').forEach(btn => btn.addEventListener('click', () => {
      sesiRows.splice(Number(btn.dataset.i),1); renderSesiList();
    }));
  }
  function addSesiRow(){ sesiRows.push({ namaSesi:'', trainerNik:'', trainerNama:'', tanggal:'', jamMulai:'', durasiJam:'' }); renderSesiList(); }
  document.getElementById('addSesiBtn').addEventListener('click', addSesiRow);

  document.getElementById('copyLinkBtn').addEventListener('click', () => {
    const val = document.getElementById('linkFormOutput').value;
    navigator.clipboard.writeText(val).then(() => showToast('Link copied.')).catch(() => {});
  });

  /* ===== Roster: template download + upload Excel ===== */
  document.getElementById('downloadTemplateBtn').addEventListener('click', () => {
    const wb = XLSX.utils.book_new();
    const data = [
      ['NIK','Nama','Divisi','Departemen','Jabatan','Level'],
      ['10047430','ANDRIAN','OPERATION','QA OPERATIONAL','QA Supervisor','Staff'],
    ];
    const ws = XLSX.utils.aoa_to_sheet(data);
    ws['!cols'] = [{wch:12},{wch:20},{wch:16},{wch:20},{wch:20},{wch:12}];
    XLSX.utils.book_append_sheet(wb, ws, 'Roster');
    XLSX.writeFile(wb, 'Template_Roster_Peserta.xlsx');
  });

  const rosterDz = document.getElementById('rosterDropzone');
  const rosterInput = document.getElementById('rosterFileInput');
  rosterDz.innerHTML = iconSvg('upload', {size:18}) + ' <span>Drag &amp; drop the roster Excel file, or click to browse</span>';
  rosterDz.addEventListener('click', () => rosterInput.click());
  rosterInput.addEventListener('change', e => { if(e.target.files[0]) handleRosterFile(e.target.files[0]); });
  rosterDz.addEventListener('dragover', e => { e.preventDefault(); rosterDz.classList.add('drag-over'); });
  rosterDz.addEventListener('dragleave', () => rosterDz.classList.remove('drag-over'));
  rosterDz.addEventListener('drop', e => {
    e.preventDefault(); rosterDz.classList.remove('drag-over');
    if(e.dataTransfer.files[0]) handleRosterFile(e.dataTransfer.files[0]);
  });

  function handleRosterFile(file){
    const reader = new FileReader();
    reader.onload = (e) => {
      try{
        const wb = XLSX.read(e.target.result, { type: 'binary' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
        rosterRows = rows.map(r => ({
          nik: String(r.NIK || r.nik || '').trim(),
          nama: String(r.Nama || r.nama || '').trim(),
          divisi: String(r.Divisi || r.divisi || '').trim(),
          departemen: String(r.Departemen || r.departemen || '').trim(),
          jabatan: String(r.Jabatan || r.jabatan || '').trim(),
          level: String(r.Level || r.level || '').trim(),
        })).filter(r => r.nik);
        renderRosterList();
        document.getElementById('rosterResult').textContent = `${rosterRows.length} participants read from file.`;
        showToast(`${rosterRows.length} participants read.`);
      } catch(err){
        showToast('Could not read file: ' + err.message);
      }
    };
    reader.readAsBinaryString(file);
  }

  function renderRosterList(){
    const el = document.getElementById('rosterList');
    if(!rosterRows.length){ el.innerHTML = ''; return; }
    el.innerHTML = `<div class="file-item">${iconSvg('users',{size:16})} <span>${rosterRows.length} participants uploaded</span>
      <button class="icon-btn" id="clearRosterBtn" title="Remove all">${iconSvg('trash',{size:14})}</button></div>`;
    document.getElementById('clearRosterBtn').addEventListener('click', () => {
      rosterRows = []; document.getElementById('rosterResult').textContent = ''; renderRosterList();
    });
  }

  document.getElementById('materiDropzone').innerHTML =
    iconSvg('upload', { size: 20 }) + ' <span>Drag &amp; drop a file here, or click to browse</span>';
  document.getElementById('addQuestionBtn').innerHTML = iconSvg('plus', { size: 14 }) + ' Add question';

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2500);
  }

  /* ===== Tag kompetensi (dari Kamus Kompetensi) ===== */
  async function loadCompetencies(){
    try{
      const snap = await getDocs(collection(db, 'competencies'));
      competencyList = [];
      snap.forEach(d => competencyList.push({ id: d.id, ...d.data() }));
      competencyList.sort((a,b) => (KATEGORI_ORDER.indexOf(a.kategori) - KATEGORI_ORDER.indexOf(b.kategori)) || ((a.urutan ?? 999) - (b.urutan ?? 999)));
    } catch(err){
      console.error('Gagal baca competencies:', err.code, err.message);
      competencyList = [];
    }
  }
  /**
   * Dropdown pilih banyak. options: [{ value, label, group? }]. selectedArr diubah langsung (in-place).
   */
  function renderMultiSelect(containerId, options, selectedArr, placeholder){
    const el = document.getElementById(containerId);
    const labelOf = v => options.find(o => o.value === v)?.label || v;
    const summary = () => selectedArr.length
      ? escapeHtml(selectedArr.map(labelOf).join(', '))
      : `<span class="ph">${escapeHtml(placeholder)}</span>`;
    let lastGroup = null;
    el.innerHTML = `<button type="button" class="ms-btn"><span class="ms-sum">${summary()}</span>${iconSvg('chevron-down', { size: 14 })}</button>
      <div class="ms-panel">${options.map(o => {
        const g = o.group && o.group !== lastGroup ? `<div class="ms-group">${escapeHtml(o.group)}</div>` : '';
        lastGroup = o.group || lastGroup;
        return g + `<label class="ms-opt"><input type="checkbox" value="${escapeHtml(o.value)}" ${selectedArr.includes(o.value) ? 'checked' : ''}>${escapeHtml(o.label)}</label>`;
      }).join('')}</div>`;
    el.querySelector('.ms-btn').addEventListener('click', e => {
      e.stopPropagation();
      document.querySelectorAll('.ms.open').forEach(x => { if(x !== el) x.classList.remove('open'); });
      el.classList.toggle('open');
    });
    el.querySelector('.ms-panel').addEventListener('click', e => e.stopPropagation());
    el.querySelectorAll('.ms-panel input').forEach(cb => cb.addEventListener('change', () => {
      const idx = selectedArr.indexOf(cb.value);
      if(cb.checked && idx === -1) selectedArr.push(cb.value);
      if(!cb.checked && idx !== -1) selectedArr.splice(idx, 1);
      el.querySelector('.ms-sum').innerHTML = summary();
    }));
  }
  document.addEventListener('click', () => document.querySelectorAll('.ms.open').forEach(x => x.classList.remove('open')));

  function renderKompetensiChips(){
    const el = document.getElementById('chipKompetensi');
    if(!competencyList.length){
      el.innerHTML = '<span class="text-meta">Competency dictionary is empty. You can skip this for now.</span>';
      return;
    }
    // Tag lama yang kompetensinya sudah dihapus dari kamus tetap disimpan, tidak dibuang diam-diam.
    const known = new Set(competencyList.map(c => c.id));
    const options = competencyList.map(c => ({ value: c.id, label: c.nama, group: c.kategori || 'Other' }))
      .concat(selectedKompetensi.filter(id => !known.has(id)).map(id => ({ value: id, label: id + ' (old)', group: 'No longer in dictionary' })));
    renderMultiSelect('chipKompetensi', options, selectedKompetensi, 'Select competencies');
  }

  function renderChips(containerId, options, selectedArr){
    renderMultiSelect(containerId, options.map(o => ({ value: o, label: o })), selectedArr, 'All levels');
  }


  function renderAiDrafts(){
    const box = document.getElementById('aiDraftsBox');
    const list = document.getElementById('aiDraftsList');
    if(!aiDrafts.length){ box.style.display = 'none'; return; }
    box.style.display = 'block';
    list.innerHTML = aiDrafts.map((d, i) => `
      <div class="file-item">
        <span style="display:flex; align-items:center; gap:8px;">${iconSvg('sparkles',{size:15})} ${d.judul || 'AI Material'}.pptx <span class="text-meta">(${d.slideCount} slides)</span></span>
        <span style="display:flex; gap:6px;">
          <button class="btn btn-outline btn-sm" data-action="preview" data-url="${d.pptxUrl}" style="padding:5px 10px;">Preview</button>
          <a class="btn btn-outline btn-sm" href="${d.pptxUrl}" target="_blank" download style="padding:5px 10px; text-decoration:none;">Download</a>
          <button class="icon-btn" data-i="${i}" title="Remove from list">${iconSvg('trash',{size:14})}</button>
        </span>
      </div>
      ${(d.audio && d.audio.length) ? `
        <div style="padding:6px 0 6px 24px;">
          ${d.audio.map(a => `
            <div style="display:flex; align-items:center; gap:8px; padding:4px 0;">
              <span class="text-meta" style="width:60px; flex-shrink:0;">Slide ${a.slideNo}</span>
              <audio controls src="${a.url}" style="height:28px; flex:1;"></audio>
            </div>`).join('')}
        </div>
      ` : ''}`).join('');
    list.querySelectorAll('[data-action="preview"]').forEach(btn => {
      btn.addEventListener('click', () => window.open(btn.dataset.url, '_blank'));
    });
    list.querySelectorAll('[data-i]').forEach(btn => {
      btn.addEventListener('click', () => { aiDrafts.splice(Number(btn.dataset.i),1); renderAiDrafts(); });
    });
  }

  function renderMateriList(){
    const el = document.getElementById('materiList');
    if(!materiFiles.length){ el.innerHTML = ''; return; }
    el.innerHTML = materiFiles.map((f,i) => `
      <div class="file-item">
        <span style="display:flex; align-items:center; gap:8px;">${iconSvg('file-text',{size:16})} ${f.nama} <span class="text-meta">(${f.pageCount||'?'} pages)</span></span>
        <span style="display:flex; gap:6px; align-items:center;">
          <button class="btn btn-outline btn-sm" data-action="preview" data-url="${f.url}" style="padding:5px 10px;">Preview</button>
          <button class="btn btn-outline btn-sm" data-action="download" data-url="${f.url}" data-nama="${f.nama.replace(/"/g,'&quot;')}" style="padding:5px 10px;">Download</button>
          <button class="icon-btn" data-i="${i}" title="Remove">${iconSvg('trash',{size:14})}</button>
        </span>
      </div>
      <div class="audio-slots" id="audioSlots-${i}"></div>`).join('');
    el.querySelectorAll('[data-i]').forEach(btn => {
      btn.addEventListener('click', () => { materiFiles.splice(Number(btn.dataset.i),1); renderMateriList(); });
    });
    el.querySelectorAll('[data-action="preview"]').forEach(btn => {
      btn.addEventListener('click', () => window.open(btn.dataset.url, '_blank'));
    });
    el.querySelectorAll('[data-action="download"]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const original = btn.textContent; btn.textContent = '...';
        try{
          const res = await fetch(btn.dataset.url);
          const blob = await res.blob();
          const objUrl = URL.createObjectURL(blob);
          const a = document.createElement('a'); a.href = objUrl; a.download = btn.dataset.nama;
          document.body.appendChild(a); a.click(); a.remove();
          URL.revokeObjectURL(objUrl);
        } catch(err){ showToast('Download failed: ' + err.message); }
        finally { btn.textContent = original; }
      });
    });
    materiFiles.forEach((f,i) => renderAudioSlots(i));
  }

  function renderAudioSlots(fileIdx){
    const f = materiFiles[fileIdx];
    const el = document.getElementById(`audioSlots-${fileIdx}`);
    if(!el) return;
    const pages = Array.from({length: f.pageCount||1}, (_,i) => i+1);
    el.innerHTML = `<div class="text-meta" style="margin-bottom:6px; font-weight:600;">🔊 Narration audio per page (optional)</div>` +
      pages.map(p => {
        const a = f.audio && f.audio[p];
        return `<div class="audio-row">
          <span class="halaman">Page ${p}</span>
          ${a ? `<audio controls src="${a.url}"></audio><button class="audio-btn" data-file="${fileIdx}" data-page="${p}" data-action="remove-audio">Remove</button>`
              : `<button class="audio-btn" data-file="${fileIdx}" data-page="${p}" data-action="upload-audio">Upload audio</button>`}
          <input type="file" accept="audio/*" data-file="${fileIdx}" data-page="${p}" id="audioInput-${fileIdx}-${p}">
        </div>`;
      }).join('');

    el.querySelectorAll('[data-action="upload-audio"]').forEach(btn => {
      btn.addEventListener('click', () => document.getElementById(`audioInput-${btn.dataset.file}-${btn.dataset.page}`).click());
    });
    el.querySelectorAll('input[type=file][data-file]').forEach(input => {
      input.addEventListener('change', (e) => {
        if(e.target.files[0]) uploadAudio(Number(input.dataset.file), Number(input.dataset.page), e.target.files[0]);
      });
    });
    el.querySelectorAll('[data-action="remove-audio"]').forEach(btn => {
      btn.addEventListener('click', () => {
        delete materiFiles[Number(btn.dataset.file)].audio[btn.dataset.page];
        renderAudioSlots(Number(btn.dataset.file));
      });
    });
  }

  async function uploadAudio(fileIdx, page, audioFile){
    if(!currentUser){ showToast('You are not signed in.'); return; }
    try{
      const path = `materi-audio/${currentUser.uid}/${Date.now()}_hal${page}_${audioFile.name}`;
      const audioRef = ref(storage, path);
      await uploadBytes(audioRef, audioFile);
      const url = await getDownloadURL(audioRef);
      materiFiles[fileIdx].audio[page] = { url, nama: audioFile.name };
      renderAudioSlots(fileIdx);
      showToast(`Audio for page ${page} uploaded.`);
    } catch(err){
      showToast('Audio upload failed: ' + err.message);
    }
  }

  function renderQuestions(){
    const el = document.getElementById('questionList');
    if(!questions.length){ el.innerHTML = `<p class="text-meta">No questions yet.</p>`; return; }
    el.innerHTML = questions.map((q,i) => `
      <div class="q-card">
        <div class="q-head">
          <select data-i="${i}" data-f="tipe">
            <option value="multiple_choice" ${q.tipe==='multiple_choice'?'selected':''}>Multiple Choice</option>
            <option value="likert" ${q.tipe==='likert'?'selected':''}>Scale 1-4</option>
            <option value="free_text" ${q.tipe==='free_text'?'selected':''}>Text Answer</option>
            <option value="file_upload" ${q.tipe==='file_upload'?'selected':''}>File Submission</option>
          </select>
          <input type="text" data-i="${i}" data-f="pertanyaan" value="${(q.pertanyaan||'').replace(/"/g,'&quot;')}" placeholder="Question text">
          <button class="icon-btn tone-red" data-i="${i}" data-action="remove">${iconSvg('trash',{size:14})}</button>
        </div>
        ${q.tipe === 'multiple_choice' ? `
          <div id="opts-${i}">
            ${(q.pilihan||[]).map((opt,oi) => `
              <div class="opt-row">
                <input type="radio" name="jawaban-${i}" data-i="${i}" data-oi="${oi}" data-f="jawabanBenar" ${q.jawabanBenar===opt?'checked':''}>
                <input type="text" data-i="${i}" data-oi="${oi}" data-f="opsi" value="${opt.replace(/"/g,'&quot;')}" placeholder="Option ${oi+1}">
                <button class="icon-btn" data-i="${i}" data-oi="${oi}" data-action="remove-opsi">${iconSvg('x',{size:13})}</button>
              </div>`).join('')}
            <span class="link-add" data-i="${i}" data-action="add-opsi">${iconSvg('plus',{size:12})} Add option</span>
          </div>` : ''}
        ${q.tipe === 'file_upload' ? `<p class="text-meta">Trainee uploads an answer file; you grade it manually.</p>` : ''}
      </div>`).join('');

    el.querySelectorAll('[data-f="tipe"]').forEach(sel => sel.addEventListener('change', e => {
      const i = Number(e.target.dataset.i);
      questions[i].tipe = e.target.value;
      if(e.target.value === 'multiple_choice' && !questions[i].pilihan) questions[i].pilihan = ['Option 1','Option 2'];
      renderQuestions();
    }));
    el.querySelectorAll('[data-f="pertanyaan"]').forEach(inp => inp.addEventListener('input', e => {
      questions[Number(e.target.dataset.i)].pertanyaan = e.target.value;
    }));
    el.querySelectorAll('[data-action="remove"]').forEach(btn => btn.addEventListener('click', e => {
      questions.splice(Number(e.currentTarget.dataset.i),1); renderQuestions();
    }));
    el.querySelectorAll('[data-f="opsi"]').forEach(inp => inp.addEventListener('input', e => {
      const i = Number(e.target.dataset.i), oi = Number(e.target.dataset.oi);
      questions[i].pilihan[oi] = e.target.value;
    }));
    el.querySelectorAll('[data-f="jawabanBenar"]').forEach(radio => radio.addEventListener('change', e => {
      const i = Number(e.target.dataset.i), oi = Number(e.target.dataset.oi);
      questions[i].jawabanBenar = questions[i].pilihan[oi];
    }));
    el.querySelectorAll('[data-action="add-opsi"]').forEach(link => link.addEventListener('click', e => {
      const i = Number(e.currentTarget.dataset.i);
      questions[i].pilihan.push(`Option ${questions[i].pilihan.length+1}`);
      renderQuestions();
    }));
    el.querySelectorAll('[data-action="remove-opsi"]').forEach(btn => btn.addEventListener('click', e => {
      const i = Number(e.currentTarget.dataset.i), oi = Number(e.currentTarget.dataset.oi);
      questions[i].pilihan.splice(oi,1); renderQuestions();
    }));
  }

  document.getElementById('addQuestionBtn').addEventListener('click', () => {
    questions.push({ tipe:'multiple_choice', pertanyaan:'', pilihan:['Option 1','Option 2'], jawabanBenar:'' });
    renderQuestions();
  });

  const dz = document.getElementById('materiDropzone');
  const fileInput = document.getElementById('materiFileInput');
  dz.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => { if(e.target.files[0]) uploadMateri(e.target.files[0]); });
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
  dz.addEventListener('drop', e => {
    e.preventDefault(); dz.classList.remove('drag-over');
    if(e.dataTransfer.files[0]) uploadMateri(e.dataTransfer.files[0]);
  });

  async function uploadMateri(file){
    if(!currentUser){ showToast('You are not signed in.'); return; }
    if(!/\.pdf$/i.test(file.name)){ showToast('Only PDF files are accepted. Export from PPT/Word to PDF first.'); return; }
    const original = dz.innerHTML;
    dz.innerHTML = `⏳ Uploading ${file.name}...`;
    try{
      const path = `materi/${currentUser.uid}/${Date.now()}_${file.name}`;
      const fileRef = ref(storage, path);
      await uploadBytes(fileRef, file);
      const url = await getDownloadURL(fileRef);
      let pageCount = 1;
      try{
        const pdf = await pdfjsLib.getDocument(url).promise;
        pageCount = pdf.numPages;
      } catch(e){ /* biarkan default 1 kalau gagal deteksi */ }
      materiFiles.push({ nama: file.name, url, pageCount, audio: {} });
      renderMateriList();
      showToast(`${file.name} uploaded.`);
    } catch(err){
      showToast('Upload failed: ' + err.message);
    } finally {
      dz.innerHTML = original;
    }
  }

  function collectModuleData(status){
    return {
      mode,
      judul: document.getElementById('mJudul').value.trim(),
      deskripsi: document.getElementById('mDeskripsi').value.trim(),
      kategori: document.getElementById('mKategori').value,
      durasiMenit: Number(document.getElementById('mDurasi').value) || 0,
      videoUrl: mode === 'online' ? document.getElementById('mVideo').value.trim() : '',
      tanggalMulai: mode === 'offline' ? document.getElementById('mTglMulai').value : '',
      tanggalSelesai: mode === 'offline' ? document.getElementById('mTglSelesai').value : '',
      targetDivisi: document.getElementById('mDivisi').value.split(',').map(s => s.trim()).filter(Boolean),
      targetLevel: selectedLevel,
      kompetensiIds: selectedKompetensi,
      materiFiles,
      createdBy: currentUser.uid,
      createdByName: currentProfile.displayName,
      status,
      updatedAt: serverTimestamp(),
    };
  }

  async function saveQuestions(){
    const q = query(collection(db, 'questions'), where('moduleId', '==', moduleId));
    const snap = await getDocs(q);
    const batch = writeBatch(db);
    snap.forEach(d => batch.delete(d.ref));
    questions.forEach((qq, i) => {
      const ref = doc(collection(db, 'questions'));
      batch.set(ref, { moduleId, urutan: i, ...qq });
    });
    await batch.commit();
  }

  async function saveSesiAndRoster(){
    if(mode !== 'offline') return;

    const sq = query(collection(db, 'sessions'), where('trainingId', '==', moduleId));
    const sSnap = await getDocs(sq);
    const sBatch = writeBatch(db);
    sSnap.forEach(d => sBatch.delete(d.ref));
    sesiRows.forEach((s,i) => {
      const ref = doc(collection(db, 'sessions'));
      sBatch.set(ref, { trainingId: moduleId, sesiKe: i+1, ...s });
    });
    await sBatch.commit();

    if(rosterRows.length){
      const rq = query(collection(db, 'roster'), where('trainingId', '==', moduleId));
      const rSnap = await getDocs(rq);
      const rBatch = writeBatch(db);
      rSnap.forEach(d => rBatch.delete(d.ref));
      rosterRows.forEach(r => {
        const ref = doc(collection(db, 'roster'));
        rBatch.set(ref, { trainingId: moduleId, ...r });
      });
      await rBatch.commit();
    }
  }

  function showLinkForm(){
    if(mode !== 'offline') return;
    const base = FORMS_BASE_URL || '[FORMS_BASE_URL not set up]';
    document.getElementById('linkFormOutput').value = `${base}?training=${moduleId}`;
    document.getElementById('linkFormBox').style.display = 'block';
  }

  async function saveModule(status){
    const judul = document.getElementById('mJudul').value.trim();
    if(!judul){ showToast('Module title is required.'); return; }
    try{
      const data = collectModuleData(status);
      if(!moduleId){
        data.createdAt = serverTimestamp();
        const docRef = await addDoc(collection(db, 'modules'), data);
        moduleId = docRef.id;
      } else {
        await updateDoc(doc(db, 'modules', moduleId), data);
      }
      await saveQuestions();
      await saveSesiAndRoster();
      showLinkForm();
      showToast(status === 'draft' ? 'Draft saved.' : 'Module submitted to admin for approval.');
    } catch(err){
      showToast('Save failed: ' + err.message);
    }
  }

  document.getElementById('saveDraftBtn').addEventListener('click', () => saveModule('draft'));
  document.getElementById('submitApprovalBtn').addEventListener('click', () => saveModule('pending_approval'));

  const editId = new URLSearchParams(window.location.search).get('edit');

  async function loadForEdit(id){
    const snap = await getDoc(doc(db, 'modules', id));
    if(!snap.exists()){ showToast('Training not found.'); return; }
    const m = snap.data();
    if(m.createdBy !== currentUser.uid && currentProfile.role !== 'admin'){
      document.getElementById('gate').style.display = 'block';
      document.getElementById('appShell').style.display = 'none';
      document.getElementById('gateTitle').textContent = 'Access denied';
      document.getElementById('gateSub').textContent = 'You did not create this training.';
      return;
    }
    moduleId = id;
    document.getElementById('pageTitle').textContent = 'Edit Training';
    document.getElementById('mJudul').value = m.judul || '';
    document.getElementById('mDeskripsi').value = m.deskripsi || '';
    document.getElementById('mKategori').value = m.kategori || 'Basic/Fundamental';
    document.getElementById('mDurasi').value = m.durasiMenit || '';
    document.getElementById('mDivisi').value = (m.targetDivisi||[]).join(', ');
    document.getElementById('mVideo').value = m.videoUrl || '';
    if(document.getElementById('mTglMulai')) document.getElementById('mTglMulai').value = m.tanggalMulai || '';
    if(document.getElementById('mTglSelesai')) document.getElementById('mTglSelesai').value = m.tanggalSelesai || '';

    selectedLevel = [...(m.targetLevel||[])];
    renderChips('chipLevel', LEVEL_OPTIONS, selectedLevel);
    selectedKompetensi = [...(m.kompetensiIds||[])];
    renderKompetensiChips();

    materiFiles = [...(m.materiFiles||[])];
    renderMateriList();

    setMode(m.mode || 'online', true);

    if(m.mode === 'offline'){
      const sSnap = await getDocs(query(collection(db, 'sessions'), where('trainingId', '==', id)));
      sesiRows = [];
      sSnap.forEach(d => sesiRows.push(d.data()));
      sesiRows.sort((a,b) => (a.sesiKe||0) - (b.sesiKe||0));
      renderSesiList();

      const rSnap = await getDocs(query(collection(db, 'roster'), where('trainingId', '==', id)));
      rosterRows = [];
      rSnap.forEach(d => rosterRows.push(d.data()));
      renderRosterList();
      if(rosterRows.length) document.getElementById('rosterResult').textContent = `${rosterRows.length} participants (saved earlier).`;

      showLinkForm();
    }

    const qSnap = await getDocs(query(collection(db, 'questions'), where('moduleId', '==', id)));
    questions = [];
    qSnap.forEach(d => questions.push(d.data()));
    questions.sort((a,b) => (a.urutan||0) - (b.urutan||0));
    renderQuestions();
  }

  onAuth(async (user) => {
    const gate = document.getElementById('gate');
    const shell = document.getElementById('appShell');
    if(!user){
      gate.style.display = 'block'; shell.style.display = 'none';
      document.getElementById('gateTitle').textContent = 'Please sign in';
      document.getElementById('gateSub').innerHTML = `<a href="login_test.html">Sign in here</a>, then reopen this page.`;
      return;
    }
    currentUser = user;
    currentProfile = await ensureUserProfile(user);
    if(currentProfile.role !== 'trainer' && currentProfile.role !== 'admin'){
      gate.style.display = 'block'; shell.style.display = 'none';
      document.getElementById('gateTitle').textContent = 'Access denied';
      document.getElementById('gateSub').textContent = 'This page is for Trainers and Admins only. Your role: ' + currentProfile.role;
      return;
    }
    gate.style.display = 'none'; shell.style.display = 'block';
    document.getElementById('userAvatar').src = currentProfile.photoURL;
    document.getElementById('userName').textContent = currentProfile.displayName;

    await loadCompetencies();
    renderKompetensiChips();
    if(editId){
      await loadForEdit(editId);
    } else {
      renderChips('chipLevel', LEVEL_OPTIONS, selectedLevel);
      renderQuestions();
      renderMateriList();
    }
  });
</script>
