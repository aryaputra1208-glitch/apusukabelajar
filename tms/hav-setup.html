<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAV Map Setup — Anteraja TMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../lms-design-system.css?v=20261105b">
<link rel="stylesheet" href="../lms-glass.css?v=20261111b">
<style>
  .avatar { width: 28px; height: 28px; border-radius: 50%; }
  .user-chip { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }
  .wrap.wide { max-width: 1180px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .sec { padding: 16px 20px 20px; }
  .sec label { display: block; font-size: 12.5px; font-weight: 600; margin: 12px 0 5px; }
  .sec select, .sec input { margin: 0; width: 100%; box-sizing: border-box; }
  .warn { border-left: 3px solid var(--amber); border-radius: 0; background: var(--amber-bg); padding: 12px 16px; font-size: 13px; color: #78350f; margin-bottom: 16px; display: none; }
  .chk { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 14px; margin-top: 6px; max-height: 210px; overflow-y: auto; }
  .chk label { display: flex; gap: 8px; align-items: center; font-weight: 500; margin: 0; font-size: 13px; }
  .chk input { width: auto; }
  .lv { display: grid; grid-template-columns: 1fr 90px; gap: 8px; margin-top: 6px; align-items: center; }
  .lv .h { font-size: 11.5px; color: var(--text-3); font-weight: 600; }
  .grid-ed { display: grid; gap: 8px; }
  .gcell { border-radius: 12px; padding: 10px; min-height: 82px; cursor: pointer; border: 1.5px solid transparent; display: flex; flex-direction: column; justify-content: space-between; }
  .gcell.sel { border-color: var(--text); }
  .gcell .nm { font-size: 12.5px; font-weight: 700; }
  .gcell .ct { font-size: 11.5px; opacity: .8; }
  .axl { font-size: 11.5px; font-weight: 600; color: var(--text-2); display: flex; align-items: center; justify-content: center; text-align: center; }
  .cell-edit { display: grid; grid-template-columns: 1fr 160px; gap: 10px; align-items: end; margin-top: 14px; }
  .sticky-save { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 0; }
  @media (max-width: 900px) { .two { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<script src="./tms-shell-early.js?v=20261111c"></script>

<div id="gate" class="locked-state">
  <p class="text-h2" id="gateTitle" style="margin-bottom:8px;">Loading...</p>
  <p class="text-sub" id="gateSub"></p>
</div>

<div id="appShell" style="display:none;">
  <div class="topbar">
    <div style="display:flex; align-items:center; gap:16px;">
      <a href="index.html" class="sidebar-logo" style="margin:0; text-decoration:none;">anteraja TMS</a>
      <a href="index.html" class="text-sub" style="text-decoration:none;">← TMS Menu</a>
    </div>
    <div class="user-chip">
      <a href="../index.html" class="btn btn-outline btn-sm" style="margin-right:6px;">Go to LMS</a>
      <img class="avatar" id="userAvatar" src="">
      <span id="userName"></span>
    </div>
  </div>
  <div class="wrap wide">
    <h1 class="text-h1">HAV Map Setup</h1>
    <div class="warn" id="overlapWarn"></div>

    <div class="two">
      <div class="panel" style="margin:0;">
        <div class="panel-head"><h3 class="text-h2" style="margin:0;">Performance (X Axis)</h3></div>
        <div class="sec">
          <label>Measured by</label>
          <select id="perfSource"></select>
          <label>Levels (left → right)</label>
          <div class="lv"><span class="h">LABEL</span><span class="h">FROM SCORE</span></div>
          <div id="perfLevels"></div>
        </div>
      </div>
      <div class="panel" style="margin:0;">
        <div class="panel-head"><h3 class="text-h2" style="margin:0;">Potential (Y Axis)</h3></div>
        <div class="sec">
          <label>Measured by</label>
          <select id="potSource"></select>
          <div id="potCatWrap" style="display:none;"><label>Category</label><select id="potCategory"></select></div>
          <div id="potSelWrap" style="display:none;"><label>Competencies</label><div class="chk" id="potComps"></div></div>
          <label>Levels (bottom → top)</label>
          <div class="lv"><span class="h">LABEL</span><span class="h">FROM SCORE</span></div>
          <div id="potLevels"></div>
        </div>
      </div>
    </div>

    <div class="panel" style="margin-top:16px;">
      <div class="panel-head">
        <div><h3 class="text-h2" style="margin:0;">Boxes</h3><div class="text-meta">Click a box to rename it or change its color · counts use <span id="previewPeriod">the latest period</span></div></div>
        <div class="tabs" style="margin:0;" id="sizeTabs">
          <button class="tab-btn" data-size="3">3 × 3</button><button class="tab-btn" data-size="4">4 × 4</button><button class="tab-btn" data-size="5">5 × 5</button>
        </div>
      </div>
      <div class="sec">
        <div class="grid-ed" id="gridEd"></div>
        <div class="cell-edit" id="cellEdit"></div>
        <div class="text-meta" id="unplaced" style="margin-top:12px;"></div>
      </div>
    </div>

    <div class="sticky-save">
      <button class="btn btn-outline" id="resetBtn">Reset to Default</button>
      <button class="btn btn-primary" id="saveBtn">Save Setup</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
  import { db, onAuth, ensureUserProfile } from '../firebase-shared.js';
  import { escapeHtml, periodeRank, periodeLabel, HAV_PERF_SOURCES, HAV_POT_SOURCES, HAV_ZONES, havNormalize, havDefaultConfig, havLevels, havDefaultCells, havAxesOverlap, havPlace } from '../competency-shared.js?v=20261111d';
  import { collection, getDocs, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

  const F = id => document.getElementById(id);
  let cfg = havDefaultConfig(3), competencies = [], assess = [], selCell = [0, 0], profile = null;
  const showToast = msg => { const t = F('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000); };

  function levelRows(key){
    return cfg[key].map((l, i) => `<div class="lv"><input type="text" data-lv="${key}" data-i="${i}" data-f="label" value="${escapeHtml(l.label)}">
      <input data-lv="${key}" data-i="${i}" data-f="min" type="number" step="0.01" min="0" max="5" value="${l.min}" ${i === 0 ? 'disabled title="The lowest level always starts at 0"' : ''}></div>`).join('');
  }

  function render(){
    F('perfSource').innerHTML = Object.entries(HAV_PERF_SOURCES).map(([k, v]) => `<option value="${k}" ${k === cfg.perfSource ? 'selected' : ''}>${v}</option>`).join('');
    F('potSource').innerHTML = Object.entries(HAV_POT_SOURCES).map(([k, v]) => `<option value="${k}" ${k === cfg.potSource ? 'selected' : ''}>${v}</option>`).join('');
    const cats = [...new Set(competencies.map(c => c.kategori).filter(Boolean))];
    if(cfg.potSource === 'category' && !cats.includes(cfg.potCategory)) cfg.potCategory = cats[0] || '';
    F('potCategory').innerHTML = cats.map(c => `<option ${c === cfg.potCategory ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('') || '<option value="">No categories in dictionary</option>';
    F('potComps').innerHTML = competencies.map(c => `<label><input type="checkbox" value="${escapeHtml(c.id)}" ${(cfg.potCompetencies || []).includes(c.id) ? 'checked' : ''}>${escapeHtml(c.nama)}</label>`).join('') || '<span class="text-meta">Dictionary is empty.</span>';
    F('potCatWrap').style.display = cfg.potSource === 'category' ? 'block' : 'none';
    F('potSelWrap').style.display = cfg.potSource === 'selected' ? 'block' : 'none';
    F('perfLevels').innerHTML = levelRows('perfLevels');
    F('potLevels').innerHTML = levelRows('potLevels');
    document.querySelectorAll('#sizeTabs [data-size]').forEach(b => b.classList.toggle('active', +b.dataset.size === cfg.size));

    const ov = havAxesOverlap(cfg);
    F('overlapWarn').style.display = ov ? 'block' : 'none';
    F('overlapWarn').innerHTML = ov ? `<b>Both axes come from competency scores.</b> The PA score is the competency average, so ${cfg.perfSource === 'final' ? 'the final score (PA + KPI) already includes it' : 'performance and potential measure the same thing'}. People will line up on the diagonal. Consider Performance = <b>KPI score</b>, or Potential = <b>imported potential score</b> (e.g. psychological test / assessment center).` : '';
    renderGrid();
  }

  function renderGrid(){
    const n = cfg.size;
    const counts = {}; let unplaced = 0;
    assess.forEach(a => { const p = havPlace(a, cfg, competencies); if(!p){ unplaced++; return; } const k = p.row + '-' + p.col; counts[k] = (counts[k] || 0) + 1; });
    F('gridEd').style.gridTemplateColumns = `90px repeat(${n}, 1fr)`;
    let g = '';
    for(let r = 0; r < n; r++){
      g += `<div class="axl">${escapeHtml(cfg.potLevels[n - 1 - r].label)}</div>`;
      for(let c = 0; c < n; c++){
        const cell = cfg.cells[r][c], z = HAV_ZONES[cell.zone];
        g += `<div class="gcell ${selCell[0] === r && selCell[1] === c ? 'sel' : ''}" data-r="${r}" data-c="${c}" style="background:${z.bg} !important; color:${z.fg};">
          <div class="nm">${escapeHtml(cell.name) || '<span style="opacity:.55;">Untitled</span>'}</div><div class="ct">${(n => n + (n === 1 ? ' employee' : ' employees'))(counts[r + '-' + c] || 0)}</div></div>`;
      }
    }
    g += `<div></div>` + cfg.perfLevels.map(l => `<div class="axl">${escapeHtml(l.label)}</div>`).join('');
    F('gridEd').innerHTML = g;
    F('gridEd').querySelectorAll('[data-r]').forEach(el => el.onclick = () => { selCell = [+el.dataset.r, +el.dataset.c]; renderGrid(); });
    const [r, c] = selCell, cell = cfg.cells[r]?.[c];
    F('cellEdit').innerHTML = cell ? `
      <div><label>Box name (${escapeHtml(cfg.potLevels[n - 1 - r].label)} potential · ${escapeHtml(cfg.perfLevels[c].label)} performance)</label><input type="text" id="cellName" value="${escapeHtml(cell.name)}" placeholder="e.g. Star"></div>
      <div><label>Color</label><select id="cellZone">${Object.entries(HAV_ZONES).map(([k, z]) => `<option value="${k}" ${k === cell.zone ? 'selected' : ''}>${z.label}</option>`).join('')}</select></div>` : '';
    F('cellName')?.addEventListener('input', e => { cell.name = e.target.value; const nm = F('gridEd').querySelector(`[data-r="${r}"][data-c="${c}"] .nm`); if(nm) nm.textContent = e.target.value || 'Untitled'; });
    F('cellZone')?.addEventListener('change', e => { cell.zone = e.target.value; renderGrid(); });
    F('unplaced').textContent = assess.length ? `${assess.length - unplaced} of ${assess.length} employees placed${unplaced ? ` · ${unplaced} missing a ${cfg.potSource === 'imported' ? 'potential' : 'performance or potential'} score` : ''}.` : 'No performance data yet, so boxes show 0.';
  }

  F('perfSource').addEventListener('change', e => { cfg.perfSource = e.target.value; render(); });
  F('potSource').addEventListener('change', e => { cfg.potSource = e.target.value; render(); });
  F('potCategory').addEventListener('change', e => { cfg.potCategory = e.target.value; renderGrid(); });
  F('potComps').addEventListener('change', () => { cfg.potCompetencies = [...F('potComps').querySelectorAll('input:checked')].map(i => i.value); renderGrid(); });
  document.addEventListener('input', e => {
    const el = e.target; if(!el.dataset.lv) return;
    const l = cfg[el.dataset.lv][+el.dataset.i];
    if(el.dataset.f === 'min') l.min = Number(el.value) || 0; else l.label = el.value;
    renderGrid();
  });
  document.querySelectorAll('#sizeTabs [data-size]').forEach(b => b.onclick = () => {
    const n = +b.dataset.size; if(n === cfg.size) return;
    if(!confirm(`Switch to ${n} × ${n}? Box names, colors and levels will reset to the defaults for that size.`)) return;
    cfg = { ...cfg, size: n, perfLevels: havLevels(n), potLevels: havLevels(n), cells: havDefaultCells(n) }; selCell = [0, 0]; render();
  });
  F('resetBtn').onclick = () => { if(confirm('Reset the whole HAV setup to the default 3 × 3 9-box?')){ cfg = havDefaultConfig(3); selCell = [0, 0]; render(); } };
  F('saveBtn').onclick = async () => {
    for(const key of ['perfLevels', 'potLevels']){
      const mins = cfg[key].map(l => l.min);
      if(mins.some((m, i) => i > 0 && m <= mins[i - 1])) return showToast(`${key === 'perfLevels' ? 'Performance' : 'Potential'} levels must go up: each "from score" must be higher than the one before.`);
    }
    if(cfg.potSource === 'selected' && !(cfg.potCompetencies || []).length) return showToast('Select at least one competency for Potential.');
    try{
      await setDoc(doc(db, 'settings', 'havConfig'), { ...cfg, updatedAt: serverTimestamp(), updatedBy: profile.email });
      showToast('HAV setup saved. The HAV Map now uses it.');
    } catch(err){ console.error('Gagal simpan havConfig:', err.code, err.message); showToast('Save failed: ' + err.message); }
  };

  onAuth(async (user) => {
    if(!user){ F('gateTitle').textContent = 'Please sign in'; F('gateSub').innerHTML = `<a href="../index.html">Sign in to the LMS first</a>.`; return; }
    profile = await ensureUserProfile(user);
    if(profile.role !== 'admin'){ F('gateTitle').textContent = 'Access denied'; F('gateSub').textContent = 'This page is for Admins (HR/OD) only.'; return; }
    const [cfgSnap, comps, as] = await Promise.all([
      getDoc(doc(db, 'settings', 'havConfig')).catch(() => null),
      getDocs(collection(db, 'competencies')).then(s => { const o = []; s.forEach(d => o.push({ id: d.id, ...d.data() })); return o; }).catch(() => []),
      getDocs(collection(db, 'assessments')).then(s => { const o = []; s.forEach(d => o.push(d.data())); return o; }).catch(() => []),
    ]);
    if(cfgSnap?.exists()) cfg = havNormalize(cfgSnap.data());
    competencies = comps.sort((a, b) => (a.urutan || 0) - (b.urutan || 0));
    const last = as.map(a => a.periode).sort((a, b) => periodeRank(b) - periodeRank(a))[0];
    assess = as.filter(a => a.periode === last);
    F('previewPeriod').textContent = last ? periodeLabel(last) : 'the latest period';
    F('userAvatar').src = profile.photoURL || ''; F('userName').textContent = profile.displayName;
    F('gate').style.display = 'none'; F('appShell').style.display = 'block';
    render();
  });
</script>
<script type="module" src="./tms-shell.js?v=20261111g"></script>
<script src="../lms-motion.js?v=20261109" defer></script>
</body>
</html>
