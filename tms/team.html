<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Team — Anteraja TMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../lms-design-system.css?v=20261105b">
<link rel="stylesheet" href="../lms-glass.css?v=20261111b">
<style>
  .wrap.wide { max-width: 1100px; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; }
  .user-chip { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }
  .stat-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 20px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); padding: 16px 18px; }
  .stat-num { font-size: 26px; font-weight: 700; color: var(--pink); line-height: 1; }
  .stat-label { font-size: 12px; color: var(--text-2); margin-top: 6px; }
  table.data-table tr.clickable { cursor: pointer; }
  table.data-table tr.selected td { background: var(--pink-bg); }
  .head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin: 28px 0 14px; }
  .act { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 14px 20px; border-bottom: 1px solid var(--border); }
  .act:last-child { border-bottom: none; }
  .act-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
  .cg-title { padding: 14px 20px 4px; font-weight: 700; display: flex; gap: 8px; align-items: center; }
  .link-btn { color: var(--pink); font-size: 12px; font-weight: 600; cursor: pointer; background: none; border: none; padding: 0; box-shadow: none; }
  @media (max-width: 760px) { .stat-row { grid-template-columns: repeat(2,1fr); } }
</style>
</head>
<body>
<script src="./tms-shell-early.js?v=20261111c"></script>

<div id="gate" class="locked-state">
  <p class="text-h2" id="gateTitle" style="margin-bottom:8px;">Loading...</p>
  <p class="text-sub" id="gateSub"></p>
</div>

<div id="appShell" style="display:none;">
  <div class="topbar">
    <div style="display:flex; align-items:center; gap:16px;">
      <a href="index.html" class="sidebar-logo" style="margin:0; text-decoration:none;">anteraja TMS</a>
      <a href="index.html" class="text-sub" style="text-decoration:none; display:flex; align-items:center; gap:4px;">← TMS Menu</a>
    </div>
    <div class="user-chip">
      <a href="../index.html" class="btn btn-outline btn-sm" style="margin-right:6px;">Go to LMS</a>
      <img class="avatar" id="userAvatar" src="">
      <span id="userName"></span>
    </div>
  </div>
  <div class="wrap wide">
    <div class="head-row" style="margin-top:0;">
      <h1 class="text-h1" style="margin:0;">My Team</h1>
      <select id="periodeSelect" style="max-width:220px; margin:0;"></select>
    </div>
    <div class="stat-row">
      <div class="stat-card"><div class="stat-num" id="sPending">-</div><div class="stat-label">Awaiting Your Approval</div></div>
      <div class="stat-card"><div class="stat-num" id="sActive">-</div><div class="stat-label">Approved IDPs</div></div>
      <div class="stat-card"><div class="stat-num" id="sDone">-</div><div class="stat-label">Activities Done</div></div>
      <div class="stat-card"><div class="stat-num" id="sLate">-</div><div class="stat-label">Overdue Activities</div></div>
    </div>
    <div class="panel">
      <div style="overflow-x:auto;">
      <table class="data-table">
        <thead><tr><th>Name</th><th>IDP Status</th><th style="min-width:180px;">Progress</th><th>Overdue</th><th>Last Update</th></tr></thead>
        <tbody id="listBody"></tbody>
      </table>
      </div>
    </div>
    <div id="detail"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
  import { db, onAuth, ensureUserProfile } from '../firebase-shared.js';
  import { iconSvg } from '../lms-icons.js';
  import { escapeHtml, periodeRank, periodeLabel, IDP_JENIS, IDP_STATUS, APPROVAL_STATUS, APPROVAL_BADGE, planApproval, itemProgress, planIdOf } from '../competency-shared.js?v=20261111b';
  import { STATUS_BADGE, fmtDate, targetHtml, isOverdue, timelineHtml, progressBar, askProgress, askNote, postUpdate } from './idp-ui.js?v=20261111c';
  import { collection, getDocs, query, where, doc, updateDoc, writeBatch } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

  const F = id => document.getElementById(id);
  let me = '', profile = null, plans = [], updates = [], attemptsByPlan = {}, selectedId = new URLSearchParams(location.search).get('plan') || '', periode = '';
  const showToast = msg => { const t = F('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000); };
  const canAct = p => p.atasanEmail === me;
  const updatesOf = p => updates.filter(u => u.planId === planIdOf(p));
  const prog = (p, it) => itemProgress(it, attemptsByPlan[planIdOf(p)] || [], updatesOf(p));

  async function grab(q, label){
    try{ const out = []; (await getDocs(q)).forEach(d => out.push({ _id: d.id, ...d.data() })); return out; }
    catch(err){ console.error('Gagal baca', label, err.code, err.message); return []; }
  }

  async function load(){
    const [a, b, u1, u2] = await Promise.all([
      grab(query(collection(db, 'developmentPlans'), where('atasanEmail', '==', me)), 'plans/atasan'),
      grab(query(collection(db, 'developmentPlans'), where('viewerEmails', 'array-contains', me)), 'plans/viewer'),
      grab(query(collection(db, 'idpUpdates'), where('atasanEmail', '==', me)), 'updates/atasan'),
      grab(query(collection(db, 'idpUpdates'), where('viewerEmails', 'array-contains', me)), 'updates/viewer'),
    ]);
    const byId = new Map(); [...a, ...b].forEach(p => byId.set(p._id, p)); plans = [...byId.values()];
    const seen = new Set(); updates = [...u1, ...u2].filter(u => { const k = u._id; if(seen.has(k)) return false; seen.add(k); return true; });
    // riwayat training (untuk aksi training yang otomatis selesai saat lulus post-test)
    await Promise.all(plans.map(async p => {
      const qs = [grab(query(collection(db, 'attempts'), where('nik', '==', p.nik)), 'attempts')];
      if(p.email) qs.push(grab(query(collection(db, 'attempts'), where('email', '==', p.email)), 'attempts'));
      attemptsByPlan[planIdOf(p)] = (await Promise.all(qs)).flat();
    }));
    const periodes = [...new Set(plans.map(p => p.periode))].sort((x, y) => periodeRank(y) - periodeRank(x));
    if(!periodes.includes(periode)) periode = (plans.find(p => p._id === selectedId) || {}).periode || periodes[0] || '';
    F('periodeSelect').innerHTML = periodes.map(p => `<option value="${escapeHtml(p)}" ${p === periode ? 'selected' : ''}>${escapeHtml(periodeLabel(p))}</option>`).join('');
    return plans.length > 0;
  }

  function stats(p){
    const items = (p.items || []).filter(it => it.status !== 'batal');
    const st = items.map(it => ({ it, s: prog(p, it).status }));
    return { total: items.length, done: st.filter(x => x.s === 'selesai').length, late: st.filter(x => isOverdue(x.it, x.s)).length };
  }

  function renderList(){
    const rows = plans.filter(p => p.periode === periode).sort((a, b) => {
      const pa = canAct(a) && planApproval(a).status === 'pending', pb = canAct(b) && planApproval(b).status === 'pending';
      return (pb - pa) || (a.nama || '').localeCompare(b.nama || '');
    });
    let pending = 0, active = 0, done = 0, total = 0, late = 0;
    F('listBody').innerHTML = rows.map(p => {
      const appr = planApproval(p); const s = stats(p);
      if(appr.status === 'pending' && canAct(p)) pending++;
      if(appr.status === 'approved'){ active++; done += s.done; total += s.total; late += s.late; }
      const lastUp = updatesOf(p).sort((x, y) => String(y.at).localeCompare(String(x.at)))[0];
      return `<tr class="clickable ${p._id === selectedId ? 'selected' : ''}" data-id="${escapeHtml(p._id)}">
        <td><strong>${escapeHtml(p.nama || p.nik)}</strong><div class="text-meta">${escapeHtml(p.jabatan || '')}${canAct(p) ? '' : ' · indirect report'}</div></td>
        <td><span class="badge ${APPROVAL_BADGE[appr.status]}">${appr.status === 'pending' && canAct(p) ? 'Needs Your Approval' : APPROVAL_STATUS[appr.status]}</span>${appr.status === 'approved' && !p.ack?.at && !appr.legacy ? '<div class="text-meta" style="margin-top:4px;">Employee hasn\'t agreed yet</div>' : ''}</td>
        <td>${appr.status === 'approved' ? progressBar(s.done, s.total) : `<span class="text-meta">${s.total} planned</span>`}</td>
        <td>${s.late && appr.status === 'approved' ? `<span class="badge badge-red">${s.late}</span>` : '<span class="text-meta">-</span>'}</td>
        <td class="text-meta">${lastUp ? escapeHtml(fmtDate(lastUp.at)) : '-'}</td>
      </tr>`;
    }).join('') || `<tr><td colspan="5"><div class="empty-state"><p>No IDPs for this period.</p></div></td></tr>`;
    F('sPending').textContent = pending; F('sActive').textContent = active;
    F('sDone').textContent = total ? `${done}/${total}` : '-'; F('sLate').textContent = late;
    F('listBody').querySelectorAll('tr[data-id]').forEach(tr => tr.addEventListener('click', () => {
      selectedId = tr.dataset.id; history.replaceState(null, '', `?plan=${encodeURIComponent(selectedId)}`);
      renderList(); renderDetail(); F('detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }));
  }

  function renderDetail(){
    const p = plans.find(x => x._id === selectedId && x.periode === periode);
    if(!p){ F('detail').innerHTML = ''; return; }
    const appr = planApproval(p);
    const approved = appr.status === 'approved';
    const act = canAct(p);
    const byComp = new Map();
    (p.items || []).filter(it => it.status !== 'batal').forEach(it => { const k = it.kompetensiNama || it.kompetensiId; if(!byComp.has(k)) byComp.set(k, []); byComp.get(k).push(it); });

    const approvalBox = appr.status === 'pending' && act ? `
      <div class="card" style="margin-bottom:16px; border-left:3px solid var(--amber);">
        <div class="text-h3" style="margin-bottom:4px;">This IDP needs your approval</div>
        <div class="text-meta">Prepared by HR/OD${appr.submittedAt ? ' · submitted ' + escapeHtml(fmtDate(appr.submittedAt)) : ''}. Review the activities below, then approve or ask HR/OD to revise.</div>
        ${appr.previousNote ? `<div class="text-meta" style="margin-top:6px;">Your previous revision note: “${escapeHtml(appr.previousNote)}”</div>` : ''}
        <div style="display:flex; gap:8px; margin-top:12px;">
          <button class="btn btn-primary" id="approveBtn">Approve IDP</button>
          <button class="btn btn-outline" id="reviseBtn">Request Revision</button>
        </div>
      </div>`
      : `<div class="card" style="margin-bottom:16px;">
        <span class="badge ${APPROVAL_BADGE[appr.status]}">${APPROVAL_STATUS[appr.status]}</span>
        <span class="text-meta" style="margin-left:6px;">${
          appr.status === 'approved' ? (appr.legacy ? 'Approved' : `Approved by ${escapeHtml(appr.byNama || appr.byEmail || '-')} · ${escapeHtml(fmtDate(appr.at))}`) + (p.ack?.at ? ` · employee agreed ${escapeHtml(fmtDate(p.ack.at))}` : appr.legacy ? '' : ' · waiting for employee agreement')
          : appr.status === 'revision' ? `Revision requested${appr.byNama ? ' by ' + escapeHtml(appr.byNama) : ''} · HR/OD is revising`
          : appr.status === 'pending' ? `Waiting for ${escapeHtml(p.atasanNama || 'the direct manager')}`
          : 'HR/OD is preparing this IDP'}</span>
        ${appr.note && appr.status !== 'pending' ? `<div class="text-meta" style="margin-top:6px;">Note: “${escapeHtml(appr.note)}”</div>` : ''}
      </div>`;

    F('detail').innerHTML = `
      <div class="head-row">
        <div>
          <h2 class="text-h1" style="margin:0;">${escapeHtml(p.nama || p.nik)}</h2>
          <div class="text-sub">${escapeHtml(p.jabatan || '-')} · NIK ${escapeHtml(p.nik)} · IDP ${escapeHtml(periodeLabel(p.periode))}</div>
        </div>
        ${(p.viewerEmails || []).includes(me) ? `<a class="btn btn-outline btn-sm" href="profile.html?nik=${encodeURIComponent(p.nik)}&periode=${encodeURIComponent(p.periode)}">View Competency Profile</a>` : ''}
      </div>
      ${approvalBox}
      ${p.catatan ? `<div class="card" style="margin-bottom:16px;"><div class="text-h3" style="margin-bottom:4px;">Development Focus</div><div>${escapeHtml(p.catatan)}</div></div>` : ''}
      <div class="panel">
        <div class="panel-head"><h3 class="text-h2" style="margin:0;">Development Activities</h3>${approved ? progressBar(stats(p).done, stats(p).total).replace('display:flex;', 'display:flex; min-width:220px;') : ''}</div>
        ${[...byComp.entries()].map(([comp, list]) => `
          <div class="cg-title">${escapeHtml(comp)}</div>
          ${list.map(it => {
            const pr = prog(p, it);
            const canUpdate = act && approved && it.jenis !== 'training';
            return `<div class="act">
              <div style="min-width:0;">
                <div style="font-weight:600;">${escapeHtml(it.jenis === 'training' ? (it.judul || 'Training') : (it.deskripsi || ''))}</div>
                <div class="text-meta">${escapeHtml(IDP_JENIS[it.jenis] || it.jenis)}${it.mentorNama ? ` · ${it.jenis === 'coaching' ? 'coach' : 'mentor'} ${escapeHtml(it.mentorNama)}` : ''}${it.targetTanggal ? ' · ' + targetHtml(it, pr.status) : ''}${pr.auto && pr.score != null ? ` · post-test ${pr.score}` : ''}</div>
                ${pr.last ? `<div class="text-meta" style="margin-top:4px;">Last: ${escapeHtml(pr.last.byNama || '')} · ${escapeHtml(fmtDate(pr.last.at))}${pr.last.note ? ' · “' + escapeHtml(pr.last.note) + '”' : ''}</div>` : ''}
                ${pr.updates.length ? `<button class="link-btn" data-tl="${escapeHtml(it.id)}" style="margin-top:4px;">History (${pr.updates.length})</button><div data-tlbox="${escapeHtml(it.id)}" style="display:none;">${timelineHtml(pr.updates)}</div>` : ''}
              </div>
              <div class="act-side">
                <span class="badge ${STATUS_BADGE[pr.status] || 'badge-gray'}">${escapeHtml(IDP_STATUS[pr.status] || pr.status)}</span>
                ${pr.auto ? '<span class="text-meta">auto from LMS</span>' : ''}
                ${canUpdate ? `<button class="btn btn-outline btn-sm" data-up="${escapeHtml(it.id)}">Update Progress</button>` : ''}
              </div>
            </div>`;
          }).join('')}`).join('') || '<div class="empty-state"><p>No activities.</p></div>'}
      </div>
      ${!act ? '<p class="text-meta" style="margin-top:12px;">You can view this IDP as a senior manager. Approval and progress updates are done by the direct manager or the mentor.</p>' : ''}`;

    F('detail').querySelectorAll('[data-tl]').forEach(b => b.addEventListener('click', () => {
      const box = F('detail').querySelector(`[data-tlbox="${CSS.escape(b.dataset.tl)}"]`); box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }));
    F('detail').querySelectorAll('[data-up]').forEach(b => b.addEventListener('click', async () => {
      const it = p.items.find(x => x.id === b.dataset.up);
      const res = await askProgress({ title: p.nama, subtitle: it.deskripsi || it.judul, current: prog(p, it).status });
      if(!res) return;
      try{
        const u = await postUpdate({ src: { planId: planIdOf(p), nik: p.nik, periode: p.periode, menteeEmail: p.email, atasanEmail: p.atasanEmail, viewerEmails: p.viewerEmails }, item: it, ...res, byRole: 'Manager', profile });
        updates.push(u); showToast('Progress updated.'); renderList(); renderDetail();
      } catch(err){ console.error('Gagal simpan update:', err.code, err.message); showToast('Update failed: ' + err.message); }
    }));
    F('approveBtn')?.addEventListener('click', () => decide(p, 'approved'));
    F('reviseBtn')?.addEventListener('click', () => decide(p, 'revision'));
  }

  async function decide(p, status){
    let note = '';
    if(status === 'revision'){
      note = await askNote({ title: 'Request Revision', label: 'What should HR/OD change?', placeholder: 'e.g. Add a stretch assignment for Planning & Controlling; the mentoring target is too short.', okText: 'Send to HR/OD' });
      if(note === null) return;
    } else {
      note = await askNote({ title: 'Approve IDP', label: 'Note for the employee (optional)', placeholder: 'e.g. Good plan. Let\'s review progress together every month.', okText: 'Approve', required: false });
      if(note === null) return;
    }
    const approval = { ...planApproval(p), status, byEmail: me, byNama: profile.displayName || me, at: new Date().toISOString(), note };
    delete approval.legacy;
    try{
      await updateDoc(doc(db, 'developmentPlans', p._id), { approval });
      // salinan mentor ikut tahu status IDP
      const ms = await getDocs(query(collection(db, 'mentorships'), where('atasanEmail', '==', me), where('planId', '==', p._id))).catch(err => { console.error('Gagal baca mentorships:', err.code, err.message); return null; });
      if(ms && !ms.empty){ const b = writeBatch(db); ms.forEach(d => b.update(doc(db, 'mentorships', d.id), { planStatus: status })); await b.commit(); }
      p.approval = approval;
      showToast(status === 'approved' ? 'IDP approved. The employee can now see it.' : 'Revision request sent to HR/OD.');
      renderList(); renderDetail();
    } catch(err){ console.error('Gagal simpan approval:', err.code, err.message); showToast('Failed: ' + err.message); }
  }

  F('periodeSelect').addEventListener('change', e => { periode = e.target.value; selectedId = ''; F('detail').innerHTML = ''; renderList(); });

  onAuth(async (user) => {
    if(!user){ F('gateTitle').textContent = 'Please sign in'; F('gateSub').innerHTML = `<a href="../index.html">Sign in to the LMS first</a>.`; return; }
    profile = await ensureUserProfile(user);
    me = (user.email || '').toLowerCase();
    if(!(await load())){
      F('gateTitle').textContent = 'No team IDPs yet';
      F('gateSub').innerHTML = `IDPs for your direct reports will appear here once HR/OD prepares them. <a href="index.html">Back to TMS</a>.`;
      return;
    }
    F('userAvatar').src = profile.photoURL || ''; F('userName').textContent = profile.displayName;
    F('gate').style.display = 'none'; F('appShell').style.display = 'block';
    renderList(); renderDetail();
  });
</script>
<script type="module" src="./tms-shell.js?v=20261111d"></script>
<script src="../lms-motion.js?v=20261109" defer></script>
</body>
</html>
