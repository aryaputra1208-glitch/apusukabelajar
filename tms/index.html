<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anteraja TMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../lms-design-system.css?v=20261105b">
<link rel="expect" href="#tms-nav-ready" blocking="render">

<style>
  .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 12px; margin-bottom: 28px; }
  .menu-card { border: 1px solid var(--border); border-radius: var(--r-card); padding: 20px; text-decoration: none; color: var(--text); display: block; background: var(--surface); transition: border-color .12s; }
  .menu-card:hover { border-color: var(--pink); }
  .menu-icon { width: 40px; height: 40px; border-radius: var(--r-control); background: var(--pink-bg); color: var(--pink-dark); display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
  .user-chip { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }
  .avatar { width: 28px; height: 28px; border-radius: 50%; }
  .wrap.wide { max-width: 1180px; }
  .kpi-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin: 16px 0 18px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); padding: 16px 18px; text-decoration: none; color: var(--text); display: block; }
  .kpi .n { font-size: 26px; font-weight: 700; color: var(--pink); line-height: 1; }
  .kpi .l { font-size: 12px; color: var(--text-2); margin-top: 6px; }
  .kpi .s { font-size: 11.5px; color: var(--text-3); margin-top: 3px; }
  .hav-wrap { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(260px, 1fr); gap: 16px; }
  .hav-body { padding: 18px 20px 20px; }
  .hav-grid { display: grid; grid-template-columns: 26px repeat(3, 1fr); grid-template-rows: repeat(3, minmax(122px, auto)) 26px; gap: 8px; }
  .hav-ylab { grid-row: 1 / 4; grid-column: 1; writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; font-size: 11.5px; font-weight: 600; color: var(--text-2); letter-spacing: .02em; }
  .hav-xlab { grid-column: 2 / 5; grid-row: 4; text-align: center; font-size: 11.5px; font-weight: 600; color: var(--text-2); align-self: end; }
  .hav-cell { border-radius: 12px; padding: 12px; cursor: pointer; border: 1.5px solid transparent; display: flex; flex-direction: column; justify-content: space-between; transition: transform .12s, border-color .12s; text-align: left; font: inherit; }
  .hav-cell:hover { transform: translateY(-1px); }
  .hav-cell.sel { border-color: var(--text); }
  .hav-cell .nm { font-size: 12.5px; font-weight: 700; }
  .hav-cell .ct { font-size: 24px; font-weight: 700; line-height: 1; }
  .hav-cell .pc { font-size: 11px; opacity: .8; }
  .hav-cell .ax { font-size: 10.5px; opacity: .7; margin-top: 2px; }
  .z-g { background: rgba(34,160,90,.30) !important; color: #0f5a31; }
  .z-y { background: rgba(240,170,20,.32) !important; color: #6b4800; }
  .z-r { background: rgba(225,60,60,.24) !important; color: #861a1a; }
  .hav-list { max-height: 420px; overflow-y: auto; }
  .hav-row { display: flex; justify-content: space-between; gap: 10px; padding: 10px 20px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .hav-row:last-child { border-bottom: none; }
  .dist-row { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 10px; align-items: center; padding: 7px 20px; font-size: 12.5px; cursor: pointer; }
  .dist-row .dot { width: 10px; height: 10px; border-radius: 3px; }
  .mock-tag { white-space: nowrap; font-size: 11px; font-weight: 600; background: var(--amber-bg, #fff3d6); color: #7a5300; border-radius: 999px; padding: 2px 9px; }
  .idp-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 30px 0 12px; scroll-margin-top: 20px; }
  .idp-head select, .idp-head input { margin: 0; }
  .charts3 { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 16px; margin-top: 16px; }
  .chart-box { display: flex; align-items: center; gap: 18px; padding: 8px 20px 20px; }
  .dn { position: relative; width: 132px; height: 132px; flex: none; }
  .dn .c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .dn .c b { font-size: 22px; line-height: 1; }
  .lg { display: grid; gap: 7px; font-size: 12.5px; flex: 1; min-width: 0; }
  .lg div { display: flex; align-items: center; gap: 8px; }
  .lg i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .lg b { margin-left: auto; }
  .dbar { margin-top: 11px; font-size: 12.5px; }
  .dbar .t { display: flex; justify-content: space-between; margin-bottom: 4px; gap: 8px; }
  .stk { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: rgba(120,120,128,.14); }
  .stk span { display: block; height: 100%; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--border); background: rgba(255,255,255,.6); border-radius: 99px; padding: 5px 11px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--text-2); }
  .chip.on { background: var(--pink); border-color: var(--pink); color: #fff; }
  .chip .n { opacity: .75; margin-left: 4px; }
  .icards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; padding: 4px 20px 20px; }
  .icard { display: block; text-decoration: none; color: inherit; border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; background: rgba(255,255,255,.55); transition: transform .12s, box-shadow .12s; }
  .icard:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.08); }
  .icard .top { display: flex; gap: 12px; align-items: center; }
  .icard .av { width: 38px; height: 38px; border-radius: 50%; background: var(--pink-bg); color: var(--pink-dark); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex: none; }
  .icard .nm { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icard .sub { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icard .meta { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 12.5px; margin-top: 12px; }
  .icard .meta > span:nth-child(odd) { color: var(--text-3); }
  .icard .meta > span:nth-child(even) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icard .lgd { display: flex; gap: 10px; font-size: 11.5px; color: var(--text-3); margin-top: 6px; flex-wrap: wrap; }
  .late-t { color: var(--red); font-weight: 600; }
  @media (max-width: 1100px) { .charts3 { grid-template-columns: 1fr 1fr; } .charts3 > :last-child { grid-column: 1 / -1; } }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  .rem { display: flex; justify-content: space-between; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); align-items: flex-start; }
  .rem:last-child { border-bottom: none; }
  .rem ul { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--text-2); }
  .rem-btns { display: flex; gap: 6px; flex-shrink: 0; }
  .btn { white-space: nowrap; }
  @media (max-width: 900px) { .kpi-row { grid-template-columns: repeat(2,1fr); } .hav-wrap { grid-template-columns: 1fr; } .two { grid-template-columns: 1fr; } .charts3 { grid-template-columns: 1fr; } }
</style>
</head>

<script>/* sidebar TMS dari cache — inline supaya ikut paint pertama (tanpa kedip) */(function () { try { var c = JSON.parse(sessionStorage.getItem('tmsNavCache2') || 'null'); if (!c || !c.html) return; var st = document.createElement('style'); st.id = 'tms-shell-css'; st.textContent = c.css; document.head.appendChild(st); var box = document.createElement('div'); box.innerHTML = c.html; var nav = box.firstElementChild; if (c.sig) nav.setAttribute('data-sig', c.sig); var cur = location.pathname.split('/').pop() || 'index.html'; nav.querySelectorAll('a.as-item').forEach(function (a) { a.classList.toggle('active', a.getAttribute('href') === cur); }); document.body.prepend(nav); document.body.classList.add('has-admin-sidebar'); } catch (e) {} })();</script><i id="tms-nav-ready" hidden></i>

<div id="gate" class="locked-state">
  <p class="text-h2" id="gateTitle" style="margin-bottom:8px;">Loading...</p>
  <p class="text-sub" id="gateSub"></p>
</div>

<div id="appShell" style="display:none;">
  <div class="topbar">
    <div class="sidebar-logo" style="margin:0;">anteraja TMS</div>
    <div class="user-chip">
      <a href="../index.html" class="btn btn-outline btn-sm" style="margin-right:6px;">Go to LMS</a>
      <img class="avatar" id="userAvatar" src="">
      <span id="userName"></span>
    </div>
  </div>
  <div class="wrap" id="mainWrap">
    <h1 class="text-h1" id="pageTitle">Talent Management</h1>
    <div id="sections"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
  import { db, onAuth, ensureUserProfile } from '../firebase-shared.js';
  import { iconSvg } from '../lms-icons.js';
  import { itemProgress, planIdOf, havNormalize, havPlace, HAV_ZONES, HAV_PERF_SOURCES, HAV_POT_SOURCES, escapeHtml, periodeLabel, periodeRank, IDP_JENIS, planApproval, daysUntil, computeReminders, reminderEmail } from '../competency-shared.js?v=20261111d';
  import { fmtDate, isOverdue } from './idp-ui.js?v=20261111e';
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
  import { collection, getDocs, query, where, limit } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

  const F = id => document.getElementById(id);
  const card = m => `<a class="menu-card" href="${m.href}"><div class="menu-icon">${iconSvg(m.icon, {size:20})}</div>
    <div style="font-weight:700; font-size:14px; margin-bottom:4px;">${m.title}</div><div class="text-sub">${m.desc}</div></a>`;
  const section = (title, items) => items.length ? `<div class="text-h3" style="margin-top:8px;">${title}</div><div class="menu-grid">${items.map(card).join('')}</div>` : '';

  async function exists(q, label){
    try{ return !(await getDocs(q)).empty; }
    catch(err){ console.error('Gagal cek akses', label, err.code, err.message); return false; }
  }

  onAuth(async (user) => {
    if(!user){
      F('gateTitle').textContent = 'Please sign in';
      F('gateSub').innerHTML = `<a href="../index.html">Sign in to the LMS first</a>, then reopen TMS.`;
      return;
    }
    const profile = await ensureUserProfile(user);
    const email = (user.email || '').toLowerCase();
    const isAdmin = profile.role === 'admin';
    const hasIdpQuick = await exists(query(collection(db, 'developmentPlans'), where('email', '==', email), limit(1)), 'developmentPlans');
    const isMentor = !isAdmin && await exists(query(collection(db, 'assessments'), where('viewerEmails', 'array-contains', email), limit(1)), 'mentor');
    // Non-admin tidak punya beranda: mentor → halaman IDP mentor, karyawan → IDP Saya
    if(!isAdmin){
      if(isMentor) return location.replace('mentor-idp.html');
      if(hasIdpQuick) return location.replace('my-idp.html');
    }
    let html = '';
    if(isAdmin){
      F('mainWrap').classList.add('wide');
      F('pageTitle').textContent = 'Dashboard';
      html += await adminDashboardHtml();
    }
    if(!html){
      F('gateTitle').textContent = 'Nothing to show yet';
      F('gateSub').innerHTML = `${escapeHtml(profile.displayName || email)} has no approved IDP and is not listed as a Department Head (mentor) in any imported PA data. To make someone a mentor, make sure they have an email in Employees, then click "Refresh Manager Access" in Performance Data. <a href="../index.html">Back to LMS</a>.`;
      return;
    }
    F('gate').style.display = 'none'; F('appShell').style.display = 'block';
    F('userAvatar').src = profile.photoURL || '';
    F('userName').textContent = profile.displayName;
    F('sections').innerHTML = html;
    if(isAdmin){ await bindHav(); bindIdp(); if(location.hash === '#idp') F('idp')?.scrollIntoView(); }
  });

  /* ================= Dashboard admin (HR/OD) ================= */
  const cnt = async (q, label) => { try{ return (await getDocs(q)).size; } catch(err){ console.error('Gagal hitung', label, err.code, err.message); return null; } };
  async function adminDashboardHtml(){
    const [emps, plans, assess, updates, attempts] = await Promise.all([
      getDocs(collection(db, 'employees')).then(s => { const o = []; s.forEach(d => o.push({ _id: d.id, ...d.data() })); return o; }).catch(err => { console.error('Gagal baca employees', err.code, err.message); return null; }),
      getDocs(collection(db, 'developmentPlans')).then(s => { const o = []; s.forEach(d => o.push(d.data())); return o; }).catch(() => []),
      getDocs(collection(db, 'assessments')).then(s => { const o = []; s.forEach(d => o.push(d.data())); return o; }).catch(() => []),
      getDocs(collection(db, 'idpUpdates')).then(s => { const o = []; s.forEach(d => o.push(d.data())); return o; }).catch(() => []),
      getDocs(collection(db, 'attempts')).then(s => { const o = []; s.forEach(d => o.push(d.data())); return o; }).catch(() => []),
    ]);
    const nEmp = emps ? emps.length : null;
    idpPlans = plans; idpAttempts = attempts; idpUpdatesByPlan = {}; updates.forEach(u => (idpUpdatesByPlan[u.planId] = idpUpdatesByPlan[u.planId] || []).push(u));
    idpEmp = {}; (emps || []).forEach(e => idpEmp[e._id] = e);
    const rank = p => { const m = String(p || '').match(/^(\d{4})(?:-S([12]))?$/); return m ? Number(m[1]) * 10 + (m[2] ? Number(m[2]) : 3) : 0; };
    const lastP = assess.map(a => a.periode).sort((a, b) => rank(b) - rank(a))[0];
    havAssess = assess.filter(a => a.periode === lastP); havPeriod = lastP;
    const nAssessed = assess.filter(a => a.periode === lastP).length;
    const st = p => p.approval?.status || 'approved';
    const nApproved = plans.filter(p => st(p) === 'approved').length;
    // IDP berjalan = sudah disetujui dan masih ada aksi yang belum selesai
    const ongoing = plans.filter(p => st(p) === 'approved' && (p.items || []).some(it => {
      if(it.status === 'batal') return false;
      const att = attempts.filter(a => a.nik === p.nik || (p.email && a.email === p.email));
      return itemProgress(it, att, updates.filter(u => u.planId === planIdOf(p))).status !== 'selesai';
    })).length;
    const v = n => n == null ? '-' : n;
    return `
      <div class="kpi-row">
        <a class="kpi" href="employees.html"><div class="n">${v(nEmp)}</div><div class="l">Employees</div><div class="s">In master data</div></a>
        <a class="kpi" href="performance.html"><div class="n">${nAssessed}</div><div class="l">Assessed</div><div class="s">${lastP ? 'Latest period ' + lastP : 'No PA imported yet'}</div></a>
        <a class="kpi" href="#idp"><div class="n">${nApproved}/${plans.length}</div><div class="l">IDPs Approved</div><div class="s">All periods</div></a>
        <a class="kpi" href="#idp"><div class="n">${ongoing}</div><div class="l">Ongoing IDPs</div><div class="s">Approved, activities still running</div></a>
      </div>
      <div class="hav-wrap">
        <div class="panel" style="margin:0;">
          <div class="panel-head" style="display:block;">
            <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
              <h3 class="text-h2" style="margin:0;">HAV Map</h3>
              <a href="hav-setup.html" class="btn btn-outline btn-sm" style="flex:none;">Setup</a>
            </div>
            <div class="text-meta" id="havSub" style="margin-top:2px;">Performance × Potential</div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px;">
              <select id="havDiv" aria-label="Division" style="margin:0; width:100%; min-width:0;"></select>
              <select id="havLvl" aria-label="Level" style="margin:0; width:100%; min-width:0;"></select>
            </div>
          </div>
          <div class="hav-body"><div class="hav-grid" id="havGrid"></div></div>
        </div>
        <div style="display:flex; flex-direction:column; gap:16px;">
          <div class="panel" style="margin:0;">
            <div class="panel-head"><h3 class="text-h2" style="margin:0;">Distribution</h3><span class="text-meta" id="havTotal"></span></div>
            <div id="havDist" style="padding:6px 0 10px;"></div>
          </div>
          <div class="panel" style="margin:0;">
            <div class="panel-head"><h3 class="text-h2" style="margin:0;" id="havSelTitle">Star</h3><span class="text-meta" id="havSelCount"></span></div>
            <div class="hav-list" id="havList"></div>
          </div>
        </div>
      </div>

      <div class="idp-head" id="idp">
        <h2 class="text-h1" style="margin:0; font-size:22px;">IDP Overview</h2>
        <div style="display:flex; gap:8px;">
          <select id="periodeSelect" style="min-width:170px;"></select>
          <select id="divSelect" style="max-width:220px;"></select>
        </div>
      </div>
      <div class="kpi-row" style="margin-top:0;">
        <div class="kpi"><div class="n" id="kIdp">-</div><div class="l">IDPs</div><div class="s" id="kIdpSub"></div></div>
        <div class="kpi"><div class="n" id="kAppr">-</div><div class="l">Approved</div><div class="s" id="kApprSub"></div></div>
        <div class="kpi"><div class="n" id="kDone">-</div><div class="l">Activities Done</div><div class="s" id="kDoneSub"></div></div>
        <div class="kpi"><div class="n" id="kLate">-</div><div class="l">Overdue Activities</div><div class="s" id="kLateSub"></div></div>
      </div>
      <div class="charts3">
        <div class="panel" style="margin:0;">
          <div class="panel-head"><h3 class="text-h2" style="margin:0;">IDP Status</h3></div>
          <div class="chart-box" id="chStatus"></div>
        </div>
        <div class="panel" style="margin:0;">
          <div class="panel-head"><h3 class="text-h2" style="margin:0;">Activity Progress</h3><span class="text-meta">approved IDPs</span></div>
          <div class="chart-box" id="chAct"></div>
        </div>
        <div class="panel" style="margin:0;">
          <div class="panel-head"><h3 class="text-h2" style="margin:0;">Progress By Division</h3><span class="text-meta">% activities done</span></div>
          <div id="chDiv" style="padding:6px 20px 18px;"></div>
        </div>
      </div>
      <div class="panel" style="margin-top:16px;">
        <div class="panel-head" style="flex-wrap:wrap; gap:10px;">
          <div><h3 class="text-h2" style="margin:0;">All IDPs</h3><div class="text-meta" id="idpCount"></div></div>
          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            <div class="chips" id="idpChips"></div>
            <input type="text" id="idpSearch" placeholder="Search name or mentor" style="margin:0; width:200px;">
          </div>
        </div>
        <div class="icards" id="idpCards"></div>
      </div>
      <div class="panel" style="margin-top:16px;">
        <div class="panel-head">
          <div><h3 class="text-h2" style="margin:0;">Reminders</h3>
            <div class="text-meta">H-3, due date, then every 3 days while overdue · returned IDPs every 3 days · one message per person</div></div>
          <div style="display:flex; gap:8px; align-items:center;">
            <input type="date" id="remDate" style="margin:0; max-width:170px;">
            <button class="btn btn-outline btn-sm" id="copyAllBtn">Copy All</button>
          </div>
        </div>
        <div id="remList"></div>
      </div>`;
  }

  // HAV Map: memakai setup admin (settings/havConfig) + data PA periode terakhir
  let havAssess = [], havPeriod = '', havCfg = null, havComps = [], havSel = null, havRows = [];
  async function bindHav(){
    const [cs, comps] = await Promise.all([
      getDoc(doc(db, 'settings', 'havConfig')).catch(() => null),
      getDocs(collection(db, 'competencies')).then(s => { const o = []; s.forEach(d => o.push({ id: d.id, ...d.data() })); return o; }).catch(() => []),
    ]);
    havCfg = havNormalize(cs?.exists() ? cs.data() : {}); havComps = comps;
    havRows = havAssess.map(a => ({ a, p: havPlace(a, havCfg, havComps) }));
    const opts = (k, all) => `<option value="">${all}</option>` + [...new Set(havAssess.map(a => a[k]).filter(Boolean))].sort().map(v => `<option>${escapeHtml(v)}</option>`).join('');
    F('havDiv').innerHTML = opts('divisi', 'All divisions'); F('havLvl').innerHTML = opts('level', 'All levels');
    F('havDiv').addEventListener('change', drawHav); F('havLvl').addEventListener('change', drawHav);
    F('havSub').textContent = `${HAV_PERF_SOURCES[havCfg.perfSource]} × ${HAV_POT_SOURCES[havCfg.potSource].replace(/ \(.*\)$/, '')}${havPeriod ? ' · ' + periodeLabel(havPeriod) : ''}`;
    drawHav();
  }
  function drawHav(){
    const n = havCfg.size, div = F('havDiv').value, lvl = F('havLvl').value;
    const rows = havRows.filter(({ a }) => (!div || a.divisi === div) && (!lvl || a.level === lvl));
    const placed = rows.filter(r => r.p), by = {};
    placed.forEach(r => (by[r.p.row + '-' + r.p.col] = by[r.p.row + '-' + r.p.col] || []).push(r));
    const pct = x => placed.length ? Math.round(x / placed.length * 100) : 0;
    if(!havSel){ let best = null; for(let r = 0; r < n; r++) for(let c = 0; c < n; c++) if(!best && (by[r + '-' + c] || []).length) best = r + '-' + c; havSel = best || '0-' + (n - 1); }
    const grid = F('havGrid');
    grid.style.gridTemplateColumns = `26px repeat(${n}, 1fr)`;
    grid.style.gridTemplateRows = `repeat(${n}, minmax(${n > 3 ? 84 : 122}px, auto)) 26px`;
    let g = `<div class="hav-ylab" style="grid-row:1 / ${n + 1};">Potential →</div>`;
    for(let r = 0; r < n; r++) for(let c = 0; c < n; c++){
      const cell = havCfg.cells[r][c], z = HAV_ZONES[cell.zone], k = r + '-' + c, cnt = (by[k] || []).length;
      g += `<button type="button" class="hav-cell ${k === havSel ? 'sel' : ''}" data-k="${k}" style="grid-row:${r + 1}; grid-column:${c + 2}; background:${z.bg} !important; color:${z.fg};">
        <div><div class="nm">${escapeHtml(cell.name) || '&nbsp;'}</div><div class="ax">${escapeHtml(havCfg.potLevels[n - 1 - r].label)} pot · ${escapeHtml(havCfg.perfLevels[c].label)} perf</div></div>
        <div><span class="ct">${cnt}</span> <span class="pc">${pct(cnt)}%</span></div></button>`;
    }
    g += `<div class="hav-xlab" style="grid-column:2 / ${n + 2}; grid-row:${n + 1};">Performance →</div>`;
    grid.innerHTML = g;
    const unplaced = rows.length - placed.length;
    F('havTotal').textContent = `${placed.length} employees${unplaced ? ` · ${unplaced} missing a score` : ''}`;
    const cellsFlat = []; for(let r = 0; r < n; r++) for(let c = 0; c < n; c++) cellsFlat.push({ k: r + '-' + c, ...havCfg.cells[r][c] });
    F('havDist').innerHTML = cellsFlat.filter(x => x.name || (by[x.k] || []).length).sort((a, b) => (by[b.k] || []).length - (by[a.k] || []).length).map(x => {
      const cnt = (by[x.k] || []).length;
      return `<div class="dist-row" data-k="${x.k}"><span class="dot" style="background:${HAV_ZONES[x.zone].dot}"></span><span>${escapeHtml(x.name) || 'Box ' + x.k}</span><strong>${cnt}</strong><span class="text-meta" style="min-width:34px; text-align:right;">${pct(cnt)}%</span></div>`;
    }).join('') || '<div class="empty-state"><p>No data yet.</p></div>';
    const [sr, sc] = havSel.split('-').map(Number), sCell = havCfg.cells[sr]?.[sc] || { name: '' };
    const list = (by[havSel] || []).sort((x, y) => (y.p.perf + y.p.pot) - (x.p.perf + x.p.pot));
    F('havSelTitle').textContent = sCell.name || 'Selected box';
    F('havSelCount').textContent = `${list.length} employee${list.length === 1 ? '' : 's'}`;
    F('havList').innerHTML = list.map(({ a, p }) => `<a class="hav-row" href="profile.html?nik=${encodeURIComponent(a.nik)}&periode=${encodeURIComponent(a.periode)}" style="color:inherit; text-decoration:none;"><div><strong>${escapeHtml(a.nama)}</strong><div class="text-meta">${escapeHtml(a.jabatan || '')} · ${escapeHtml(a.divisi || '')}</div></div><div class="text-meta" style="text-align:right;">Perf ${p.perf.toFixed(2)}<br>Pot ${p.pot.toFixed(2)}</div></a>`).join('')
      || `<div class="empty-state"><p>${placed.length ? 'No one in this box.' : 'No data yet.'}</p></div>`;
    document.querySelectorAll('#havGrid [data-k], #havDist [data-k]').forEach(el => el.addEventListener('click', () => { havSel = el.dataset.k; drawHav(); }));
  }

  /* ================= IDP Overview (dulu halaman IDP Dashboard) ================= */
  let idpPlans = [], idpUpdatesByPlan = {}, idpAttempts = [], idpEmp = {}, periode = '';
  const showToast = msg => { const t = F('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000); };
  const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '-';
  const divOf = p => p.divisi || idpEmp[p.nik]?.divisi || '(No division)';
  const attemptsFor = p => idpAttempts.filter(t => t.nik === p.nik || (p.email && t.email === p.email));
  const tmsUrl = new URL('.', location.href).href;
  const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  function bindIdp(){
    const periodes = [...new Set(idpPlans.map(p => p.periode))].sort((a, b) => periodeRank(b) - periodeRank(a));
    periode = periodes[0] || '';
    F('periodeSelect').innerHTML = periodes.map(p => `<option value="${escapeHtml(p)}">${escapeHtml(periodeLabel(p))}</option>`).join('') || '<option value="">No IDPs yet</option>';
    F('remDate').value = todayStr();
    F('periodeSelect').addEventListener('change', e => { periode = e.target.value; F('divSelect').value = ''; renderIdp(); });
    F('divSelect').addEventListener('change', renderIdp);
    F('remDate').addEventListener('change', renderIdp);
    F('idpSearch').addEventListener('input', renderCards);
    F('copyAllBtn').addEventListener('click', () => {
      if(!reminders.length) return showToast('No reminders for this date.');
      copy(reminders.map(r => { const m = reminderEmail(r, tmsUrl); return `To: ${r.email || '(no email) ' + r.nama}\nSubject: ${m.subject}\n\n${m.body}`; }).join('\n\n----------\n\n'));
    });
    renderIdp();
  }
  function renderIdp(){
    const div = F('divSelect').value;
    const inPeriod = idpPlans.filter(p => p.periode === periode);
    const divs = [...new Set(inPeriod.map(divOf))].sort();
    F('divSelect').innerHTML = `<option value="">All divisions</option>` + divs.map(d => `<option ${d === div ? 'selected' : ''}>${escapeHtml(d)}</option>`).join('');
    const rows = inPeriod.filter(p => !div || divOf(p) === div);

    // per IDP
    const facts = rows.map(p => {
      const appr = planApproval(p);
      const items = (p.items || []).filter(it => it.status !== 'batal').map(it => ({ it, s: itemProgress(it, attemptsFor(p), idpUpdatesByPlan[planIdOf(p)] || []).status }));
      return { p, appr, items, done: items.filter(x => x.s === 'selesai').length, late: items.filter(x => isOverdue(x.it, x.s)) };
    });
    const approved = facts.filter(f => f.appr.status === 'approved');
    const pend = facts.filter(f => f.appr.status === 'pending');
    const actTotal = approved.reduce((n, f) => n + f.items.length, 0), actDone = approved.reduce((n, f) => n + f.done, 0);
    const late = approved.flatMap(f => f.late.map(x => ({ ...x, p: f.p })));
    const agreed = approved.filter(f => f.p.ack?.at || f.appr.legacy).length;

    F('kIdp').textContent = facts.length;
    F('kIdpSub').textContent = `${facts.filter(f => f.appr.status === 'draft').length} draft · ${facts.filter(f => f.appr.status === 'revision').length} in revision`;
    F('kAppr').textContent = pct(approved.length, facts.length);
    F('kApprSub').textContent = `${approved.length} approved · ${pend.length} pending · ${agreed} agreed by employee`;
    F('kDone').textContent = pct(actDone, actTotal);
    F('kDoneSub').textContent = `${actDone} of ${actTotal} activities (approved IDPs)`;
    F('kLate').textContent = late.length;
    F('kLateSub').textContent = (n => `${n} employee${n === 1 ? '' : 's'} affected`)(new Set(late.map(x => x.p.nik)).size);

    // ===== chart: status IDP =====
    const ST = [
      { k: 'approved', label: 'Approved', color: '#16A34A' },
      { k: 'pending', label: 'Waiting HR/OD', color: '#8b5cf6' },
      { k: 'revision', label: 'Returned to Mentor', color: '#DC2626' },
      { k: 'draft', label: 'Draft (Mentor)', color: '#94a3b8' },
    ];
    const stCount = k => facts.filter(f => f.appr.status === k).length;
    F('chStatus').innerHTML = facts.length
      ? donutSvg(ST.map(x => ({ v: stCount(x.k), color: x.color })), `<b>${facts.length}</b><span class="text-meta">IDPs</span>`) +
        `<div class="lg">${ST.map(x => `<div><i style="background:${x.color}"></i>${x.label}<b>${stCount(x.k)}</b></div>`).join('')}</div>`
      : '<div class="text-meta">No IDPs for this period.</div>';

    // ===== chart: progres aktivitas (IDP approved) =====
    const allActs = approved.flatMap(f => f.items);
    const nDone = allActs.filter(x => x.s === 'selesai').length, nProg = allActs.filter(x => x.s === 'berjalan').length;
    const nLate = allActs.filter(x => x.s !== 'selesai' && isOverdue(x.it, x.s)).length;
    const nPlan = allActs.length - nDone - nProg;
    F('chAct').innerHTML = allActs.length
      ? donutSvg([{ v: nDone, color: '#16A34A' }, { v: nProg, color: '#8b5cf6' }, { v: nPlan, color: 'rgba(120,120,128,.28)' }], `<b>${pct(nDone, allActs.length)}</b><span class="text-meta">done</span>`) +
        `<div class="lg"><div><i style="background:#16A34A"></i>Done<b>${nDone}</b></div><div><i style="background:#8b5cf6"></i>In progress<b>${nProg}</b></div>
          <div><i style="background:rgba(120,120,128,.28)"></i>Planned<b>${nPlan}</b></div><div><i style="background:transparent; box-shadow:inset 0 0 0 2px var(--red)"></i>Overdue<b class="${nLate ? 'late-t' : ''}">${nLate}</b></div></div>`
      : '<div class="text-meta">No approved IDPs yet.</div>';

    // ===== chart: per divisi (stacked bar done / in progress / planned) =====
    const byDiv = new Map();
    approved.forEach(f => { const d = divOf(f.p); if(!byDiv.has(d)) byDiv.set(d, []); byDiv.get(d).push(...f.items); });
    const divRows = [...byDiv.entries()].map(([d, it]) => ({ d, n: it.length, done: it.filter(x => x.s === 'selesai').length, prog: it.filter(x => x.s === 'berjalan').length }))
      .sort((x, y) => (y.done / (y.n || 1)) - (x.done / (x.n || 1)) || x.d.localeCompare(y.d));
    F('chDiv').innerHTML = divRows.map(r => `<div class="dbar"><div class="t"><span>${escapeHtml(r.d)}</span><span class="text-meta"><b style="color:var(--text)">${pct(r.done, r.n)}</b> · ${r.done}/${r.n}</span></div>
      <div class="stk"><span style="width:${r.n ? r.done / r.n * 100 : 0}%; background:#16A34A"></span><span style="width:${r.n ? r.prog / r.n * 100 : 0}%; background:#8b5cf6"></span></div></div>`).join('')
      || '<div class="text-meta" style="padding-top:8px;">No approved IDPs yet.</div>';

    // ===== kartu per IDP =====
    idpFacts = facts;
    renderCards();
    renderReminders(rows);
  }


  let idpFacts = [], idpFilter = 'all';
  const initials = n => String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  const fmtShort = d => { const x = new Date(d); return isNaN(x) ? '' : x.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); };
  function donutSvg(parts, center, size = 132){
    const R = size / 2 - 10, C = 2 * Math.PI * R, tot = parts.reduce((n, x) => n + x.v, 0) || 1;
    let off = 0;
    const segs = parts.filter(x => x.v > 0).map(x => { const len = x.v / tot * C; const el = `<circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="${x.color}" stroke-width="16" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})"/>`; off += len; return el; }).join('');
    return `<div class="dn"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="rgba(120,120,128,.12)" stroke-width="16"/>${segs}</svg><div class="c">${center}</div></div>`;
  }
  function ringSvg(v, color = '#16A34A', size = 50){
    const R = size / 2 - 5, C = 2 * Math.PI * R;
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none;"><circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="rgba(120,120,128,.15)" stroke-width="5"/>
      ${v > 0 ? `<circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${v / 100 * C} ${C}" transform="rotate(-90 ${size/2} ${size/2})"/>` : ''}
      <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="currentColor">${v}%</text></svg>`;
  }
  const STATUS_BADGE_H = { approved: ['badge-green', 'Approved'], pending: ['badge-purple', 'Waiting HR/OD'], revision: ['badge-red', 'Returned to Mentor'], draft: ['badge-gray', 'Draft'] };
  function renderCards(){
    const q = (F('idpSearch').value || '').trim().toLowerCase();
    const isLate = f => f.appr.status === 'approved' && f.late.length > 0;
    const CH = [['all', 'All', () => true], ['pending', 'Waiting HR/OD', f => f.appr.status === 'pending'], ['revision', 'Returned', f => f.appr.status === 'revision'],
      ['draft', 'Draft', f => f.appr.status === 'draft'], ['approved', 'Approved', f => f.appr.status === 'approved'], ['late', 'Overdue', isLate]];
    F('idpChips').innerHTML = CH.map(([k, l, fn]) => { const n = idpFacts.filter(fn).length; return (k === 'all' || n) ? `<button type="button" class="chip ${idpFilter === k ? 'on' : ''}" data-chip="${k}">${l}<span class="n">${n}</span></button>` : ''; }).join('');
    F('idpChips').querySelectorAll('[data-chip]').forEach(b => b.onclick = () => { idpFilter = b.dataset.chip; renderCards(); });
    const fn = (CH.find(c => c[0] === idpFilter) || CH[0])[2];
    const order = { pending: 0, revision: 1, draft: 3, approved: 2 };
    const list = idpFacts.filter(fn).filter(f => !q || `${f.p.nama} ${f.p.mentorNama || ''} ${f.p.jabatan || ''}`.toLowerCase().includes(q))
      .sort((a, b) => (order[a.appr.status] - order[b.appr.status]) || (b.late.length - a.late.length) || String(a.p.nama).localeCompare(String(b.p.nama)));
    F('idpCount').textContent = `${list.length} of ${idpFacts.length} IDPs · click a card to open`;
    F('idpCards').innerHTML = list.map(f => {
      const p = f.p, st = f.appr.status, [bc, bl] = STATUS_BADGE_H[st] || ['badge-gray', st];
      const n = f.items.length, prog = f.items.filter(x => x.s === 'berjalan').length;
      const comps = new Set(f.items.map(x => x.it.kompetensiId || x.it.kompetensiNama)).size;
      const next = f.items.filter(x => x.s !== 'selesai' && x.it.targetTanggal && daysUntil(x.it.targetTanggal) >= 0).sort((a, b) => a.it.targetTanggal.localeCompare(b.it.targetTanggal))[0];
      const v = n ? Math.round(f.done / n * 100) : 0;
      const days = st === 'pending' && f.appr.submittedAt ? -daysUntil(f.appr.submittedAt) : null;
      return `<a class="icard" href="idp.html?nik=${encodeURIComponent(p.nik)}&periode=${encodeURIComponent(p.periode)}">
        <div class="top"><div class="av">${escapeHtml(initials(p.nama))}</div>
          <div style="flex:1; min-width:0;"><div class="nm">${escapeHtml(p.nama || p.nik)}</div><div class="sub">${escapeHtml([p.jabatan, divOf(p)].filter(Boolean).join(' · '))}</div>
            <span class="badge ${bc}" style="margin-top:5px; display:inline-block;">${bl}${days != null ? ` · ${days === 0 ? 'today' : days + 'd'}` : ''}</span></div>
          ${st === 'approved' ? ringSvg(v) : ''}</div>
        ${st === 'approved' && n ? `<div class="stk" style="margin-top:12px;"><span style="width:${f.done / n * 100}%; background:#16A34A"></span><span style="width:${prog / n * 100}%; background:#8b5cf6"></span></div>
          <div class="lgd"><span>${f.done} done</span><span>${prog} in progress</span><span>${n - f.done - prog} planned</span></div>` : ''}
        <div class="meta">
          <span>Mentor</span><span>${p.mentorNama ? escapeHtml(p.mentorNama) : '<span class="late-t">not set</span>'}</span>
          <span>Plan</span><span>${comps} competenc${comps === 1 ? 'y' : 'ies'} · ${n} activit${n === 1 ? 'y' : 'ies'}</span>
          ${st === 'approved' ? `<span>Next</span><span>${next ? `${escapeHtml(fmtShort(next.it.targetTanggal))} · ${escapeHtml(next.it.jenis === 'training' ? (next.it.judul || 'Training') : (next.it.deskripsi || ''))}` : '-'}</span>
          <span>Overdue</span><span class="${f.late.length ? 'late-t' : ''}">${f.late.length ? `${f.late.length} activit${f.late.length === 1 ? 'y' : 'ies'}` : 'None'}</span>` : ''}
          ${st === 'revision' && f.appr.note ? `<span>HR/OD note</span><span>${escapeHtml(f.appr.note)}</span>` : ''}
        </div></a>`;
    }).join('') || '<div class="empty-state" style="grid-column:1/-1;"><p>No IDPs match.</p></div>';
  }

  let reminders = [];
  function renderReminders(rows){
    const d = F('remDate').value ? new Date(F('remDate').value + 'T08:00:00') : new Date();
    reminders = computeReminders({ plans: rows, updatesByPlan: idpUpdatesByPlan, attemptsFor, today: d });
    F('remList').innerHTML = reminders.map((r, i) => `<div class="rem">
      <div style="min-width:0;">
        <strong>${escapeHtml(r.nama)}</strong> <span class="text-meta">· ${escapeHtml(r.role)} · ${r.email ? escapeHtml(r.email) : '<span style="color:var(--red);">no email</span>'}</span>
        <ul>
          ${r.approvals.map(a => `<li>Fix the IDP of ${escapeHtml(a.plan.nama)} returned by HR/OD (${a.days} days ago)</li>`).join('')}
          ${r.items.map(({ plan, item, reason }) => `<li>${r.role === 'Employee' ? '' : escapeHtml(plan.nama) + ': '}${escapeHtml(item.jenis === 'training' ? (item.judul || 'Training') : (item.deskripsi || ''))} · <span class="${reason.kind === 'overdue' ? 'overdue' : ''}">${escapeHtml(reason.label)}</span></li>`).join('')}
        </ul>
      </div>
      <div class="rem-btns">
        ${r.email ? `<a class="btn btn-primary btn-sm" data-mail="${i}" href="#">Open in Outlook</a>` : ''}
        <button class="btn btn-outline btn-sm" data-copy="${i}">Copy</button>
      </div>
    </div>`).join('') || `<div class="empty-state">${iconSvg('check',{size:22})}<p style="margin-top:6px;">No reminders for ${escapeHtml(fmtDate(d))}.</p></div>`;
    F('remList').querySelectorAll('[data-mail]').forEach(a => a.addEventListener('click', e => {
      e.preventDefault(); const r = reminders[Number(a.dataset.mail)]; const m = reminderEmail(r, tmsUrl);
      location.href = `mailto:${encodeURIComponent(r.email)}?subject=${encodeURIComponent(m.subject)}&body=${encodeURIComponent(m.body)}`;
    }));
    F('remList').querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', () => {
      const r = reminders[Number(b.dataset.copy)]; const m = reminderEmail(r, tmsUrl);
      copy(`To: ${r.email}\nSubject: ${m.subject}\n\n${m.body}`);
    }));
  }
  function copy(text){ navigator.clipboard?.writeText(text).then(() => showToast('Copied.'), () => prompt('Copy this text:', text)); }
</script>
<script type="module" src="./tms-shell.js?v=20261113a"></script>
