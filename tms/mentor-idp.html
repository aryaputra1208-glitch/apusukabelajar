<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDP — Anteraja TMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  .avatar { width: 28px; height: 28px; border-radius: 50%; }
  .user-chip { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }

  .x-mock { background: #FEF3C7; color: #92400E; font-size: 12px; font-weight: 600; padding: 6px 14px; border-radius: 999px; display: inline-block; }
  .wrap.wide { max-width: 1180px; }
  .kpi-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin: 14px 0 18px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); padding: 16px 18px; }
  .kpi .n { font-size: 26px; font-weight: 700; color: var(--pink); line-height: 1; }
  .kpi .l { font-size: 12px; color: var(--text-2); margin-top: 6px; }
  .layout { display: grid; grid-template-columns: 300px minmax(0,1fr); gap: 16px; align-items: start; }
  .mentee { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .mentee:last-child { border-bottom: none; }
  .mentee.sel { background: var(--pink-bg); }
  .mentee .av { width: 36px; height: 36px; border-radius: 50%; background: var(--pink-bg); color: var(--pink-dark); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
  .mentee.sel .av { background: var(--pink); color: #fff; }
  .mini { height: 5px; border-radius: 99px; background: rgba(0,0,0,.07); overflow: hidden; margin-top: 6px; }
  .mini > span { display: block; height: 100%; background: var(--green); }
  /* ringkasan */
  .summary { display: grid; grid-template-columns: 170px 1fr; gap: 24px; align-items: center; padding: 20px; }
  .donut { position: relative; width: 150px; height: 150px; }
  .donut .c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .donut .c b { font-size: 30px; line-height: 1; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); margin-top: 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  /* chart per kompetensi */
  .comp { padding: 14px 20px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .comp:last-child { border-bottom: none; }
  .comp-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
  .comp-head strong { font-size: 14px; }
  .bar { display: flex; gap: 3px; height: 30px; }
  .seg { flex: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; position: relative; min-width: 0; transition: transform .12s; }
  .seg:hover { transform: translateY(-1px); }
  .seg span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 0 6px; }
  .s-selesai { background: var(--green); color: #fff; }
  .s-berjalan { background: repeating-linear-gradient(135deg, #a78bfa 0 8px, #8b5cf6 8px 16px); color: #fff; }
  .s-rencana { background: rgba(120,120,128,.14); color: var(--text-2); }
  .seg.late { box-shadow: inset 0 0 0 2px var(--red); }
  .acts { margin-top: 12px; display: none; }
  .comp.open .acts { display: block; }
  .act { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,.55); margin-top: 6px; }
  .act .meta { font-size: 12px; color: var(--text-3); margin-top: 2px; }
  .late-t { color: var(--red); font-weight: 600; }
  .cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; padding: 16px 20px 20px; }
  .ccard { background: rgba(255,255,255,.6); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
  .ccard-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
  .cname { font-weight: 700; font-size: 14.5px; }
  .crow { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; }
  .crow + .crow { border-top: 1px dashed var(--border); }
  .ctitle { font-size: 13px; font-weight: 600; line-height: 1.35; }
  .ctitle.done { color: var(--text-3); text-decoration: line-through; }
  .crow .meta { font-size: 12px; color: var(--text-3); margin-top: 2px; }
  .data-table td .badge, .data-table td.nw, .data-table td .btn { white-space: nowrap; }
  .ic { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; margin-top: 1px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
  .ic-done { background: var(--green); color: #fff; }
  .ic-prog { border: 2px solid #8b5cf6; background: linear-gradient(90deg, #8b5cf6 50%, transparent 50%); }
  .ic-plan { border: 2px solid rgba(120,120,128,.4); }
  .evbox { margin-top: 8px; padding: 10px 12px; border-radius: 10px; background: var(--green-bg); font-size: 12.5px; line-height: 1.5; display: grid; gap: 4px; }
  .dlg-back { position: fixed; inset: 0; background: rgba(20,20,30,.3); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .dlg { width: 100%; max-width: 540px; background: rgba(255,255,255,.95); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,.2); padding: 22px; }
  .dlg h3 { margin: 0 0 2px; font-size: 17px; }
  .dlg label { display: block; font-size: 12.5px; font-weight: 600; margin: 14px 0 5px; }
  .dlg textarea, .dlg input { width: 100%; margin: 0; box-sizing: border-box; }
  .dlg-act { margin-top: 10px; padding: 10px 12px; background: var(--purple-bg); color: #4c1d95; border-radius: 10px; font-size: 13px; font-weight: 600; }
  .dlg .req { color: var(--red); }
  .dlg .err { color: var(--red); font-size: 12.5px; min-height: 16px; margin-top: 10px; }
  .dlg-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  .cgrid { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)) !important; }
  .tlayout { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .hav-grid { display: grid; grid-template-columns: 22px repeat(3, 1fr); grid-template-rows: repeat(3, minmax(92px, auto)) 22px; gap: 8px; }
  .hav-ylab { grid-row: 1 / 4; grid-column: 1; writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; font-size: 11.5px; font-weight: 600; color: var(--text-2); }
  .hav-xlab { grid-column: 2 / 5; grid-row: 4; text-align: center; font-size: 11.5px; font-weight: 600; color: var(--text-2); align-self: end; }
  .hav-cell { border-radius: 12px; padding: 10px; cursor: pointer; border: 1.5px solid transparent; display: flex; flex-direction: column; justify-content: space-between; text-align: left; font: inherit; }
  .hav-cell.sel { border-color: var(--text); }
  .hav-cell .nm { font-size: 12px; font-weight: 700; }
  .hav-cell .who { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  .hav-cell .who span { width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,.75); font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  .hav-cell .ct { font-size: 20px; font-weight: 700; line-height: 1; }
  .z-g { background: rgba(34,160,90,.28) !important; color: #0f5a31; }
  .z-y { background: rgba(240,170,20,.30) !important; color: #6b4800; }
  .z-r { background: rgba(225,60,60,.22) !important; color: #861a1a; }
  .tm { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 11px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .tm:last-child { border-bottom: none; }
  .tm.sel { background: var(--pink-bg); }
  .tm .av { width: 34px; height: 34px; border-radius: 50%; background: var(--pink-bg); color: var(--pink-dark); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; }
  .tm .sc { text-align: right; font-size: 12px; color: var(--text-2); line-height: 1.5; }
  .hbadge { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
  .dgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .cbar { display: grid; grid-template-columns: 190px 1fr 40px; gap: 10px; align-items: center; padding: 7px 20px; font-size: 13px; }
  .cbar .track { position: relative; height: 10px; border-radius: 99px; background: rgba(120,120,128,.14); }
  .cbar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; }
  .cbar .std { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text); opacity: .55; }
  .hist { display: flex; gap: 10px; padding: 14px 20px 18px; }
  .hist div { flex: 1; text-align: center; padding: 10px 6px; border-radius: 10px; background: rgba(255,255,255,.6); }
  .hist b { display: block; font-size: 18px; }
  @media (max-width: 1100px) { .tlayout, .dgrid { grid-template-columns: 1fr; } }
  .hav-cell .who span { cursor: pointer; }
  .hav-cell .who span.me { background: var(--pink) !important; color: #fff; box-shadow: 0 0 0 2px #fff; }
  .mtiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 16px 20px 12px; }
  .mtile { border-radius: 12px; padding: 14px 16px; background: rgba(255,255,255,.6); border: 1px solid var(--border); }
  .mtile .mt-l { font-size: 11.5px; font-weight: 600; opacity: .75; }
  .mtile .mt-v { font-size: 22px; font-weight: 700; margin-top: 4px; line-height: 1.15; }
  .mtile .mt-g { font-size: 12px; font-weight: 700; background: rgba(0,0,0,.06); border-radius: 999px; padding: 2px 8px; vertical-align: middle; }
  .mtile .mt-s { font-size: 12px; margin-top: 6px; opacity: .85; }
  .cbars { display: grid; grid-template-columns: 1fr 1fr; column-gap: 8px; padding-bottom: 14px; }
  @media (max-width: 1100px) { .mtiles, .cbars { grid-template-columns: 1fr; } }
  .flist { margin-top: 12px; border-top: 1px solid var(--border); }
  .frow { display: grid; grid-template-columns: 112px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .ftag { font-size: 11px; font-weight: 700; color: var(--text-2); background: rgba(120,120,128,.12); border-radius: 999px; padding: 3px 10px; justify-self: start; white-space: nowrap; }
  .ftag.bad { color: var(--red); background: var(--red-bg); }
  .fmain { min-width: 0; }
  .frow .fv { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .frow .fm { font-size: 11.5px; color: var(--text-3); margin-top: 2px; }
  .fdate { font-size: 12px; font-weight: 600; color: var(--text-2); white-space: nowrap; }
  .fdate.bad { color: var(--red); }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .fact { background: rgba(255,255,255,.6); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; min-width: 0; }
  .fact .fl { font-size: 11px; font-weight: 700; color: var(--text-3); letter-spacing: .02em; }
  .fact .fv { font-size: 13px; font-weight: 600; margin-top: 4px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .fact .fm { font-size: 11.5px; color: var(--text-3); margin-top: 4px; }
  .fact.bad { border-color: rgba(220,38,38,.35); background: rgba(254,226,226,.55); }
  .fact.bad .fl { color: var(--red); }
  @media (max-width: 1100px) { .facts { grid-template-columns: 1fr; } }
  .approve { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; border-left: 3px solid var(--amber); border-radius: 0; }
  @media (max-width: 1000px) { .layout { grid-template-columns: 1fr; } .kpi-row { grid-template-columns: repeat(2,1fr); } }

</style>

<script type="module">
  import { db, onAuth, ensureUserProfile } from '../firebase-shared.js';
  import { escapeHtml, periodeRank, periodeLabel, IDP_JENIS, planApproval, itemProgress, planIdOf, daysUntil } from '../competency-shared.js?v=20261111d';
  import { postUpdate } from './idp-ui.js?v=20261111e';
  import { collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

  const F = id => document.getElementById(id);
  const ST = { rencana: 'Planned', berjalan: 'In Progress', selesai: 'Done' };
  const BADGE = { rencana: 'badge-gray', berjalan: 'badge-purple', selesai: 'badge-green' };
  const ICON = { selesai: '<span class="ic ic-done">✓</span>', berjalan: '<span class="ic ic-prog"></span>', rencana: '<span class="ic ic-plan"></span>' };
  let me = '', profile = null, plans = [], team = [], updates = [], attemptsBy = {}, periode = '', selId = '';
  const showToast = msg => { const t = F('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000); };
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  const fmt = (d, o = { day: 'numeric', month: 'short' }) => { const x = new Date(d); return isNaN(x) ? '' : x.toLocaleDateString('en-GB', o); };
  const initials = n => String(n || '?').split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  const upsOf = p => updates.filter(u => u.planId === p._id);

  // aktivitas aktif (tanpa yang dibatalkan) + status efektif
  function acts(p){
    return (p.items || []).filter(it => it.status !== 'batal').map(it => {
      const pr = itemProgress(it, attemptsBy[p._id] || [], upsOf(p));
      const doneUp = pr.status === 'selesai' && !pr.auto ? pr.updates.find(u => u.status === 'selesai') : null;
      return { it, s: pr.status, auto: pr.auto, score: pr.score, done: doneUp, title: it.jenis === 'training' ? (it.judul || 'Training') : (it.deskripsi || ''),
        late: it.targetTanggal && daysUntil(it.targetTanggal) < 0 && pr.status !== 'selesai' };
    });
  }
  const comps = p => { const m = new Map(); acts(p).forEach(x => { const k = x.it.kompetensiNama || x.it.kompetensiId; if(!m.has(k)) m.set(k, []); m.get(k).push(x); }); return [...m.entries()].map(([nama, list]) => ({ nama, list })); };

  async function grab(q, label){ try{ const o = []; (await getDocs(q)).forEach(d => o.push({ _id: d.id, ...d.data() })); return o; } catch(err){ console.error('Gagal baca', label, err.code, err.message); return []; } }

  async function load(){
    [plans, updates, team] = await Promise.all([
      grab(query(collection(db, 'developmentPlans'), where('mentorEmail', '==', me)), 'developmentPlans'),
      grab(query(collection(db, 'idpUpdates'), where('mentorEmail', '==', me)), 'idpUpdates'),
      grab(query(collection(db, 'assessments'), where('viewerEmails', 'array-contains', me)), 'assessments'),
    ]);
    await Promise.all(plans.map(async p => {
      const qs = [grab(query(collection(db, 'attempts'), where('nik', '==', p.nik)), 'attempts')];
      if(p.email) qs.push(grab(query(collection(db, 'attempts'), where('email', '==', p.email)), 'attempts'));
      attemptsBy[p._id] = (await Promise.all(qs)).flat();
    }));
    const periodes = [...new Set([...plans, ...team].map(p => p.periode))].sort((a, b) => periodeRank(b) - periodeRank(a));
    periode = periode && periodes.includes(periode) ? periode : periodes[0] || '';
    F('periodeSel').innerHTML = periodes.map(p => `<option value="${escapeHtml(p)}" ${p === periode ? 'selected' : ''}>${escapeHtml(periodeLabel(p))}</option>`).join('');
  }

  function ring(v, size = 54){
    const R = size / 2 - 5, C = 2 * Math.PI * R;
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="rgba(120,120,128,.15)" stroke-width="6"/>
      <circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="#16A34A" stroke-width="6" stroke-linecap="round" stroke-dasharray="${v / 100 * C} ${C}" transform="rotate(-90 ${size/2} ${size/2})"/>
      <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="currentColor">${v}%</text></svg>`;
  }
  function donut(done, prog, total){
    const R = 62, C = 2 * Math.PI * R, d = total ? done / total : 0, p = total ? prog / total : 0;
    return `<div class="donut"><svg viewBox="0 0 150 150" width="150" height="150">
      <circle cx="75" cy="75" r="${R}" fill="none" stroke="rgba(120,120,128,.14)" stroke-width="16"/>
      <circle cx="75" cy="75" r="${R}" fill="none" stroke="#8b5cf6" stroke-width="16" stroke-dasharray="${(d + p) * C} ${C}" transform="rotate(-90 75 75)"/>
      <circle cx="75" cy="75" r="${R}" fill="none" stroke="#16A34A" stroke-width="16" stroke-dasharray="${d * C} ${C}" transform="rotate(-90 75 75)"/>
    </svg><div class="c"><b>${pct(done, total)}%</b><span class="text-meta">done</span></div></div>`;
  }
  function facts(p){
    const rows = comps(p).flatMap(c => c.list.map(x => ({ ...x, comp: c.nama })));
    const next = rows.filter(x => x.s !== 'selesai' && x.it.targetTanggal && daysUntil(x.it.targetTanggal) >= 0).sort((a, b) => a.it.targetTanggal.localeCompare(b.it.targetTanggal))[0];
    const over = rows.filter(x => x.late).sort((a, b) => a.it.targetTanggal.localeCompare(b.it.targetTanggal));
    const row = (tag, cls, x, when) => `<div class="frow"><span class="ftag ${cls}">${tag}</span><div class="fmain"><div class="fv">${escapeHtml(x.title)}</div><div class="fm">${escapeHtml(x.comp)}</div></div><span class="fdate ${cls}">${when}</span></div>`;
    return `<div class="flist">
      ${next ? row('Next target', '', next, fmt(next.it.targetTanggal)) : '<div class="frow"><span class="ftag">Next target</span><div class="fmain"><div class="fm">No upcoming target</div></div></div>'}
      ${over.map(x => row('Overdue', 'bad', x, `${fmt(x.it.targetTanggal)} · ${-daysUntil(x.it.targetTanggal)}d late`)).join('')}
    </div>`;
  }

  // satu baris per anggota tim di periode ini: dari hasil PA (garis atasan) + IDP yang mentornya saya
  function rowsFor(per){
    const byId = new Map();
    team.filter(a => a.periode === per).forEach(a => byId.set(a._id, { _id: a._id, nik: a.nik, nama: a.nama, jabatan: a.jabatan, periode: a.periode, plan: null }));
    plans.filter(p => p.periode === per).forEach(p => byId.set(p._id, { ...(byId.get(p._id) || { _id: p._id, nik: p.nik, nama: p.nama, jabatan: p.jabatan, periode: p.periode }), plan: p }));
    // IDP milik mentor lain tidak ditampilkan
    return [...byId.values()];
  }
  const stOf = r => r.plan ? planApproval(r.plan).status : 'none';
  const ACTION = { none: 'No IDP yet', draft: 'Draft', revision: 'Returned by HR/OD', pending: 'Waiting HR/OD', approved: '' };
  function render(){
    const order = { revision: 0, none: 1, draft: 2, pending: 3, approved: 4 };
    const rows = rowsFor(periode).sort((a, b) => (order[stOf(a)] - order[stOf(b)]) || (a.nama || '').localeCompare(b.nama || ''));
    if(!rows.find(r => r._id === selId)) selId = rows[0]?._id || '';
    const all = rows.filter(r => stOf(r) === 'approved').flatMap(r => acts(r.plan));
    F('kMentee').textContent = rows.length;
    F('kAppr').textContent = rows.filter(r => ['none', 'draft', 'revision'].includes(stOf(r))).length;
    F('kDone').textContent = all.length ? `${all.filter(x => x.s === 'selesai').length}/${all.length}` : '-';
    F('kLate').textContent = all.filter(x => x.late).length;
    F('listCount').textContent = periodeLabel(periode);
    F('list').innerHTML = rows.map(r => {
      const st = stOf(r);
      let tag;
      if(st === 'approved'){ const a = acts(r.plan), d = a.filter(x => x.s === 'selesai').length; tag = `<span class="text-meta">${pct(d, a.length)}%</span>`; r._pct = pct(d, a.length); }
      else tag = `<span class="badge ${st === 'revision' ? 'badge-red' : st === 'none' ? 'badge-amber' : st === 'pending' ? 'badge-purple' : 'badge-gray'}">${ACTION[st]}</span>`;
      return `<div class="mentee ${r._id === selId ? 'sel' : ''}" data-id="${escapeHtml(r._id)}"><div class="av">${escapeHtml(initials(r.nama))}</div>
        <div style="flex:1; min-width:0;"><div style="display:flex; justify-content:space-between; gap:8px;"><strong style="font-size:13.5px;">${escapeHtml(r.nama || r.nik)}</strong>${tag}</div>
        <div class="text-meta">${escapeHtml(r.jabatan || '')}</div>${st === 'approved' ? `<div class="mini"><span style="width:${r._pct}%"></span></div>` : ''}</div></div>`;
    }).join('') || '<div class="empty-state"><p>No team members for this period.</p></div>';
    document.querySelectorAll('.mentee[data-id]').forEach(el => el.onclick = () => { selId = el.dataset.id; render(); });
    renderDetail(rows.find(r => r._id === selId));
  }

  function renderDetail(row){
    if(!row){ F('detail').innerHTML = ''; F('progress').innerHTML = ''; return; }
    const p = row.plan, st = stOf(row);
    const editUrl = `idp.html?nik=${encodeURIComponent(row.nik)}&periode=${encodeURIComponent(row.periode)}`;
    if(st !== 'approved'){
      const msg = {
        none: ['No IDP yet', 'Prepare the IDP from the competency gaps, then send it to HR/OD for validation.', 'Create IDP'],
        draft: ['Draft', 'You have a draft. Finish it and send it to HR/OD.', 'Continue Editing'],
        revision: ['Returned by HR/OD', 'HR/OD asked for changes. Fix the IDP and send it again.', 'Fix IDP'],
        pending: ['Waiting HR/OD validation', 'HR/OD is reviewing this IDP. They may edit it before approving. The employee sees it after approval.', 'View IDP'],
      }[st];
      F('detail').innerHTML = `<div class="panel" style="margin:0;">
        <div class="panel-head"><div><h3 class="text-h2" style="margin:0;">${escapeHtml(row.nama || row.nik)}</h3><div class="text-meta">${escapeHtml(row.jabatan || '')} · IDP ${escapeHtml(periodeLabel(row.periode))}</div></div>
          <span class="badge ${st === 'revision' ? 'badge-red' : st === 'none' ? 'badge-amber' : st === 'pending' ? 'badge-purple' : 'badge-gray'}">${msg[0]}</span></div>
        <div style="padding:22px 20px; display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;">
          <div><div class="text-sub" style="margin:0;">${msg[1]}</div>
            ${st === 'revision' && p.approval?.note ? `<div style="margin-top:10px; padding:10px 12px; border-left:3px solid var(--red); background:var(--red-bg); font-size:13px;"><b>HR/OD note:</b> ${escapeHtml(p.approval.note)}</div>` : ''}
            ${p ? `<div class="text-meta" style="margin-top:8px;">${(p.items || []).length} activities planned</div>` : ''}</div>
          <a class="btn ${st === 'pending' ? 'btn-outline' : 'btn-primary'}" href="${editUrl}">${msg[2]}</a>
        </div></div>`;
      F('progress').innerHTML = '';
      return;
    }
    const pending = false, approved = true;
    const a = acts(p), done = a.filter(x => x.s === 'selesai').length, prog = a.filter(x => x.s === 'berjalan').length;
    F('detail').innerHTML = `
      <div class="panel" style="margin:0;">
        <div class="panel-head"><div><h3 class="text-h2" style="margin:0;">${escapeHtml(p.nama || p.nik)}</h3><div class="text-meta">${escapeHtml(p.jabatan || '')} · IDP ${escapeHtml(periodeLabel(p.periode))}</div></div>
          <span class="badge badge-green">Approved by HR/OD</span></div>
        <div class="summary">
          ${donut(done, prog, a.length)}
          <div>
            <div class="legend" style="margin-top:0;"><span><i style="background:#16A34A"></i>Done ${done}</span><span><i style="background:#8b5cf6"></i>In progress ${prog}</span><span><i style="background:rgba(120,120,128,.25)"></i>Planned ${a.length - done - prog}</span><span><i style="background:transparent; box-shadow: inset 0 0 0 2px var(--red);"></i>Overdue ${a.filter(x => x.late).length}</span></div>
            ${facts(p)}
          </div>
        </div>
      </div>`;
    const canUpdate = approved;
    F('progress').innerHTML = `<div class="panel" style="margin:0;">
      <div class="panel-head"><h3 class="text-h2" style="margin:0;">Progress by Competency</h3><span class="text-meta">${escapeHtml(p.nama || '')} · ${comps(p).length} competencies</span></div>
      <div class="cgrid">${comps(p).map(c => {
        const d = c.list.filter(x => x.s === 'selesai').length, w = Math.round(100 / c.list.length);
        return `<div class="ccard">
          <div class="ccard-head"><div><div class="cname">${escapeHtml(c.nama)}</div><div class="text-meta">${d} of ${c.list.length} done</div></div>${ring(pct(d, c.list.length))}</div>
          ${c.list.map(x => `<div class="crow">${ICON[x.s] || ICON.rencana}
            <div style="flex:1; min-width:0;"><div class="ctitle ${x.s === 'selesai' ? 'done' : ''}">${escapeHtml(x.title)}</div>
              <div class="meta">${escapeHtml(IDP_JENIS[x.it.jenis] || x.it.jenis)} · ${w}%${x.it.targetTanggal ? ` · <span class="${x.late ? 'late-t' : ''}">${fmt(x.it.targetTanggal)}${x.late ? ' · overdue' : ''}</span>` : ''}${x.auto ? ` · auto from LMS${x.score != null ? ' (' + x.score + ')' : ''}` : ''}${x.done ? ` · <a href="javascript:void 0" data-ev="${escapeHtml(x.it.id)}" style="color:var(--pink); font-weight:600;">Evidence</a>` : ''}</div>
              ${x.done ? `<div class="evbox" data-evbox="${escapeHtml(x.it.id)}" style="display:none;">
                <div><b>Done</b> ${fmt(x.done.doneDate || x.done.at, { day: 'numeric', month: 'short', year: 'numeric' })} · by ${escapeHtml(x.done.byNama || '')}</div>
                ${x.done.what ? `<div><b>Activity done:</b> ${escapeHtml(x.done.what)}</div>` : x.done.note ? `<div>${escapeHtml(x.done.note)}</div>` : ''}
                ${x.done.evidence ? `<div><b>Competency evidence:</b> ${escapeHtml(x.done.evidence)}</div>` : ''}
                ${x.done.evidenceUrl ? `<div><a href="${escapeHtml(x.done.evidenceUrl)}" target="_blank" rel="noopener">Open evidence file</a></div>` : ''}
              </div>` : ''}</div>
            ${canUpdate && !x.auto ? `<button class="btn btn-outline btn-sm" data-up="${escapeHtml(x.it.id)}">${x.s === 'selesai' ? 'Reopen' : x.s === 'berjalan' ? 'Mark Done' : 'Start'}</button>` : ''}
          </div>`).join('')}
        </div>`;
      }).join('') || '<div class="empty-state"><p>No activities.</p></div>'}</div></div>`;

    document.querySelectorAll('[data-ev]').forEach(b => b.onclick = () => { const box = document.querySelector(`[data-evbox="${CSS.escape(b.dataset.ev)}"]`); box.style.display = box.style.display === 'none' ? 'grid' : 'none'; });
    document.querySelectorAll('[data-up]').forEach(b => b.onclick = async () => {
      const x = a.find(y => y.it.id === b.dataset.up);
      if(x.s === 'rencana') return save(p, x, { status: 'berjalan', note: 'Started' }, 'Activity started');
      if(x.s === 'berjalan') return doneDialog(p, x);
      if(!confirm('Reopen this activity? The completion record stays in its history.')) return;
      save(p, x, { status: 'berjalan', note: 'Reopened' }, 'Activity reopened');
    });
  }

  async function save(p, x, fields, msg){
    try{
      const u = await postUpdate({ src: { planId: p._id, nik: p.nik, periode: p.periode, menteeEmail: p.email || '', mentorEmail: p.mentorEmail || '', viewerEmails: p.viewerEmails || [] },
        item: x.it, ...fields, byRole: 'Mentor', profile });
      updates.push(u); showToast(msg); render();
    } catch(err){ console.error('Gagal simpan update:', err.code, err.message); showToast('Update failed: ' + err.message); }
  }

  function doneDialog(p, x){
    const back = document.createElement('div'); back.className = 'dlg-back';
    const today = new Date(); const iso = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
    const first = escapeHtml(String(p.nama || '').split(' ')[0] || 'the mentee');
    back.innerHTML = `<div class="dlg" role="dialog" aria-modal="true">
      <h3>Mark Activity as Done</h3>
      <div class="text-meta">${escapeHtml(p.nama)} · ${escapeHtml(x.it.kompetensiNama || '')}</div>
      <div class="dlg-act">${escapeHtml(x.title)}</div>
      <label>What did ${first} do? <span class="req">*</span></label>
      <textarea id="dWhat" rows="3" placeholder="e.g. Led 4 weekly planning meetings and presented the root-cause analysis to the DH on 18 Nov."></textarea>
      <label>Evidence that the competency is met <span class="req">*</span></label>
      <textarea id="dEv" rows="3" placeholder="Observable behavior: what is different now? e.g. Uses delay data before deciding courier allocation."></textarea>
      <div style="display:grid; grid-template-columns: 1fr 160px; gap:10px;">
        <div><label>Evidence link (optional)</label><input id="dLink" type="url" placeholder="https://… (OneDrive / Drive)"></div>
        <div><label>Completion date</label><input id="dDate" type="date" value="${iso}"></div>
      </div>
      <div class="err" id="dErr"></div>
      <div class="dlg-btns"><button class="btn btn-outline" id="dCancel">Cancel</button><button class="btn btn-primary" id="dOk">Mark as Done</button></div>
    </div>`;
    document.body.appendChild(back);
    const close = () => back.remove();
    back.addEventListener('click', e => { if(e.target === back) close(); });
    back.querySelector('#dCancel').onclick = close;
    back.querySelectorAll('textarea, input').forEach(i => i.addEventListener('input', () => back.querySelector('#dErr').textContent = ''));
    back.querySelector('#dOk').onclick = async () => {
      const what = back.querySelector('#dWhat').value.trim(), evidence = back.querySelector('#dEv').value.trim(), link = back.querySelector('#dLink').value.trim();
      const err = back.querySelector('#dErr');
      if(!what || !evidence){ err.textContent = 'Fill in what was done and the competency evidence.'; return; }
      if(link && !/^https?:\/\//i.test(link)){ err.textContent = 'Evidence link must start with https://'; return; }
      back.querySelector('#dOk').disabled = true;
      close();
      await save(p, x, { status: 'selesai', what, evidence, evidenceUrl: link, doneDate: back.querySelector('#dDate').value || iso }, 'Activity marked as done');
    };
    setTimeout(() => back.querySelector('#dWhat').focus(), 30);
  }

  F('periodeSel').addEventListener('change', e => { periode = e.target.value; selId = ''; render(); });

  onAuth(async (user) => {
    if(!user){ F('gateTitle').textContent = 'Please sign in'; F('gateSub').innerHTML = `<a href="../index.html">Sign in to the LMS first</a>.`; return; }
    profile = await ensureUserProfile(user);
    me = (user.email || '').toLowerCase();
    await load();
    if(!plans.length && !team.length){
      F('gateTitle').textContent = 'No team data yet';
      F('gateSub').innerHTML = `Your team appears here once HR/OD imports their performance results. <a href="../index.html">Back to LMS</a>.`;
      return;
    }
    selId = new URLSearchParams(location.search).get('plan') || '';
    const pre = [...plans, ...team].find(p => p._id === selId); if(pre) periode = pre.periode;
    F('userAvatar').src = profile.photoURL || ''; F('userName').textContent = profile.displayName;
    F('gate').style.display = 'none'; F('appShell').style.display = 'block';
    render();
  });
</script>
<script type="module" src="./tms-shell.js?v=20261111g"></script>
