<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup: Mentor View — Anteraja TMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../lms-design-system.css?v=20261105b">
<link rel="stylesheet" href="../lms-glass.css?v=20261111b">
<style>
  body { padding-left: 232px; }
  .admin-sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 232px; padding: 18px 12px; overflow-y: auto; z-index: 40; box-sizing: border-box; }
  .admin-sidebar .as-logo { font-weight: 700; font-size: 18px; color: var(--pink); padding: 0 10px 6px; display: block; text-decoration: none; }
  .admin-sidebar .as-role { font-size: 11px; color: var(--text-3); padding: 0 10px 8px; }
  .admin-sidebar .as-group { font-size: 11px; font-weight: 600; color: var(--text-3); margin: 16px 10px 6px; }
  .admin-sidebar a.as-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--text-2); font-size: 13px; font-weight: 500; text-decoration: none; margin-bottom: 2px; }
  .admin-sidebar a.as-item.active { background: var(--pink); color: #fff; }
  .admin-sidebar .as-badge { margin-left: auto; background: var(--red-bg); color: var(--red); font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 7px; }
  .admin-sidebar a.as-item.active .as-badge { background: rgba(255,255,255,.25); color: #fff; }
  .topbar > :last-child { margin-left: auto; }
  .mock-banner { background: #FEF3C7; color: #92400E; font-size: 12px; font-weight: 600; padding: 6px 14px; border-radius: 999px; display: inline-block; }
  .wrap.wide { max-width: 1180px; }
  .kpi-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin: 14px 0 18px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); padding: 16px 18px; }
  .kpi .n { font-size: 26px; font-weight: 700; color: var(--pink); line-height: 1; }
  .kpi .l { font-size: 12px; color: var(--text-2); margin-top: 6px; }
  .layout { display: grid; grid-template-columns: 300px minmax(0,1fr); gap: 16px; align-items: start; }
  .mentee { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .mentee:last-child { border-bottom: none; }
  .mentee.sel { background: var(--pink-bg); }
  .mentee .av { width: 36px; height: 36px; border-radius: 50%; background: var(--pink-bg); color: var(--pink-dark); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
  .mentee.sel .av { background: var(--pink); color: #fff; }
  .mini { height: 5px; border-radius: 99px; background: rgba(0,0,0,.07); overflow: hidden; margin-top: 6px; }
  .mini > span { display: block; height: 100%; background: var(--green); }
  /* ringkasan */
  .summary { display: grid; grid-template-columns: 170px 1fr; gap: 24px; align-items: center; padding: 20px; }
  .donut { position: relative; width: 150px; height: 150px; }
  .donut .c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .donut .c b { font-size: 30px; line-height: 1; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); margin-top: 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  /* chart per kompetensi */
  .comp { padding: 14px 20px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .comp:last-child { border-bottom: none; }
  .comp-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
  .comp-head strong { font-size: 14px; }
  .bar { display: flex; gap: 3px; height: 30px; }
  .seg { flex: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; position: relative; min-width: 0; transition: transform .12s; }
  .seg:hover { transform: translateY(-1px); }
  .seg span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 0 6px; }
  .s-selesai { background: var(--green); color: #fff; }
  .s-berjalan { background: repeating-linear-gradient(135deg, #a78bfa 0 8px, #8b5cf6 8px 16px); color: #fff; }
  .s-rencana { background: rgba(120,120,128,.14); color: var(--text-2); }
  .seg.late { box-shadow: inset 0 0 0 2px var(--red); }
  .acts { margin-top: 12px; display: none; }
  .comp.open .acts { display: block; }
  .act { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,.55); margin-top: 6px; }
  .act .meta { font-size: 12px; color: var(--text-3); margin-top: 2px; }
  .late-t { color: var(--red); font-weight: 600; }
  .cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; padding: 16px 20px 20px; }
  .ccard { background: rgba(255,255,255,.6); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
  .ccard-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
  .cname { font-weight: 700; font-size: 14.5px; }
  .crow { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; }
  .crow + .crow { border-top: 1px dashed var(--border); }
  .ctitle { font-size: 13px; font-weight: 600; line-height: 1.35; }
  .ctitle.done { color: var(--text-3); text-decoration: line-through; }
  .crow .meta { font-size: 12px; color: var(--text-3); margin-top: 2px; }
  .data-table td .badge, .data-table td.nw, .data-table td .btn { white-space: nowrap; }
  .ic { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; margin-top: 1px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
  .ic-done { background: var(--green); color: #fff; }
  .ic-prog { border: 2px solid #8b5cf6; background: linear-gradient(90deg, #8b5cf6 50%, transparent 50%); }
  .ic-plan { border: 2px solid rgba(120,120,128,.4); }
  .evbox { margin-top: 8px; padding: 10px 12px; border-radius: 10px; background: var(--green-bg); font-size: 12.5px; line-height: 1.5; display: grid; gap: 4px; }
  .dlg-back { position: fixed; inset: 0; background: rgba(20,20,30,.3); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .dlg { width: 100%; max-width: 540px; background: rgba(255,255,255,.95); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,.2); padding: 22px; }
  .dlg h3 { margin: 0 0 2px; font-size: 17px; }
  .dlg label { display: block; font-size: 12.5px; font-weight: 600; margin: 14px 0 5px; }
  .dlg textarea, .dlg input { width: 100%; margin: 0; box-sizing: border-box; }
  .dlg-act { margin-top: 10px; padding: 10px 12px; background: var(--purple-bg); color: #4c1d95; border-radius: 10px; font-size: 13px; font-weight: 600; }
  .dlg .req { color: var(--red); }
  .dlg .err { color: var(--red); font-size: 12.5px; min-height: 16px; margin-top: 10px; }
  .dlg-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  .cgrid { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)) !important; }
  .tlayout { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .hav-grid { display: grid; grid-template-columns: 22px repeat(3, 1fr); grid-template-rows: repeat(3, minmax(92px, auto)) 22px; gap: 8px; }
  .hav-ylab { grid-row: 1 / 4; grid-column: 1; writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; font-size: 11.5px; font-weight: 600; color: var(--text-2); }
  .hav-xlab { grid-column: 2 / 5; grid-row: 4; text-align: center; font-size: 11.5px; font-weight: 600; color: var(--text-2); align-self: end; }
  .hav-cell { border-radius: 12px; padding: 10px; cursor: pointer; border: 1.5px solid transparent; display: flex; flex-direction: column; justify-content: space-between; text-align: left; font: inherit; }
  .hav-cell.sel { border-color: var(--text); }
  .hav-cell .nm { font-size: 12px; font-weight: 700; }
  .hav-cell .who { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  .hav-cell .who span { width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,.75); font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  .hav-cell .ct { font-size: 20px; font-weight: 700; line-height: 1; }
  .z-g { background: rgba(34,160,90,.28) !important; color: #0f5a31; }
  .z-y { background: rgba(240,170,20,.30) !important; color: #6b4800; }
  .z-r { background: rgba(225,60,60,.22) !important; color: #861a1a; }
  .tm { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 11px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .tm:last-child { border-bottom: none; }
  .tm.sel { background: var(--pink-bg); }
  .tm .av { width: 34px; height: 34px; border-radius: 50%; background: var(--pink-bg); color: var(--pink-dark); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; }
  .tm .sc { text-align: right; font-size: 12px; color: var(--text-2); line-height: 1.5; }
  .hbadge { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
  .dgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .cbar { display: grid; grid-template-columns: 190px 1fr 40px; gap: 10px; align-items: center; padding: 7px 20px; font-size: 13px; }
  .cbar .track { position: relative; height: 10px; border-radius: 99px; background: rgba(120,120,128,.14); }
  .cbar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; }
  .cbar .std { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text); opacity: .55; }
  .hist { display: flex; gap: 10px; padding: 14px 20px 18px; }
  .hist div { flex: 1; text-align: center; padding: 10px 6px; border-radius: 10px; background: rgba(255,255,255,.6); }
  .hist b { display: block; font-size: 18px; }
  @media (max-width: 1100px) { .tlayout, .dgrid { grid-template-columns: 1fr; } }
  .hav-cell .who span { cursor: pointer; }
  .hav-cell .who span.me { background: var(--pink) !important; color: #fff; box-shadow: 0 0 0 2px #fff; }
  .mtiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 16px 20px 12px; }
  .mtile { border-radius: 12px; padding: 14px 16px; background: rgba(255,255,255,.6); border: 1px solid var(--border); }
  .mtile .mt-l { font-size: 11.5px; font-weight: 600; opacity: .75; }
  .mtile .mt-v { font-size: 22px; font-weight: 700; margin-top: 4px; line-height: 1.15; }
  .mtile .mt-g { font-size: 12px; font-weight: 700; background: rgba(0,0,0,.06); border-radius: 999px; padding: 2px 8px; vertical-align: middle; }
  .mtile .mt-s { font-size: 12px; margin-top: 6px; opacity: .85; }
  .cbars { display: grid; grid-template-columns: 1fr 1fr; column-gap: 8px; padding-bottom: 14px; }
  @media (max-width: 1100px) { .mtiles, .cbars { grid-template-columns: 1fr; } }
  .approve { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; border-left: 3px solid var(--amber); border-radius: 0; }
  @media (max-width: 1000px) { .layout { grid-template-columns: 1fr; } .kpi-row { grid-template-columns: repeat(2,1fr); } }
  @media (max-width: 900px) { body { padding-left: 0; } .admin-sidebar { display: none; } }
</style>
</head>
<body>
<nav class="admin-sidebar" aria-label="TMS menu">
  <a class="as-logo" href="#">anteraja TMS</a><div class="as-role">Department Head · Mentor</div>
  <div class="as-group">Development</div>
  <a class="as-item active" href="#idp" data-nav="idp">IDP <span class="as-badge">1</span></a>
  <div class="as-group">Other Apps</div>
  <a class="as-item" href="../index.html">LMS</a>
</nav>
<div class="topbar">
  <span class="mock-banner">Mockup · sample data, nothing is saved</span>
  <div class="user-chip" style="display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-2);">Budi Santoso · Department Head</div>
</div>

<div class="wrap wide" id="vIdp">
  <h1 class="text-h1" style="margin-bottom:0;">IDP</h1>
  <div class="kpi-row">
    <div class="kpi"><div class="n" id="kMentee">-</div><div class="l">Mentees</div></div>
    <div class="kpi"><div class="n" id="kAppr">-</div><div class="l">IDPs to Approve</div></div>
    <div class="kpi"><div class="n" id="kDone">-</div><div class="l">Activities Done</div></div>
    <div class="kpi"><div class="n" id="kLate">-</div><div class="l">Overdue Activities</div></div>
  </div>
  <div class="layout">
    <div class="panel" style="margin:0;"><div class="panel-head"><h3 class="text-h2" style="margin:0;">IDP List</h3><span class="text-meta">Semester 1 2026</span></div><div id="list"></div></div>
    <div id="detail"></div>
  </div>
  <div id="progress" style="margin-top:16px;"></div>
</div>
<div class="toast" id="toast"></div>

<script>
  const TODAY = new Date('2026-11-11');
  const ST = { rencana: 'Planned', berjalan: 'In Progress', selesai: 'Done' };
  const BADGE = { rencana: 'badge-gray', berjalan: 'badge-purple', selesai: 'badge-green' };
  const mentees = [
    { nama: 'Sari Lestari', jabatan: 'Supervisor Hub Cakung', approval: 'approved', catatan: 'Fokus semester ini: perencanaan mingguan tim hub dan keberanian mengambil keputusan di lapangan.',
      comps: [
        { nama: 'Analysis & Decision Making', gap: 1.5, acts: [
          { j: 'Training: Problem Solving with Data', t: 'Training', target: '2026-10-30', s: 'selesai', done: { date: '2026-10-28', what: 'Ikut training 1 hari, lulus post-test (skor 85).', evidence: 'Mulai memakai data keterlambatan harian sebelum memutuskan alokasi kurir; 2 keputusan minggu ini disertai data pendukung.', link: '' } },
          { j: 'Analisis root cause keterlambatan sortir & presentasi ke DH', t: 'Assignment', target: '2026-11-20', s: 'berjalan' } ] },
        { nama: 'Planning & Controlling', gap: 1.0, acts: [
          { j: 'Menyusun rencana mingguan hub selama 4 minggu', t: 'Assignment', target: '2026-11-05', s: 'berjalan' },
          { j: 'Review rencana mingguan bersama mentor', t: 'Mentoring', target: '2026-11-28', s: 'rencana' },
          { j: 'Training: Operational Planning Basics', t: 'Training', target: '2026-10-15', s: 'selesai', done: { date: '2026-10-14', what: 'Menyelesaikan modul online & post-test.', evidence: 'Sudah membuat draft rencana mingguan pertama dengan format dari training.', link: 'https://example.com/rencana-minggu-1' } } ] },
        { nama: 'Empowerment', gap: 0.5, acts: [
          { j: 'Mendelegasikan briefing pagi ke 2 koordinator', t: 'Coaching', target: '2026-12-10', s: 'rencana' } ] },
      ] },
    { nama: 'Andi Pratama', jabatan: 'Coordinator Linehaul', approval: 'pending', catatan: 'Membangun kemampuan koordinasi lintas tim.',
      comps: [
        { nama: 'Collaboration', gap: 1.0, acts: [
          { j: 'Shadowing rapat koordinasi linehaul–hub 3x', t: 'Mentoring', target: '2026-12-05', s: 'rencana' },
          { j: 'Training: Effective Communication', t: 'Training', target: '2026-12-15', s: 'rencana' } ] },
        { nama: 'Customer Focus', gap: 0.5, acts: [
          { j: 'Menangani 5 eskalasi klien B2B bersama mentor', t: 'Assignment', target: '2026-12-20', s: 'rencana' } ] },
      ] },
    { nama: 'Dewi Kusuma', jabatan: 'Staff Admin Operasional', approval: 'approved', catatan: 'Ketelitian data dan inisiatif perbaikan proses.',
      comps: [
        { nama: 'Attention to Detail', gap: 1.0, acts: [
          { j: 'Training: Data Accuracy Fundamentals', t: 'Training', target: '2026-09-30', s: 'selesai' },
          { j: 'Membuat checklist validasi data harian', t: 'Assignment', target: '2026-10-20', s: 'selesai' } ] },
        { nama: 'Initiative', gap: 0.5, acts: [
          { j: 'Mengusulkan 1 perbaikan proses input manifest', t: 'Assignment', target: '2026-11-30', s: 'berjalan' } ] },
      ] },
  ];
  let sel = 0, open = 0;
  const F = id => document.getElementById(id);
  const all = m => m.comps.flatMap(c => c.acts);
  const late = a => a.s !== 'selesai' && new Date(a.target) < TODAY;
  const fmt = d => new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  const toast = msg => { const t = F('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2200); };

  function donut(done, prog, total){
    const R = 62, C = 2 * Math.PI * R, d = total ? done / total : 0, p = total ? prog / total : 0;
    return `<div class="donut"><svg viewBox="0 0 150 150" width="150" height="150">
      <circle cx="75" cy="75" r="${R}" fill="none" stroke="rgba(120,120,128,.14)" stroke-width="16"/>
      <circle cx="75" cy="75" r="${R}" fill="none" stroke="#8b5cf6" stroke-width="16" stroke-dasharray="${(d + p) * C} ${C}" transform="rotate(-90 75 75)" stroke-linecap="butt"/>
      <circle cx="75" cy="75" r="${R}" fill="none" stroke="#16A34A" stroke-width="16" stroke-dasharray="${d * C} ${C}" transform="rotate(-90 75 75)"/>
    </svg><div class="c"><b>${pct(done, total)}%</b><span class="text-meta">done</span></div></div>`;
  }


  const ICON = { selesai: '<span class="ic ic-done">✓</span>', berjalan: '<span class="ic ic-prog"></span>', rencana: '<span class="ic ic-plan"></span>' };
  const btn = (pending, x, key) => pending ? '' : `<button class="btn btn-outline btn-sm" data-up="${key}">${x.s === 'selesai' ? 'Reopen' : x.s === 'berjalan' ? 'Mark Done' : 'Start'}</button>`;
  function ring(p, size = 54){
    const R = size / 2 - 5, C = 2 * Math.PI * R;
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="rgba(120,120,128,.15)" stroke-width="6"/>
      <circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="#16A34A" stroke-width="6" stroke-linecap="round" stroke-dasharray="${p / 100 * C} ${C}" transform="rotate(-90 ${size/2} ${size/2})"/>
      <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="currentColor">${p}%</text></svg>`;
  }
  function cardsView(m, pending){
    return `<div class="cgrid">${m.comps.map((c, ci) => {
      const d = c.acts.filter(x => x.s === 'selesai').length, w = Math.round(100 / c.acts.length);
      return `<div class="ccard">
        <div class="ccard-head"><div><div class="cname">${c.nama}</div><div class="text-meta">${d} of ${c.acts.length} done · gap ${c.gap.toFixed(1)}</div></div>${ring(pct(d, c.acts.length))}</div>
        ${c.acts.map((x, ai) => `<div class="crow">
          ${ICON[x.s]}
          <div style="flex:1; min-width:0;"><div class="ctitle ${x.s === 'selesai' ? 'done' : ''}">${x.j}</div>
            <div class="meta">${x.t} · ${w}% · <span class="${late(x) ? 'late-t' : ''}">${fmt(x.target)}${late(x) ? ' · overdue' : ''}</span>${x.done ? ` · <a href="javascript:void 0" data-ev="${ci}-${ai}" style="color:var(--pink); font-weight:600;">Evidence</a>` : ''}</div>
            ${x.done ? `<div class="evbox" id="ev-${ci}-${ai}" style="display:none;">
              <div><b>Done</b> ${fmt(x.done.date)}</div>
              <div><b>Activity done:</b> ${x.done.what}</div>
              <div><b>Competency evidence:</b> ${x.done.evidence}</div>
              ${x.done.link ? `<div><a href="${x.done.link}" target="_blank" rel="noopener">Open evidence file</a></div>` : ''}
            </div>` : ''}</div>
          ${btn(pending, x, ci + '-' + ai)}
        </div>`).join('')}
      </div>`;
    }).join('')}</div>`;
  }

  function doneDialog(m, c, x){
    const back = document.createElement('div'); back.className = 'dlg-back';
    const today = TODAY.toISOString().slice(0, 10);
    back.innerHTML = `<div class="dlg" role="dialog" aria-modal="true">
      <h3>Mark Activity as Done</h3>
      <div class="text-meta">${m.nama} · ${c.nama}</div>
      <div class="dlg-act">${x.j}</div>
      <label>What did ${m.nama.split(' ')[0]} do? <span class="req">*</span></label>
      <textarea id="dWhat" rows="3" placeholder="e.g. Led 4 weekly planning meetings and presented the root-cause analysis to the DH on 18 Nov."></textarea>
      <label>Evidence that the competency is met <span class="req">*</span></label>
      <textarea id="dEv" rows="3" placeholder="Observable behavior: what is different now? e.g. Uses delay data before deciding courier allocation; decisions are explained with numbers."></textarea>
      <div style="display:grid; grid-template-columns: 1fr 160px; gap:10px;">
        <div><label>Evidence link (optional)</label><input id="dLink" type="url" placeholder="https://… (OneDrive / Drive)"></div>
        <div><label>Completion date</label><input id="dDate" type="date" value="${today}"></div>
      </div>
      <div class="err" id="dErr"></div>
      <div class="dlg-btns"><button class="btn btn-outline" id="dCancel">Cancel</button><button class="btn btn-primary" id="dOk">Mark as Done</button></div>
    </div>`;
    document.body.appendChild(back);
    const close = () => back.remove();
    back.addEventListener('click', e => { if(e.target === back) close(); });
    back.querySelector('#dCancel').onclick = close;
    back.querySelector('#dOk').onclick = () => {
      const what = back.querySelector('#dWhat').value.trim(), ev = back.querySelector('#dEv').value.trim(), link = back.querySelector('#dLink').value.trim();
      const err = back.querySelector('#dErr');
      if(!what || !ev){ err.textContent = 'Fill in what was done and the competency evidence.'; return; }
      if(link && !/^https?:\/\//i.test(link)){ err.textContent = 'Evidence link must start with https://'; return; }
      x.s = 'selesai'; x.done = { what, evidence: ev, link, date: back.querySelector('#dDate').value || today };
      close(); toast('Activity marked as done'); render();
    };
    back.querySelectorAll('textarea, input').forEach(i => i.addEventListener('input', () => back.querySelector('#dErr').textContent = ''));
    setTimeout(() => back.querySelector('#dWhat').focus(), 30);
  }

  function render(){
    const acts = mentees.flatMap(all);
    F('kMentee').textContent = mentees.length;
    F('kAppr').textContent = mentees.filter(m => m.approval === 'pending').length;
    F('kDone').textContent = `${acts.filter(a => a.s === 'selesai').length}/${acts.length}`;
    F('kLate').textContent = acts.filter(late).length;
    F('list').innerHTML = mentees.map((m, i) => {
      const a = all(m), d = a.filter(x => x.s === 'selesai').length;
      return `<div class="mentee ${i === sel ? 'sel' : ''}" data-i="${i}"><div class="av">${m.nama.split(' ').map(w => w[0]).join('')}</div>
        <div style="flex:1; min-width:0;"><div style="display:flex; justify-content:space-between; gap:8px;"><strong style="font-size:13.5px;">${m.nama}</strong>${m.approval === 'pending' ? '<span class="badge badge-amber">To approve</span>' : `<span class="text-meta">${pct(d, a.length)}%</span>`}</div>
        <div class="text-meta">${m.jabatan}</div>${m.approval === 'pending' ? '' : `<div class="mini"><span style="width:${pct(d, a.length)}%"></span></div>`}</div></div>`;
    }).join('');
    document.querySelectorAll('.mentee').forEach(el => el.onclick = () => { sel = +el.dataset.i; open = 0; render(); });

    const m = mentees[sel], a = all(m);
    const done = a.filter(x => x.s === 'selesai').length, prog = a.filter(x => x.s === 'berjalan').length;
    const pending = m.approval === 'pending';
    F('detail').innerHTML = `
      ${pending ? `<div class="card approve" style="margin-bottom:16px;"><div><div class="text-h3" style="margin-bottom:4px;">IDP ${m.nama} needs your approval</div><div class="text-meta">Prepared by HR/OD · review the plan below, then approve or ask for changes.</div></div>
        <div style="display:flex; gap:8px;"><button class="btn btn-outline" id="revBtn">Request Revision</button><button class="btn btn-primary" id="apprBtn">Approve IDP</button></div></div>` : ''}
      <div class="panel" style="margin:0 0 16px;">
        <div class="panel-head"><div><h3 class="text-h2" style="margin:0;">${m.nama}</h3><div class="text-meta">${m.jabatan} · IDP Semester 1 2026</div></div>
          <span class="badge ${pending ? 'badge-amber' : 'badge-green'}">${pending ? 'Pending approval' : 'Approved'}</span></div>
        <div class="summary">
          ${donut(done, prog, a.length)}
          <div>
            <div style="font-weight:700; font-size:16px; margin-bottom:4px;">${done} of ${a.length} activities done · ${m.comps.length} competencies</div>
            <div class="text-sub" style="margin:0;">${m.catatan}</div>
            <div class="legend"><span><i style="background:#16A34A"></i>Done ${done}</span><span><i style="background:#8b5cf6"></i>In progress ${prog}</span><span><i style="background:rgba(120,120,128,.25)"></i>Planned ${a.length - done - prog}</span><span><i style="background:transparent; box-shadow: inset 0 0 0 2px var(--red);"></i>Overdue ${a.filter(late).length}</span></div>
          </div>
        </div>
      </div>
      `;
    F('progress').innerHTML = `<div class="panel" style="margin:0;">
        <div class="panel-head"><h3 class="text-h2" style="margin:0;">Progress by Competency</h3><span class="text-meta">${m.nama} · ${m.comps.length} competencies</span></div>
        ${cardsView(m, pending)}
      </div>`;
    document.querySelectorAll('[data-ev]').forEach(b => b.onclick = () => { const box = document.getElementById('ev-' + b.dataset.ev); box.style.display = box.style.display === 'none' ? 'block' : 'none'; });
    document.querySelectorAll('[data-up]').forEach(b => b.onclick = e => {
      e.stopPropagation(); const [ci, ai] = b.dataset.up.split('-').map(Number); const c = m.comps[ci], x = c.acts[ai];
      if(x.s === 'rencana'){ x.s = 'berjalan'; toast('Activity started'); render(); }
      else if(x.s === 'berjalan') doneDialog(m, c, x);
      else if(confirm('Reopen this activity? Its completion record will be kept in history.')){ x.s = 'berjalan'; x.done = null; render(); }
    });
    F('apprBtn')?.addEventListener('click', () => { m.approval = 'approved'; toast('IDP approved (mockup)'); render(); });
    F('revBtn')?.addEventListener('click', () => toast('A note box for HR/OD would open here'));
  }

  render();
</script>
