<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nilai Submission — Anteraja LMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./lms-design-system.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  .avatar { width: 28px; height: 28px; border-radius: 50%; }
  .user-chip { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }
  .sub-card { border: 1px solid var(--border); border-radius: var(--r-card); padding: 18px; margin-bottom: 14px; }
  .sub-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .avatar-sm { width: 28px; height: 28px; border-radius: 50%; background: var(--pink-bg); color: var(--pink-dark); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; font-family: var(--font-display); }
  .score-row { display: flex; gap: 10px; align-items: flex-end; margin-top: 12px; }
  .score-row input[type=number] { margin-bottom: 0; }
  .tabs { display: flex; gap: 6px; margin-bottom: 18px; }
  .tab-btn { padding: 8px 16px; border-radius: var(--r-control); font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); }
  .tab-btn.active { background: var(--pink); border-color: var(--pink); color: #fff; }
</style>
</head>
<body>

<div id="gate" class="locked-state" style="display:none;">
  <p class="text-h2" id="gateTitle" style="margin-bottom:8px;">Memuat...</p>
  <p class="text-sub" id="gateSub"></p>
</div>

<div id="appShell" style="display:none;">
  <div class="topbar">
    <div style="display:flex; align-items:center; gap:16px;">
      <a href="index.html" class="sidebar-logo" style="margin:0; text-decoration:none;">anteraja LMS</a>
      <a href="index.html" class="text-sub" style="text-decoration:none; display:flex; align-items:center; gap:4px;">← Menu Utama</a>
    </div>
    <div class="user-chip">
      <img class="avatar" id="userAvatar" src="">
      <span id="userName"></span>
    </div>
  </div>

  <div class="wrap" style="max-width:820px;">
    <h1 class="text-h1">Nilai Submission</h1>
    <p class="text-sub" style="margin-bottom:20px;">File jawaban trainee (soal tipe Submission File) dari modul yang Anda buat.</p>

    <div class="tabs">
      <div class="tab-btn active" data-tab="pending" id="tabPending">Menunggu Dinilai</div>
      <div class="tab-btn" data-tab="scored" id="tabScored">Sudah Dinilai</div>
    </div>

    <div id="subList"></div>
    <div class="empty-state" id="emptyState" style="display:none;"></div>
  </div>
</div>

<div id="previewModal" style="display:none; position:fixed; inset:0; background:rgba(26,26,26,.55); z-index:60; align-items:center; justify-content:center;">
  <div style="background:#fff; border-radius:var(--r-card); width:800px; max-width:94vw; height:85vh; display:flex; flex-direction:column; overflow:hidden;">
    <div style="display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--border);">
      <span id="previewTitle" style="font-weight:700; font-size:14px;"></span>
      <button class="icon-btn" id="closePreviewBtn"></button>
    </div>
    <div style="flex:1; background:var(--surface-2);"><iframe id="previewFrame" style="width:100%; height:100%; border:none;"></iframe></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { auth, db, onAuth, ensureUserProfile } from './firebase-shared.js';
  import { iconSvg } from './lms-icons.js';
  import { collection, query, where, getDocs, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

  let currentProfile = null;
  let myModuleIds = [];
  let moduleTitleById = {};
  let activeTab = 'pending';

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2500);
  }
  function initials(name){ return (name||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

  window.openPreviewModal = function(url, name){
    const isPdf = /\.pdf($|\?)/i.test(name) || /\.pdf($|\?)/i.test(url);
    const src = isPdf ? url : `https://docs.google.com/viewer?url=${encodeURIComponent(url)}&embedded=true`;
    document.getElementById('previewTitle').textContent = name;
    document.getElementById('previewFrame').src = src;
    document.getElementById('previewModal').style.display = 'flex';
  };
  document.getElementById('closePreviewBtn').innerHTML = iconSvg('x', {size:18});
  document.getElementById('closePreviewBtn').addEventListener('click', () => {
    document.getElementById('previewModal').style.display = 'none';
    document.getElementById('previewFrame').src = '';
  });

  async function loadSubmissions(){
    const box = document.getElementById('subList');
    const empty = document.getElementById('emptyState');
    box.innerHTML = `<p class="text-meta">Memuat...</p>`;

    // Ambil semua submission, filter yang moduleId-nya milik trainer ini di sisi client
    // (Firestore rules tidak izinkan query submissions by createdBy modul secara langsung).
    const allSub = [];
    for(const mid of myModuleIds){
      const q = query(collection(db, 'submissions'), where('moduleId', '==', mid));
      const snap = await getDocs(q);
      snap.forEach(d => allSub.push({ id: d.id, ...d.data() }));
    }
    let rows = activeTab === 'pending' ? allSub.filter(s => s.score == null) : allSub.filter(s => s.score != null);
    rows.sort((a,b) => (b.submittedAt?.seconds||0) - (a.submittedAt?.seconds||0));

    if(!rows.length){
      box.innerHTML = '';
      empty.style.display = 'block';
      empty.innerHTML = iconSvg('inbox',{size:28}) + `<p style="margin-top:8px;">Tidak ada submission di sini.</p>`;
      return;
    }
    empty.style.display = 'none';

    // Ambil nama pengirim dari koleksi users (best-effort, tampilkan uid kalau gagal)
    box.innerHTML = rows.map(s => `
      <div class="sub-card" data-id="${s.id}">
        <div class="sub-head">
          <div class="avatar-sm">${initials(s.nama || s.uid)}</div>
          <div>
            <div style="font-weight:700; font-size:14px;">${moduleTitleById[s.moduleId] || s.moduleId}</div>
            <div class="text-meta">${s.nama || s.uid} · Soal #${Number(s.questionId)+1}</div>
          </div>
        </div>
        <div style="display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--surface-2); border-radius:var(--r-control); font-size:13px; margin-bottom:8px;">
          ${iconSvg('file-text',{size:15})} <span style="flex:1;">${s.fileName}</span>
          <button onclick="openPreviewModal('${s.fileUrl}', '${(s.fileName||'').replace(/'/g,"\\'")}')" style="background:none; border:none; color:var(--pink); font-weight:700; font-size:12px; cursor:pointer;">Preview</button>
        </div>
        ${s.score != null ? `<span class="badge badge-green">Skor: ${s.score}</span>` : `
        <div class="score-row">
          <div style="flex:1;"><label>Skor (0-100)</label><input type="number" min="0" max="100" data-i="${s.id}" placeholder="mis. 85"></div>
          <button class="btn btn-primary btn-sm" data-action="score" data-i="${s.id}">Simpan Skor</button>
        </div>`}
      </div>`).join('');

    box.querySelectorAll('[data-action="score"]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.i;
        const input = box.querySelector(`input[data-i="${id}"]`);
        const val = Number(input.value);
        if(isNaN(val) || val < 0 || val > 100){ showToast('Skor harus 0-100.'); return; }
        try{
          await updateDoc(doc(db, 'submissions', id), { score: val });
          showToast('Skor tersimpan.');
          loadSubmissions();
        } catch(err){
          showToast('Gagal simpan: ' + err.message);
        }
      });
    });
  }

  document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeTab = btn.dataset.tab;
    loadSubmissions();
  }));

  onAuth(async (user) => {
    const gate = document.getElementById('gate');
    const shell = document.getElementById('appShell');
    if(!user){
      gate.style.display = 'block'; shell.style.display = 'none';
      document.getElementById('gateTitle').textContent = 'Silakan login';
      document.getElementById('gateSub').innerHTML = `<a href="index.html">Login dulu di sini</a>.`;
      return;
    }
    currentProfile = await ensureUserProfile(user);
    if(currentProfile.role !== 'trainer' && currentProfile.role !== 'admin'){
      gate.style.display = 'block'; shell.style.display = 'none';
      document.getElementById('gateTitle').textContent = 'Akses ditolak';
      document.getElementById('gateSub').textContent = 'Halaman ini cuma buat Trainer/Admin.';
      return;
    }
    gate.style.display = 'none'; shell.style.display = 'block';
    document.getElementById('userAvatar').src = currentProfile.photoURL;
    document.getElementById('userName').textContent = currentProfile.displayName;

    // Modul milik trainer ini (atau semua modul kalau admin)
    const modQ = currentProfile.role === 'admin'
      ? await getDocs(collection(db, 'modules'))
      : await getDocs(query(collection(db, 'modules'), where('createdBy', '==', user.uid)));
    myModuleIds = [];
    modQ.forEach(d => { myModuleIds.push(d.id); moduleTitleById[d.id] = d.data().judul; });

    loadSubmissions();
  });
</script>
</body>
</html>
