<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Belajar — Anteraja LMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./lms-design-system.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  .avatar { width: 28px; height: 28px; border-radius: 50%; }
  .user-chip { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }
  .video-wrap { position: relative; aspect-ratio: 16/9; background: #000; border-radius: var(--r-card); overflow: hidden; margin-bottom: 14px; }
  .video-wrap iframe, .video-wrap > div { width: 100%; height: 100%; border: none; }
  .steps-bar { display: flex; gap: 6px; margin: 18px 0; }
  .step-dot { flex: 1; height: 5px; border-radius: 99px; background: var(--border); }
  .step-dot.done { background: var(--pink); }
  .lock-note { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--amber-bg); color: #92400E; border-radius: var(--r-control); font-size: 13px; font-weight: 600; margin-bottom: 14px; }
  .q-block { margin-bottom: 22px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
  .q-block:last-child { border-bottom: none; }
  .q-num { font-size: 11px; color: var(--pink); font-weight: 700; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .03em; }
  .q-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
  .opt { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--r-control); margin-bottom: 8px; cursor: pointer; }
  .opt.selected { border-color: var(--pink); background: var(--pink-bg); }
  .scale-row { display: flex; gap: 8px; }
  .scale-opt { flex: 1; text-align: center; padding: 12px 0; border: 1px solid var(--border); border-radius: var(--r-control); cursor: pointer; font-weight: 700; color: var(--text-2); }
  .scale-opt.selected { border-color: var(--pink); background: var(--pink); color: #fff; }
  .pdf-nav { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 10px; margin-top: 10px; }
  .pdf-nav button { background: var(--pink-bg); color: var(--pink-dark); border: none; border-radius: var(--r-control); width: 34px; height: 34px; cursor: pointer; display:flex; align-items:center; justify-content:center; }
  .pdf-nav button:disabled { background: var(--surface-2); color: var(--text-3); cursor: not-allowed; }
  .pdf-canvas-wrap { overflow: auto; display: flex; align-items: flex-start; justify-content: center; background: var(--surface-2); border-radius: var(--r-card); padding: 16px; max-height: 78vh; }
  .pdf-canvas-wrap canvas { box-shadow: 0 1px 4px rgba(0,0,0,.15); max-width: 100%; }
  .btn-row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  .file-row { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 8px 10px; background: var(--surface-2); border-radius: var(--r-control); margin-bottom: 6px; }
</style>
</head>
<body>

<div id="gate" class="locked-state" style="display:none;">
  <p class="text-h2" id="gateTitle" style="margin-bottom:8px;">Memuat...</p>
  <p class="text-sub" id="gateSub"></p>
</div>

<div id="appShell" style="display:none;">
  <div class="topbar">
    <div style="display:flex; align-items:center; gap:16px;">
      <a href="trainee-library.html" class="sidebar-logo" style="margin:0; text-decoration:none;">anteraja LMS</a>
      <a href="trainee-library.html" class="text-sub" style="text-decoration:none; display:flex; align-items:center; gap:4px;">← Kembali ke Library</a>
    </div>
    <div class="user-chip">
      <img class="avatar" id="userAvatar" src="">
      <span id="userName"></span>
    </div>
  </div>

  <div class="wrap" style="max-width:920px;">
    <div class="steps-bar" id="stepsBar"></div>
    <div id="stepContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script type="module">
  import { auth, db, onAuth, ensureUserProfile } from './firebase-shared.js';
  import { iconSvg } from './lms-icons.js';
  import {
    doc, getDoc, setDoc, collection, query, where, getDocs, addDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-storage.js";
  import { getApps } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const storage = getStorage(getApps()[0]);
  const params = new URLSearchParams(window.location.search);
  const moduleId = params.get('module');

  let currentUser = null, currentProfile = null, moduleData = null, questions = [];
  let videoWatched = false;
  let materiFileIndex = 0;
  let viewedFiles = new Set();
  let answers = {}, uploadedFiles = {};
  let step = 'intro'; // intro -> video -> materi -> posttest -> done

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2500);
  }
  function youtubeId(url){
    if(!url) return null;
    const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([a-zA-Z0-9_-]{6,})/);
    return m ? m[1] : null;
  }
  function stepOrder(){
    const s = ['intro'];
    if(youtubeId(moduleData.videoUrl)) s.push('video');
    if((moduleData.materiFiles||[]).length) s.push('materi');
    s.push('posttest'); s.push('done');
    return s;
  }
  function goNext(){
    const order = stepOrder();
    const idx = order.indexOf(step);
    step = order[idx+1] || 'done';
    renderStep();
  }

  function renderStepsBar(){
    const order = stepOrder().filter(s => s !== 'intro' && s !== 'done');
    const idx = order.indexOf(step);
    document.getElementById('stepsBar').innerHTML = order.map((s,i) =>
      `<div class="step-dot ${i <= idx ? 'done' : ''}"></div>`).join('');
  }

  function renderStep(){
    renderStepsBar();
    const box = document.getElementById('stepContent');
    if(step === 'intro') return renderIntro(box);
    if(step === 'video') return renderVideoStep(box);
    if(step === 'materi') return renderMateriStep(box);
    if(step === 'posttest') return renderPostTestStep(box);
    if(step === 'done') return renderDoneStep(box);
  }

  function renderIntro(box){
    box.innerHTML = `
      <div class="card">
        <h1 class="text-h1">${moduleData.judul}</h1>
        <p class="text-sub" style="margin-bottom:14px;">${moduleData.kategori} · ${moduleData.durasiMenit||0} menit</p>
        <p class="text-body" style="margin-bottom:20px;">${moduleData.deskripsi||''}</p>
        <button class="btn btn-primary" id="startBtn" style="width:100%;">Mulai Training</button>
      </div>`;
    document.getElementById('startBtn').addEventListener('click', goNext);
  }

  function renderVideoStep(box){
    box.innerHTML = `
      <div class="card">
        <h2 class="text-h2" style="margin-bottom:12px;">Video Materi</h2>
        <div class="video-wrap"><div id="ytPlayer"></div></div>
        ${!videoWatched ? `<div class="lock-note">${iconSvg('lock',{size:16})} Tonton sampai selesai untuk lanjut.</div>` : ''}
        <div class="btn-row"><button class="btn btn-primary" id="nextBtn" ${videoWatched?'':'disabled'}>Lanjut</button></div>
      </div>`;
    document.getElementById('nextBtn').addEventListener('click', goNext);
    initYoutubePlayer(youtubeId(moduleData.videoUrl));
  }

  function initYoutubePlayer(videoId){
    function create(){
      new YT.Player('ytPlayer', {
        videoId,
        events: {
          onStateChange: (e) => {
            if(e.data === YT.PlayerState.ENDED && !videoWatched){
              videoWatched = true;
              showToast('Video selesai ditonton.');
              renderVideoStep(document.getElementById('stepContent'));
            }
          }
        }
      });
    }
    if(window.YT && window.YT.Player) create();
    else window.onYouTubeIframeAPIReady = create;
  }

  function renderMateriStep(box){
    const files = moduleData.materiFiles || [];
    const f = files[materiFileIndex];
    const viewed = viewedFiles.has(String(materiFileIndex));
    box.innerHTML = `
      <div class="card">
        <h2 class="text-h2" style="margin-bottom:4px;">Materi ${files.length>1 ? `(${materiFileIndex+1}/${files.length})` : ''}</h2>
        <p class="text-sub" style="margin-bottom:12px;">${f.nama}</p>
        <div class="pdf-canvas-wrap"><canvas id="pdfCanvas"></canvas></div>
        <div id="audioNarasi" style="margin-top:10px;"></div>
        <div class="pdf-nav">
          <button id="pdfPrevBtn"></button>
          <span class="text-sub" id="pdfPageIndicator">Memuat...</span>
          <button id="pdfNextBtn"></button>
        </div>
        ${!viewed ? `<div class="lock-note">${iconSvg('lock',{size:16})} Baca sampai halaman terakhir untuk lanjut.</div>` : ''}
        <div class="btn-row"><button class="btn btn-primary" id="nextBtn" ${viewed?'':'disabled'}>${materiFileIndex < files.length-1 ? 'File Berikutnya' : 'Lanjut ke Post-Test'}</button></div>
      </div>`;
    document.getElementById('pdfPrevBtn').innerHTML = `<span style="display:inline-flex; transform:rotate(90deg);">${iconSvg('chevron-down', {size:16})}</span>`;
    document.getElementById('pdfNextBtn').innerHTML = `<span style="display:inline-flex; transform:rotate(-90deg);">${iconSvg('chevron-down', {size:16})}</span>`;
    document.getElementById('nextBtn').addEventListener('click', () => {
      if(materiFileIndex < files.length-1){ materiFileIndex++; renderMateriStep(box); }
      else goNext();
    });
    loadPdf(f.url);
  }

  let pdfDoc = null, pdfPageNum = 1;
  let currentAudioEl = null;
  function stopCurrentAudio(){
    if(currentAudioEl){ currentAudioEl.pause(); currentAudioEl = null; }
  }
  async function loadPdf(url){
    pdfPageNum = 1;
    stopCurrentAudio();
    try{
      pdfDoc = await pdfjsLib.getDocument(url).promise;
      renderPdfPage(pdfPageNum);
    } catch(err){
      document.getElementById('pdfPageIndicator').textContent = 'Gagal memuat: ' + err.message;
    }
  }
  async function renderPdfPage(num){
    const page = await pdfDoc.getPage(num);
    const canvas = document.getElementById('pdfCanvas');
    const ctx = canvas.getContext('2d');
    const wrapEl = canvas.closest('.pdf-canvas-wrap');
    const baseViewport = page.getViewport({ scale: 1 });
    const availableWidth = (wrapEl.clientWidth || 900) - 32; // dikurangi padding
    const dynamicScale = Math.max(1.2, Math.min(3, availableWidth / baseViewport.width));
    const viewport = page.getViewport({ scale: dynamicScale });
    canvas.width = viewport.width; canvas.height = viewport.height;
    await page.render({ canvasContext: ctx, viewport }).promise;
    document.getElementById('pdfPageIndicator').textContent = `Halaman ${num} dari ${pdfDoc.numPages}`;
    document.getElementById('pdfPrevBtn').disabled = num <= 1;
    document.getElementById('pdfNextBtn').disabled = num >= pdfDoc.numPages;

    stopCurrentAudio();
    const files = moduleData.materiFiles || [];
    const audioForPage = files[materiFileIndex]?.audio?.[num] || files[materiFileIndex]?.audio?.[String(num)];
    const audioBox = document.getElementById('audioNarasi');
    if(audioForPage){
      audioBox.innerHTML = `<audio id="narasiAudio" src="${audioForPage.url}" controls autoplay style="width:100%;"></audio>`;
      currentAudioEl = document.getElementById('narasiAudio');
      currentAudioEl.play().catch(() => { /* browser blokir autoplay tanpa interaksi — tetap ada tombol manual */ });
    } else {
      audioBox.innerHTML = '';
    }

    if(num >= pdfDoc.numPages && !viewedFiles.has(String(materiFileIndex))){
      viewedFiles.add(String(materiFileIndex));
      renderMateriStep(document.getElementById('stepContent'));
    }
  }
  document.addEventListener('click', (e) => {
    if(e.target.closest('#pdfPrevBtn') && pdfPageNum > 1) renderPdfPage(--pdfPageNum);
    if(e.target.closest('#pdfNextBtn') && pdfDoc && pdfPageNum < pdfDoc.numPages) renderPdfPage(++pdfPageNum);
  });

  function renderPostTestStep(box){
    if(!questions.length){
      box.innerHTML = `<div class="card"><p class="text-sub" style="margin-bottom:16px;">Tidak ada soal post-test untuk modul ini.</p><button class="btn btn-primary" id="skipBtn" style="width:100%;">Selesai</button></div>`;
      document.getElementById('skipBtn').addEventListener('click', () => finishAttempt(null));
      return;
    }
    box.innerHTML = `<div class="card"><h2 class="text-h2" style="margin-bottom:14px;">Post-Test</h2><div id="ptBody"></div></div>`;
    const ptBody = document.getElementById('ptBody');
    ptBody.innerHTML = questions.map((q,i) => `
      <div class="q-block">
        <div class="q-num">Soal ${i+1} dari ${questions.length} · ${{multiple_choice:'Pilihan Ganda',likert:'Skala 1-4',free_text:'Jawaban Teks',file_upload:'Submission File'}[q.tipe]||q.tipe}</div>
        <div class="q-title">${q.pertanyaan}</div>
        ${q.tipe === 'multiple_choice' ? (q.pilihan||[]).map(opt => `
          <div class="opt" data-i="${i}" data-value="${opt.replace(/"/g,'&quot;')}">
            <input type="radio" name="q-${i}"> <span>${opt}</span>
          </div>`).join('') : ''}
        ${q.tipe === 'likert' ? `<div class="scale-row">${[1,2,3,4].map(v => `<div class="scale-opt" data-i="${i}" data-value="${v}">${v}</div>`).join('')}</div>` : ''}
        ${q.tipe === 'free_text' ? `<textarea data-i="${i}" rows="3" placeholder="Jawaban Anda..."></textarea>` : ''}
        ${q.tipe === 'file_upload' ? `
          <div class="dropzone" data-i="${i}" id="fdz-${i}">${iconSvg('upload',{size:18})} <span>Klik untuk upload file jawaban</span></div>
          <input type="file" data-i="${i}" id="finput-${i}" style="display:none">
          <div id="fresult-${i}" class="text-meta" style="margin-top:6px;"></div>` : ''}
      </div>`).join('') + `<button class="btn btn-primary" id="submitPtBtn" style="width:100%; margin-top:6px;">Kirim Jawaban</button>`;

    ptBody.querySelectorAll('.opt').forEach(el => el.addEventListener('click', () => {
      const i = el.dataset.i;
      answers[i] = el.dataset.value;
      ptBody.querySelectorAll(`.opt[data-i="${i}"]`).forEach(o => o.classList.remove('selected'));
      el.classList.add('selected'); el.querySelector('input').checked = true;
    }));
    ptBody.querySelectorAll('.scale-opt').forEach(el => el.addEventListener('click', () => {
      const i = el.dataset.i;
      answers[i] = Number(el.dataset.value);
      ptBody.querySelectorAll(`.scale-opt[data-i="${i}"]`).forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
    }));
    ptBody.querySelectorAll('textarea[data-i]').forEach(el => el.addEventListener('input', () => { answers[el.dataset.i] = el.value; }));
    ptBody.querySelectorAll('.dropzone[data-i]').forEach(dz => {
      const i = dz.dataset.i;
      const input = document.getElementById(`finput-${i}`);
      dz.addEventListener('click', () => input.click());
      input.addEventListener('change', async (e) => {
        if(!e.target.files[0]) return;
        const file = e.target.files[0];
        const resultEl = document.getElementById(`fresult-${i}`);
        resultEl.textContent = 'Mengupload...';
        try{
          const path = `submissions/${moduleId}/${currentUser.uid}/${Date.now()}_${file.name}`;
          const fileRef = ref(storage, path);
          await uploadBytes(fileRef, file);
          const url = await getDownloadURL(fileRef);
          uploadedFiles[i] = { url, nama: file.name };
          resultEl.textContent = `✓ ${file.name} terupload.`;
        } catch(err){ resultEl.textContent = 'Gagal upload: ' + err.message; }
      });
    });
    document.getElementById('submitPtBtn').addEventListener('click', async () => {
      const btn = document.getElementById('submitPtBtn');
      btn.disabled = true; btn.textContent = 'Mengirim...';
      let correct = 0, gradable = 0;
      questions.forEach((q,i) => {
        if(q.tipe === 'multiple_choice'){ gradable++; if(answers[i] === q.jawabanBenar) correct++; }
      });
      const score = gradable ? Math.round((correct/gradable)*100) : null;
      await finishAttempt(score);
    });
  }

  async function finishAttempt(score){
    try{
      await addDoc(collection(db, 'attempts'), {
        moduleId, uid: currentUser.uid, nama: currentProfile.displayName, email: currentProfile.email,
        score, answers, submittedAt: serverTimestamp(),
      });
      for(const i of Object.keys(uploadedFiles)){
        await addDoc(collection(db, 'submissions'), {
          moduleId, questionId: i, uid: currentUser.uid,
          fileUrl: uploadedFiles[i].url, fileName: uploadedFiles[i].nama,
          score: null, submittedAt: serverTimestamp(),
        });
      }
      step = 'done';
      renderStep();
      window._lastScore = score;
    } catch(err){
      showToast('Gagal kirim: ' + err.message);
    }
  }

  window.downloadFile = async function(url, name, btn){
    const original = btn.textContent; btn.textContent = '...';
    try{
      const res = await fetch(url);
      const blob = await res.blob();
      const objUrl = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = objUrl; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(objUrl);
    } catch(err){ showToast('Gagal unduh: ' + err.message); }
    finally { btn.textContent = original; }
  };

  function renderDoneStep(box){
    const score = window._lastScore;
    const files = moduleData.materiFiles || [];
    box.innerHTML = `
      <div class="card" style="text-align:center;">
        ${iconSvg('check',{size:32})}
        <p style="font-weight:700; font-size:16px; margin:12px 0 4px;">Selamat, ${currentProfile.displayName.split(' ')[0]}! Training selesai.</p>
        ${score!=null ? `<p class="text-sub">Skor Post-Test Anda: <strong>${score}</strong></p>` : `<p class="text-sub">Jawaban Anda tersimpan.</p>`}
      </div>
      ${files.length ? `
      <div class="card" style="margin-top:14px; text-align:left;">
        <h2 class="text-h2" style="margin-bottom:12px;">Unduh Materi (bonus)</h2>
        ${files.map(f => `
          <div class="file-row">
            ${iconSvg('file-text',{size:15})} <span style="flex:1;">${f.nama}</span>
            <button onclick="downloadFile('${f.url}', '${f.nama.replace(/'/g,"\\'")}', this)" style="background:none; border:none; color:var(--pink); font-weight:700; font-size:12px; cursor:pointer;">Unduh</button>
          </div>`).join('')}
      </div>` : ''}
      <div style="margin-top:14px;"><a href="trainee-library.html" class="btn btn-outline" style="width:100%; display:block; text-align:center; text-decoration:none;">Kembali ke Library</a></div>`;
  }

  onAuth(async (user) => {
    const gate = document.getElementById('gate');
    const shell = document.getElementById('appShell');
    if(!moduleId){
      gate.style.display = 'block'; shell.style.display = 'none';
      document.getElementById('gateTitle').textContent = 'Link tidak lengkap';
      document.getElementById('gateSub').innerHTML = `<a href="trainee-library.html">Kembali ke Library</a>.`;
      return;
    }
    if(!user){
      gate.style.display = 'block'; shell.style.display = 'none';
      document.getElementById('gateTitle').textContent = 'Silakan login';
      document.getElementById('gateSub').innerHTML = `<a href="index.html">Login dulu di sini</a>.`;
      return;
    }
    currentUser = user;
    currentProfile = await ensureUserProfile(user);

    const modSnap = await getDoc(doc(db, 'modules', moduleId));
    if(!modSnap.exists() || (modSnap.data().status !== 'published' && modSnap.data().createdBy !== user.uid && currentProfile.role !== 'admin')){
      gate.style.display = 'block'; shell.style.display = 'none';
      document.getElementById('gateTitle').textContent = 'Modul tidak ditemukan';
      document.getElementById('gateSub').innerHTML = `<a href="trainee-library.html">Kembali ke Library</a>.`;
      return;
    }
    moduleData = modSnap.data();

    // Catat progress "sedang dipelajari" — dipakai trainee-library.html buat "Lanjutkan Belajar"
    setDoc(doc(db, 'progress', `${user.uid}_${moduleId}`), {
      uid: user.uid, moduleId, judul: moduleData.judul, kategori: moduleData.kategori || '',
      updatedAt: serverTimestamp(),
    }, { merge: true }).catch(() => {});

    const qSnap = await getDocs(query(collection(db, 'questions'), where('moduleId', '==', moduleId)));
    questions = [];
    qSnap.forEach(d => questions.push(d.data()));
    questions.sort((a,b) => (a.urutan||0) - (b.urutan||0));

    gate.style.display = 'none'; shell.style.display = 'block';
    document.getElementById('userAvatar').src = currentProfile.photoURL;
    document.getElementById('userName').textContent = currentProfile.displayName;

    renderStep();
  });
</script>
</body>
</html>
