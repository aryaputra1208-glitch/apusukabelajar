<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Approval Modul — Anteraja LMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./lms-design-system.css">
<style>
  .mod-card { border: 1px solid var(--border); border-radius: var(--r-card); padding: 18px; margin-bottom: 14px; }
  .mod-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .avatar-sm { width: 28px; height: 28px; border-radius: 50%; background: var(--pink-bg); color: var(--pink-dark); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; font-family: var(--font-display); }
  .meta-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .meta-pill { font-size: 11px; color: var(--text-2); border: 1px solid var(--border); padding: 3px 9px; border-radius: var(--r-pill); }
  .action-row { display: flex; gap: 8px; }
  .action-row .btn { flex: 1; }
  .btn-reject { background: var(--red-bg); color: var(--red); }
  .btn-reject:hover { filter: brightness(0.96); }
  .tabs { display: flex; gap: 6px; margin-bottom: 18px; }
  .tab-btn { padding: 8px 16px; border-radius: var(--r-control); font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); }
  .tab-btn.active { background: var(--pink); border-color: var(--pink); color: #fff; }
  .q-preview { font-size: 12px; color: var(--text-2); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
  .avatar { width: 28px; height: 28px; border-radius: 50%; }
  .user-chip { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }
</style>
</head>
<body>

<div id="gate" class="locked-state" style="display:none;">
  <p class="text-h2" id="gateTitle" style="margin-bottom:8px;">Memuat...</p>
  <p class="text-sub" id="gateSub"></p>
</div>

<div id="appShell" style="display:none;">
  <div class="topbar">
    <div class="sidebar-logo" style="margin:0;">anteraja LMS</div>
    <div class="user-chip">
      <img class="avatar" id="userAvatar" src="">
      <span id="userName"></span>
    </div>
  </div>

  <div class="wrap">
    <h1 class="text-h1">Approval Modul</h1>
    <p class="text-sub" style="margin-bottom:20px;">Review modul dari trainer sebelum tayang ke trainee.</p>

    <div class="tabs">
      <div class="tab-btn active" data-status="pending_approval" id="tabPending">Menunggu</div>
      <div class="tab-btn" data-status="published" id="tabPublished">Published</div>
      <div class="tab-btn" data-status="rejected" id="tabRejected">Ditolak</div>
    </div>

    <div id="moduleList"></div>
    <div class="empty-state" id="emptyState" style="display:none;"></div>
  </div>
</div>

<div id="previewModal" style="display:none; position:fixed; inset:0; background:rgba(26,26,26,.55); z-index:60; align-items:center; justify-content:center;">
  <div style="background:#fff; border-radius:var(--r-card); width:800px; max-width:94vw; height:85vh; display:flex; flex-direction:column; overflow:hidden;">
    <div style="display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--border);">
      <span id="previewTitle" style="font-weight:700; font-size:14px;"></span>
      <button class="icon-btn" id="closePreviewBtn"></button>
    </div>
    <div style="flex:1; background:var(--surface-2);">
      <iframe id="previewFrame" style="width:100%; height:100%; border:none;"></iframe>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { auth, db, onAuth, ensureUserProfile } from './firebase-shared.js';
  import { iconSvg } from './lms-icons.js';
  import {
    collection, query, where, orderBy, getDocs, doc, updateDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

  let currentProfile = null;
  let activeStatus = 'pending_approval';

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2500);
  }

  function initials(name){
    return (name||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  }

  document.getElementById('closePreviewBtn').innerHTML = iconSvg('x', {size:18});
  document.getElementById('closePreviewBtn').addEventListener('click', closePreviewModal);

  window.openPreviewModal = function(url, name){
    const isPdf = /\.pdf($|\?)/i.test(name) || /\.pdf($|\?)/i.test(url);
    const src = isPdf ? url : `https://docs.google.com/viewer?url=${encodeURIComponent(url)}&embedded=true`;
    document.getElementById('previewTitle').textContent = name;
    document.getElementById('previewFrame').src = src;
    document.getElementById('previewModal').style.display = 'flex';
  };
  function closePreviewModal(){
    document.getElementById('previewModal').style.display = 'none';
    document.getElementById('previewFrame').src = '';
  }

  window.downloadFile = async function(url, name, btn){
    const original = btn.textContent;
    btn.textContent = '...';
    try{
      const res = await fetch(url);
      const blob = await res.blob();
      const objUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = objUrl; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(objUrl);
    } catch(err){
      showToast('Gagal unduh: ' + err.message);
    } finally {
      btn.textContent = original;
    }
  };

  function youtubeEmbedUrl(url){
    if(!url) return null;
    const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([a-zA-Z0-9_-]{6,})/);
    return m ? `https://www.youtube.com/embed/${m[1]}` : null;
  }

  async function loadModules(status){
    activeStatus = status;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.status === status));

    const el = document.getElementById('moduleList');
    const empty = document.getElementById('emptyState');
    el.innerHTML = `<p class="text-meta">Memuat...</p>`;

    const q = query(collection(db, 'modules'), where('status', '==', status));
    const snap = await getDocs(q);
    const modules = [];
    snap.forEach(d => modules.push({ id: d.id, ...d.data() }));
    modules.sort((a,b) => (b.updatedAt?.seconds||0) - (a.updatedAt?.seconds||0));

    if(!modules.length){
      el.innerHTML = '';
      empty.style.display = 'block';
      empty.innerHTML = iconSvg('inbox', {size:28}) + `<p style="margin-top:8px;">Tidak ada modul di status ini.</p>`;
      return;
    }
    empty.style.display = 'none';

    el.innerHTML = modules.map(m => `
      <div class="mod-card" data-id="${m.id}">
        <div class="mod-head">
          <div class="avatar-sm">${initials(m.createdByName)}</div>
          <div>
            <div style="font-weight:700; font-size:14px;">${m.judul || '(Tanpa judul)'}</div>
            <div class="text-meta">oleh ${m.createdByName || '-'}</div>
          </div>
        </div>
        <div class="meta-row">
          <span class="meta-pill">Kategori: ${m.kategori || '-'}</span>
          <span class="meta-pill">Divisi: ${(m.targetDivisi||[]).join(', ') || 'Semua'}</span>
          <span class="meta-pill">Level: ${(m.targetLevel||[]).join(', ') || 'Semua'}</span>
          <span class="meta-pill">${m.durasiMenit || 0} menit</span>
        </div>
        <p class="text-sub">${m.deskripsi || ''}</p>
        <div class="q-preview" id="qcount-${m.id}">Memuat jumlah soal...</div>
        <span class="link-add" data-action="toggle-questions" data-id="${m.id}" style="color:var(--pink); font-weight:700; font-size:12px; cursor:pointer; display:inline-block; margin-bottom:8px;">Lihat Soal</span>
        <div id="questions-${m.id}" style="display:none; margin-bottom:10px;"></div>

        ${youtubeEmbedUrl(m.videoUrl) ? `
          <div style="margin-top:12px; max-width:360px;">
            <iframe width="100%" height="200" style="border-radius:var(--r-control); border:1px solid var(--border);"
              src="${youtubeEmbedUrl(m.videoUrl)}" title="Preview video" frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen></iframe>
          </div>` : `<p class="text-meta" style="margin-top:10px;">${iconSvg('file-off',{size:14})} Belum ada video</p>`}

        ${(m.materiFiles||[]).length ? `
          <div style="margin-top:10px; display:flex; flex-direction:column; gap:6px;">
            ${m.materiFiles.map(f => `
              <div style="display:flex; align-items:center; gap:8px; font-size:13px; padding:8px 10px; background:var(--surface-2); border-radius:var(--r-control);">
                ${iconSvg('file-text',{size:15})} <span style="flex:1;">${f.nama}</span>
                <button onclick="openPreviewModal('${f.url}', '${f.nama.replace(/'/g,"\\'")}')" style="background:none; border:none; color:var(--pink); font-weight:700; font-size:12px; cursor:pointer;">Preview</button>
                <button onclick="downloadFile('${f.url}', '${f.nama.replace(/'/g,"\\'")}', this)" style="background:none; border:none; color:var(--text-2); font-weight:700; font-size:12px; cursor:pointer;">Unduh</button>
              </div>`).join('')}
          </div>` : ''}

        ${status === 'pending_approval' ? `
          <div class="action-row" style="margin-top:14px;">
            <button class="btn btn-primary" data-action="approve" data-id="${m.id}">${iconSvg('check',{size:14})} Approve</button>
            <button class="btn btn-reject" data-action="reject" data-id="${m.id}">${iconSvg('x',{size:14})} Tolak</button>
          </div>` : ''}
      </div>`).join('');

    // Ambil jumlah soal per modul (query terpisah, ringan)
    const questionsCache = {};
    modules.forEach(async (m) => {
      const qq = query(collection(db, 'questions'), where('moduleId', '==', m.id));
      const qs = await getDocs(qq);
      const list = [];
      qs.forEach(d => list.push(d.data()));
      list.sort((a,b) => (a.urutan||0) - (b.urutan||0));
      questionsCache[m.id] = list;
      const target = document.getElementById(`qcount-${m.id}`);
      if(target) target.textContent = `${list.length} soal post-test`;
    });

    el.querySelectorAll('[data-action="toggle-questions"]').forEach(link => link.addEventListener('click', () => {
      const id = link.dataset.id;
      const box = document.getElementById(`questions-${id}`);
      if(box.style.display === 'block'){ box.style.display = 'none'; link.textContent = 'Lihat Soal'; return; }
      const qs = questionsCache[id] || [];
      const TIPE_LABEL = { multiple_choice:'Pilihan Ganda', likert:'Skala 1-4', free_text:'Jawaban Teks', file_upload:'Submission File' };
      box.innerHTML = !qs.length ? `<p class="text-meta">Belum ada soal.</p>` : qs.map((q,i) => `
        <div style="border-top:1px solid var(--border); padding:10px 0;">
          <div class="text-meta" style="margin-bottom:4px;">Soal ${i+1} · ${TIPE_LABEL[q.tipe]||q.tipe}</div>
          <div style="font-size:13px; margin-bottom:6px;">${q.pertanyaan || '(kosong)'}</div>
          ${q.tipe === 'multiple_choice' ? (q.pilihan||[]).map(opt => `
            <div style="font-size:12px; padding:4px 8px; border-radius:6px; margin-bottom:3px; ${opt===q.jawabanBenar ? 'background:var(--green-bg); color:var(--green); font-weight:700;' : 'color:var(--text-2);'}">
              ${opt===q.jawabanBenar ? iconSvg('check',{size:12}) : ''} ${opt}
            </div>`).join('') : ''}
        </div>`).join('');
      box.style.display = 'block';
      link.textContent = 'Sembunyikan Soal';
    }));

    el.querySelectorAll('[data-action="approve"]').forEach(btn => btn.addEventListener('click', () => setStatus(btn.dataset.id, 'published')));
    el.querySelectorAll('[data-action="reject"]').forEach(btn => btn.addEventListener('click', () => setStatus(btn.dataset.id, 'rejected')));
  }

  async function setStatus(moduleId, newStatus){
    try{
      await updateDoc(doc(db, 'modules', moduleId), { status: newStatus, reviewedAt: serverTimestamp(), reviewedBy: currentProfile.email });
      showToast(newStatus === 'published' ? 'Modul di-publish.' : 'Modul ditolak.');
      loadModules(activeStatus);
    } catch(err){
      showToast('Gagal update: ' + err.message);
    }
  }

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => loadModules(btn.dataset.status));
  });

  onAuth(async (user) => {
    const gate = document.getElementById('gate');
    const shell = document.getElementById('appShell');
    if(!user){
      gate.style.display = 'block'; shell.style.display = 'none';
      document.getElementById('gateTitle').textContent = 'Silakan login';
      document.getElementById('gateSub').innerHTML = `<a href="login_test.html">Login dulu di sini</a>, baru buka halaman ini lagi.`;
      return;
    }
    currentProfile = await ensureUserProfile(user);
    if(currentProfile.role !== 'admin'){
      gate.style.display = 'block'; shell.style.display = 'none';
      document.getElementById('gateTitle').textContent = 'Akses ditolak';
      document.getElementById('gateSub').textContent = 'Halaman ini cuma buat Admin. Akun Anda role-nya: ' + currentProfile.role;
      return;
    }
    gate.style.display = 'none'; shell.style.display = 'block';
    document.getElementById('userAvatar').src = currentProfile.photoURL;
    document.getElementById('userName').textContent = currentProfile.displayName;
    loadModules('pending_approval');
  });
</script>
</body>
</html>
