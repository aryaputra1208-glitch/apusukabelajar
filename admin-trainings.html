<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  .avatar { width: 28px; height: 28px; border-radius: 50%; }
  .user-chip { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }
  .tabs { display: flex; gap: 6px; margin-bottom: 18px; }
  .tab-btn { padding: 8px 16px; border-radius: var(--r-control); font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); }
  .tab-btn.active { background: var(--pink); border-color: var(--pink); color: #fff; }
  .search-box { max-width: 320px; margin-bottom: 16px; }
</style>
<link rel="expect" href="#lms-nav-ready" blocking="render">
</head>
<body><script>/* sidebar LMS dari cache — inline supaya ikut paint pertama (tanpa kedip) */(function () { try { var c = JSON.parse(sessionStorage.getItem('lmsNavCache') || 'null'); if (!c || !c.html) return; var st = document.createElement('style'); st.id = 'lms-shell-css'; st.textContent = c.css; document.head.appendChild(st); var box = document.createElement('div'); box.innerHTML = c.html; var nav = box.firstElementChild; if (c.sig) nav.setAttribute('data-sig', c.sig); var cur = location.pathname.split('/').pop() || 'index.html'; nav.querySelectorAll('a.as-item').forEach(function (a) { a.classList.toggle('active', a.getAttribute('href') === cur); }); document.body.prepend(nav); document.body.classList.add('has-admin-sidebar'); } catch (e) {} })();</script><i id="lms-nav-ready" hidden></i><script>/* loading screen LMS — tampil sampai halaman siap (appShell muncul / gate berisi pesan) */(function(){var id=document.documentElement.lang==='id';/* cek versi: kalau browser masih menyimpan halaman versi lama, muat ulang sekali */var BUILD='20261118-094757';try{fetch('build.txt?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():''}).then(function(v){v=(v||'').trim();if(v&&v!==BUILD&&sessionStorage.getItem('tmsBuildReload')!==v){sessionStorage.setItem('tmsBuildReload',v);location.reload()}}).catch(function(){})}catch(e){}var css='body.tms-loading #gate{display:none!important}.tms-loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:36;transition:opacity .35s ease;background:rgba(246,246,250,.35);-webkit-backdrop-filter:blur(18px) saturate(1.1);backdrop-filter:blur(18px) saturate(1.1)}body.has-admin-sidebar .tms-loader{left:232px}.tms-loader.out{opacity:0;pointer-events:none}.tms-loader .bx{display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 34px;border-radius:20px;background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.7);box-shadow:0 12px 40px rgba(0,0,0,.08);min-width:240px}.tms-loader .t{font-weight:700;font-size:15px;color:#1d1d1f}.tms-loader .s{font-size:12.5px;color:#86868b;text-align:center;max-width:260px}.tms-loader .s:empty{display:none}.tms-loader .bar{width:200px;height:5px;border-radius:99px;background:rgba(230,0,122,.12);overflow:hidden}.tms-loader .bar i{display:block;width:40%;height:100%;border-radius:99px;background:#E6007A;animation:tmsBar 1.1s ease-in-out infinite}@keyframes tmsBar{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}@media (max-width:900px){body.has-admin-sidebar .tms-loader{left:0}}@media (prefers-reduced-motion:reduce){.tms-loader .bar i{animation-duration:2.4s}}';var st=document.createElement('style');st.textContent=css;document.head.appendChild(st);document.body.classList.add('tms-loading');var L=document.createElement('div');L.className='tms-loader';L.setAttribute('role','status');L.innerHTML='<div class="bx"><div class="t">'+(id?'Memuat data…':'Loading data…')+'</div><div class="bar"><i></i></div><div class="s"></div></div>';document.body.appendChild(L);var sub=L.querySelector('.s');var t1=setTimeout(function(){sub.textContent=id?'Sebentar lagi…':'Almost there…'},3500);var t2=setTimeout(function(){sub.textContent=id?'Lebih lama dari biasanya. Cek koneksi, lalu refresh kalau tidak kunjung muncul.':'Taking longer than usual. Check your connection, then refresh if nothing appears.'},15000);window.tmsReady=window.appReady=function(){window.__tmsReady=true;check()};function ready(){var g=document.getElementById('gate'),gt=document.getElementById('gateTitle');if(window.__tmsReady)return true;if(g&&g.style.display!=='none'&&gt&&gt.textContent.trim()&&!/^(loading|memuat)/i.test(gt.textContent.trim()))return true;return false}var mo;function check(){if(!ready())return;mo&&mo.disconnect();clearTimeout(t1);clearTimeout(t2);document.body.classList.remove('tms-loading');L.classList.add('out');setTimeout(function(){L.remove()},380)}mo=new MutationObserver(check);mo.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['style','class'],characterData:true});})();</script>

<div id="gate" class="locked-state" style="display:none;">
  <p class="text-h2" id="gateTitle" style="margin-bottom:8px;">Loading...</p>
  <p class="text-sub" id="gateSub"></p>
</div>

<div id="appShell" style="display:none;">
  <div class="topbar">
    <div style="display:flex; align-items:center; gap:16px;">
      <a href="index.html" class="sidebar-logo" style="margin:0; text-decoration:none;">anteraja LMS</a>
      <a href="index.html" class="text-sub" style="text-decoration:none; display:flex; align-items:center; gap:4px;">← Main Menu</a>
    </div>
    <div class="user-chip">
      <img class="avatar" id="userAvatar" src="">
      <span id="userName"></span>
    </div>
  </div>

  <div class="wrap" style="max-width:1000px;">
    <h1 class="text-h1">All Trainings</h1>

    <div class="tabs">
      <div class="tab-btn active" data-mode="all">All</div>
      <div class="tab-btn" data-mode="online">Online</div>
      <div class="tab-btn" data-mode="offline">Offline</div>
    </div>
    <input type="text" id="searchBox" class="search-box" placeholder="Search training title...">

    <div class="panel">
      <table class="data-table">
        <thead><tr>
          <th>Title</th><th>Mode</th><th>Category</th><th>Trainer</th><th>Status</th><th>Actions</th>
        </tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="empty-state" id="emptyState" style="display:none;"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { auth, db, onAuth, ensureUserProfile } from './firebase-shared.js';
  import { iconSvg } from './lms-icons.js';
  import { collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

  const FORMS_BASE_URL = 'https://aryaputra1208-glitch.github.io/apusukabelajar/training-forms.html';

  let allModules = [];
  let activeMode = 'all';

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2500);
  }
  function statusBadge(s){
    const map = { draft:'badge-gray', pending_approval:'badge-amber', published:'badge-green', rejected:'badge-red' };
    const label = { draft:'Draft', pending_approval:'Pending', published:'Published', rejected:'Rejected' };
    return `<span class="badge ${map[s]||'badge-gray'}">${label[s]||s}</span>`;
  }

  function render(){
    const filterText = (document.getElementById('searchBox').value || '').toLowerCase();
    let rows = allModules.filter(m => (m.judul||'').toLowerCase().includes(filterText));
    if(activeMode !== 'all') rows = rows.filter(m => (m.mode||'online') === activeMode);

    const body = document.getElementById('tableBody');
    const empty = document.getElementById('emptyState');
    if(!rows.length){
      body.innerHTML = '';
      empty.style.display = 'block';
      empty.innerHTML = iconSvg('inbox',{size:24}) + `<p style="margin-top:8px;">No trainings found.</p>`;
      return;
    }
    empty.style.display = 'none';

    body.innerHTML = rows.map(m => `
      <tr>
        <td><strong>${m.judul}</strong><div class="text-meta">${m.kategori||'-'}</div></td>
        <td><span class="badge ${m.mode==='offline'?'badge-purple':'badge-blue'}">${m.mode==='offline'?'Offline':'Online'}</span></td>
        <td class="text-meta">${m.kategori||'-'}</td>
        <td class="text-meta">${m.createdByName||'-'}</td>
        <td>${statusBadge(m.status)}</td>
        <td>
          <div style="display:flex; gap:6px;">
            <a class="icon-btn row-action ra-gray" href="trainer-create-module.html?edit=${m.id}" title="Edit">${iconSvg('settings',{size:14})}</a>
            ${m.mode==='offline' ? `<button class="icon-btn row-action ${m.postTestOpen?'ra-green':'ra-gray'}" data-id="${m.id}" data-open="${!m.postTestOpen}" data-action="toggle-posttest" title="${m.postTestOpen?'Post-test open — click to close':'Open Post-Test'}">${iconSvg(m.postTestOpen?'lock-open':'lock',{size:14})}</button>` : ''}
            ${m.mode==='offline' ? `<button class="icon-btn row-action ra-blue" data-id="${m.id}" data-judul="${(m.judul||'').replace(/"/g,'&quot;')}" data-action="copy-link" title="Copy Link Form">${iconSvg('link',{size:14})}</button>` : ''}
          </div>
        </td>
      </tr>`).join('');

    body.querySelectorAll('[data-action="toggle-posttest"]').forEach(btn => {
      btn.addEventListener('click', async () => {
        try{
          await updateDoc(doc(db, 'modules', btn.dataset.id), { postTestOpen: btn.dataset.open === 'true' });
          showToast('Post-test status updated.');
          const m = allModules.find(x => x.id === btn.dataset.id);
          if(m) m.postTestOpen = btn.dataset.open === 'true';
          render();
        } catch(err){ showToast('Update failed: ' + err.message); }
      });
    });

    body.querySelectorAll('[data-action="copy-link"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const base = FORMS_BASE_URL || '[FORMS_BASE_URL not set up]';
        const link = `${base}?training=${btn.dataset.id}`;
        navigator.clipboard.writeText(link).then(() => showToast('Link copied: ' + link)).catch(() => {
          prompt('Copy this link manually:', link);
        });
      });
    });
  }

  document.getElementById('searchBox').addEventListener('input', render);
  document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeMode = btn.dataset.mode;
    render();
  }));

  onAuth(async (user) => { try {
    const gate = document.getElementById('gate');
    const shell = document.getElementById('appShell');
    if(!user){
      gate.style.display = 'block'; shell.style.display = 'none';
      document.getElementById('gateTitle').textContent = 'Please sign in';
      document.getElementById('gateSub').innerHTML = `<a href="index.html">Sign in here</a>.`;
      return;
    }
    const profile = await ensureUserProfile(user);
    if(profile.role !== 'admin'){
      gate.style.display = 'block'; shell.style.display = 'none';
      document.getElementById('gateTitle').textContent = 'Access denied';
      document.getElementById('gateSub').textContent = 'This page is for Admins only.';
      return;
    }
    gate.style.display = 'none'; shell.style.display = 'block';
    document.getElementById('userAvatar').src = profile.photoURL;
    document.getElementById('userName').textContent = profile.displayName;

    const snap = await getDocs(collection(db, 'modules'));
    allModules = [];
    snap.forEach(d => allModules.push({ id: d.id, ...d.data() }));
    render();
  } finally { window.appReady?.(); } // loading screen hilang setelah semua data halaman tampil
  });
</script>
<script type="module" src="./admin-shell.js?v=20261118a"></script>
<script src="./lms-motion.js?v=20261109" defer></script>
</body>
</html>
