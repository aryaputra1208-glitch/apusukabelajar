<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Users — Anteraja LMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./lms-design-system.css?v=20261105b">
<link rel="stylesheet" href="./lms-glass.css?v=20261109">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  .avatar { width: 28px; height: 28px; border-radius: 50%; }
  .avatar-sm { width: 26px; height: 26px; border-radius: 50%; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; }
  .user-chip { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }
  .u-row { display: grid; grid-template-columns: 2fr 1fr 1.2fr 1fr 1fr auto; gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .u-row:last-child { border-bottom: none; }
  .u-row input, .u-row select { margin-bottom: 0; }
  .u-name { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .search-box { max-width: 320px; margin-bottom: 16px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 18px; }
  .tab-btn { padding: 8px 16px; border-radius: var(--r-control); font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); }
  .tab-btn.active { background: var(--pink); border-color: var(--pink); color: #fff; }
  .add-row { display: grid; grid-template-columns: 1.4fr 1.4fr 1fr 1fr auto; gap: 8px; align-items: end; }
  .add-row input, .add-row select { margin-bottom: 0; }
</style>
</head>
<body>

<div id="gate" class="locked-state" style="display:none;">
  <p class="text-h2" id="gateTitle" style="margin-bottom:8px;">Loading...</p>
  <p class="text-sub" id="gateSub"></p>
</div>

<div id="appShell" style="display:none;">
  <div class="topbar">
    <div style="display:flex; align-items:center; gap:16px;">
      <a href="index.html" class="sidebar-logo" style="margin:0; text-decoration:none;">anteraja LMS</a>
      <a href="index.html" class="text-sub" style="text-decoration:none; display:flex; align-items:center; gap:4px;">← Main Menu</a>
    </div>
    <div class="user-chip">
      <img class="avatar" id="userAvatar" src="">
      <span id="userName"></span>
    </div>
  </div>

  <div class="wrap">
    <h1 class="text-h1">Manage Users</h1>

    <div class="card" style="margin-bottom:16px;">
      <h2 class="text-h2" style="margin-bottom:6px;">Add One Person</h2>
      <div class="add-row" style="grid-template-columns: 1.4fr 1.4fr 1fr 1fr 1fr auto;">
        <div><label>Name</label><input type="text" id="addNama" placeholder="Full name"></div>
        <div><label>Email</label><input type="text" id="addEmail" placeholder="name@domain.com"></div>
        <div><label>Division</label><input type="text" id="addDivisi" placeholder="e.g. OPERATION"></div>
        <div><label>Level</label><select id="addLevel"></select></div>
        <div><label>Role</label>
          <select id="addRole">
            <option value="trainee">Trainee</option>
            <option value="trainer">Trainer</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <button class="btn btn-primary" id="addOneBtn" style="margin-bottom:14px;">Add</button>
      </div>
    </div>

    <div class="card" style="margin-bottom:20px;">
      <h2 class="text-h2" style="margin-bottom:6px;">Bulk Add via Excel</h2>
      <p class="text-sub" style="margin-bottom:12px;">Columns: <strong>Nama, Email, Divisi, Level</strong>, optional <strong>Role</strong> (admin/trainer/trainee; blank = trainee). Re-uploads update by email.</p>
      <div class="dropzone" id="excelDropzone"></div>
      <input type="file" id="excelFileInput" accept=".xlsx,.xls" style="display:none">
      <div id="bulkResult" class="text-meta" style="margin-top:10px;"></div>
    </div>

    <div class="tabs">
      <div class="tab-btn active" data-tab="all" id="tabAll">All Registered</div>
      <div class="tab-btn" data-tab="active" id="tabActive">Signed In</div>
      <div class="tab-btn" data-tab="pending" id="tabPending">Never Signed In</div>
    </div>
    <input type="text" id="searchBox" class="search-box" placeholder="Search name/email...">

    <div class="panel">
      <div class="u-row" style="background:var(--surface-2); font-size:11px; color:var(--text-3); font-weight:700;">
        <span>NAME</span><span>STATUS</span><span>DIVISION</span><span>LEVEL</span><span>ROLE</span><span></span>
      </div>
      <div id="userList"></div>
    </div>
    <div class="empty-state" id="emptyState" style="display:none;"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { auth, db, onAuth, ensureUserProfile } from './firebase-shared.js';
  import { iconSvg } from './lms-icons.js';
  import { collection, getDocs, doc, setDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

  const LEVEL_OPTIONS = ['','Admin','Leader','Coordinator','Staff','Supervisor','Section Head','Department Head','AVP','VP','SVP'];
  document.getElementById('addLevel').innerHTML = LEVEL_OPTIONS.map(l => `<option value="${l}">${l||'- Select -'}</option>`).join('');

  // Gabungan 2 sumber: approved_users (pra-daftar) + users (yang sudah login).
  // 1 baris per email; kalau sudah login, datanya diambil dari users/{uid} (lebih akurat, ada nama Google asli).
  let merged = [];
  let activeTab = 'all';

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2500);
  }
  function initials(name){ return (name||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

  async function loadAll(){
    const approvedSnap = await getDocs(collection(db, 'approved_users'));
    const usersSnap = await getDocs(collection(db, 'users'));
    const adminsSnap = await getDocs(collection(db, 'admins'));
    const trainersSnap = await getDocs(collection(db, 'trainers'));

    const adminEmails = new Set(); adminsSnap.forEach(d => adminEmails.add(d.id));
    const trainerEmails = new Set(); trainersSnap.forEach(d => trainerEmails.add(d.id));
    function roleFor(email){ return adminEmails.has(email) ? 'admin' : (trainerEmails.has(email) ? 'trainer' : 'trainee'); }

    const byEmail = {};
    approvedSnap.forEach(d => {
      const data = d.data();
      byEmail[d.id] = { email: d.id, nama: data.nama || '', divisi: data.divisi || '', level: data.level || '', active: false, uid: null, role: roleFor(d.id) };
    });
    usersSnap.forEach(d => {
      const data = d.data();
      const email = data.email;
      byEmail[email] = {
        email, nama: data.displayName || byEmail[email]?.nama || '',
        divisi: data.divisi || byEmail[email]?.divisi || '',
        level: data.level || byEmail[email]?.level || '',
        active: true, uid: d.id, role: roleFor(email),
      };
    });
    merged = Object.values(byEmail);
    render();
  }

  function render(){
    const filterText = (document.getElementById('searchBox').value || '').toLowerCase();
    let rows = merged.filter(u => u.nama.toLowerCase().includes(filterText) || u.email.toLowerCase().includes(filterText));
    if(activeTab === 'active') rows = rows.filter(u => u.active);
    if(activeTab === 'pending') rows = rows.filter(u => !u.active);

    const el = document.getElementById('userList');
    const empty = document.getElementById('emptyState');
    if(!rows.length){
      el.innerHTML = '';
      empty.style.display = 'block';
      empty.innerHTML = iconSvg('inbox',{size:24}) + `<p style="margin-top:8px;">No data.</p>`;
      return;
    }
    empty.style.display = 'none';

    el.innerHTML = rows.map(u => `
      <div class="u-row" data-email="${u.email}">
        <div class="u-name">
          <div class="avatar-sm" style="background:var(--pink-bg); color:var(--pink-dark);">${initials(u.nama)}</div>
          <div>
            <div style="font-weight:600;">${u.nama || '(no name yet)'}</div>
            <div class="text-meta">${u.email}</div>
          </div>
        </div>
        ${u.active ? `<span class="badge badge-green">Active</span>` : `<span class="badge badge-amber">Not signed in</span>`}
        <input type="text" data-field="divisi" value="${u.divisi.replace(/"/g,'&quot;')}" placeholder="e.g. OPERATION">
        <select data-field="level">
          ${LEVEL_OPTIONS.map(l => `<option value="${l}" ${u.level===l?'selected':''}>${l||'- Not set -'}</option>`).join('')}
        </select>
        <select data-field="role">
          <option value="trainee" ${u.role==='trainee'?'selected':''}>Trainee</option>
          <option value="trainer" ${u.role==='trainer'?'selected':''}>Trainer</option>
          <option value="admin" ${u.role==='admin'?'selected':''}>Admin</option>
        </select>
        <button class="icon-btn tone-pink" data-action="save" title="Save"></button>
      </div>`).join('');

    el.querySelectorAll('[data-action="save"]').forEach(btn => {
      btn.innerHTML = iconSvg('device-floppy', {size:15});
      btn.addEventListener('click', () => {
        const row = btn.closest('.u-row');
        const email = row.dataset.email;
        const divisi = row.querySelector('[data-field="divisi"]').value.trim();
        const level = row.querySelector('[data-field="level"]').value;
        const role = row.querySelector('[data-field="role"]').value;
        saveOne(email, divisi, level, undefined, role);
      });
    });
  }

  /** Simpan ke approved_users (selalu) + admins/trainers (kalau role bukan trainee) + users/{uid} kalau sudah pernah login. */
  async function saveOne(email, divisi, level, nama, role){
    const existing = merged.find(u => u.email === email);
    role = role || existing?.role || 'trainee';
    try{
      await setDoc(doc(db, 'approved_users', email), {
        nama: nama ?? existing?.nama ?? '', divisi, level, updatedAt: serverTimestamp(),
      }, { merge: true });

      // Pastikan cuma ada di 1 whitelist (admins ATAU trainers), sesuai role yang dipilih.
      if(role === 'admin'){
        await setDoc(doc(db, 'admins', email), { addedAt: serverTimestamp() });
        await deleteDoc(doc(db, 'trainers', email)).catch(() => {});
      } else if(role === 'trainer'){
        await setDoc(doc(db, 'trainers', email), { addedAt: serverTimestamp() });
        await deleteDoc(doc(db, 'admins', email)).catch(() => {});
      } else {
        await deleteDoc(doc(db, 'admins', email)).catch(() => {});
        await deleteDoc(doc(db, 'trainers', email)).catch(() => {});
      }

      if(existing?.active && existing.uid){
        await updateDoc(doc(db, 'users', existing.uid), { divisi, level, role });
      }
      if(existing){ existing.divisi = divisi; existing.level = level; existing.role = role; }
      showToast('Saved.');
      render();
    } catch(err){
      showToast('Save failed: ' + err.message);
    }
  }

  document.getElementById('searchBox').addEventListener('input', render);
  document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeTab = btn.dataset.tab;
    render();
  }));

  /* ===== Tambah 1 orang ===== */
  document.getElementById('addOneBtn').addEventListener('click', async () => {
    const nama = document.getElementById('addNama').value.trim();
    const email = document.getElementById('addEmail').value.trim().toLowerCase();
    const divisi = document.getElementById('addDivisi').value.trim();
    const level = document.getElementById('addLevel').value;
    const role = document.getElementById('addRole').value;
    if(!email){ showToast('Email is required.'); return; }
    await saveOne(email, divisi, level, nama, role);
    if(!merged.find(u => u.email === email)) merged.push({ email, nama, divisi, level, role, active:false, uid:null });
    document.getElementById('addNama').value = '';
    document.getElementById('addEmail').value = '';
    document.getElementById('addDivisi').value = '';
    document.getElementById('addLevel').value = '';
    document.getElementById('addRole').value = 'trainee';
    render();
  });

  /* ===== Tambah banyak via Excel ===== */
  const excelDz = document.getElementById('excelDropzone');
  const excelInput = document.getElementById('excelFileInput');
  excelDz.innerHTML = iconSvg('upload', {size:20}) + ' <span>Drag &amp; drop an .xlsx file here, or click to browse</span>';
  excelDz.addEventListener('click', () => excelInput.click());
  excelInput.addEventListener('change', e => { if(e.target.files[0]) handleExcelFile(e.target.files[0]); });
  excelDz.addEventListener('dragover', e => { e.preventDefault(); excelDz.classList.add('drag-over'); });
  excelDz.addEventListener('dragleave', () => excelDz.classList.remove('drag-over'));
  excelDz.addEventListener('drop', e => {
    e.preventDefault(); excelDz.classList.remove('drag-over');
    if(e.dataTransfer.files[0]) handleExcelFile(e.dataTransfer.files[0]);
  });

  function handleExcelFile(file){
    const reader = new FileReader();
    reader.onload = async (e) => {
      try{
        const wb = XLSX.read(e.target.result, { type: 'binary' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });

        let count = 0, skipped = 0;
        for(const row of rows){
          const email = String(row.Email || row.email || '').trim().toLowerCase();
          const nama = String(row.Nama || row.nama || '').trim();
          const divisi = String(row.Divisi || row.divisi || '').trim();
          const level = String(row.Level || row.level || '').trim();
          const roleRaw = String(row.Role || row.role || '').trim().toLowerCase();
          const role = ['admin','trainer','trainee'].includes(roleRaw) ? roleRaw : 'trainee';
          if(!email){ skipped++; continue; }
          await saveOne(email, divisi, level, nama, role);
          if(!merged.find(u => u.email === email)) merged.push({ email, nama, divisi, level, role, active:false, uid:null });
          count++;
        }
        document.getElementById('bulkResult').textContent =
          `${count} people added/updated.` + (skipped ? ` ${skipped} rows skipped (empty email).` : '');
        render();
        showToast(`${count} people added/updated from Excel.`);
      } catch(err){
        showToast('Could not read file: ' + err.message);
      }
    };
    reader.readAsBinaryString(file);
  }

  onAuth(async (user) => {
    const gate = document.getElementById('gate');
    const shell = document.getElementById('appShell');
    if(!user){
      gate.style.display = 'block'; shell.style.display = 'none';
      document.getElementById('gateTitle').textContent = 'Please sign in';
      document.getElementById('gateSub').innerHTML = `<a href="index.html">Sign in here</a>.`;
      return;
    }
    const profile = await ensureUserProfile(user);
    if(profile.role !== 'admin'){
      gate.style.display = 'block'; shell.style.display = 'none';
      document.getElementById('gateTitle').textContent = 'Access denied';
      document.getElementById('gateSub').textContent = 'This page is for Admins only.';
      return;
    }
    gate.style.display = 'none'; shell.style.display = 'block';
    document.getElementById('userAvatar').src = profile.photoURL;
    document.getElementById('userName').textContent = profile.displayName;
    loadAll();
  });
</script>
<script type="module" src="./admin-shell.js?v=20261108"></script>
<script src="./lms-motion.js?v=20261109" defer></script>
</body>
</html>
